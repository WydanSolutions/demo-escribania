<style>
/* ===== css/01-base.css ===== */
/* ============================================================
   BASE · colores, tipografías y piezas que se repiten
   Los colores y las tipografías están SOLO acá, en :root.
   ============================================================ */
:root{
  /* Identidad de la escribanía */
  --bordo:#5A1F2E;        /* principal: sellos, títulos, botón */
  --bordo-claro:#7A3043;
  --carbon:#2B2B2B;       /* texto */
  --beige:#F5F0E8;        /* fondo de papel */
  --blanco:#FFFFFF;       /* tarjetas */
  --borde:#E4DCD0;
  --dorado:#B9975B;       /* detalles finos */
  --dorado-suave:#EFE4CE;

  /* Estados */
  --oliva:#6E8F5E;        /* al día · cobrado · inscripto */
  --ambar:#C9962E;        /* vence pronto · pendiente */
  --terracota:#B5463C;    /* vencido · negativo */
  --oliva-f:#EDF2E9; --ambar-f:#FBF2DF; --terracota-f:#F8E9E7;

  /* Texto */
  --tinta:#2B2B2B;
  --tinta2:#6F6760;
  --tinta3:#9A9289;

  /* Tipografías */
  --serif:'Libre Baskerville',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

  /* Formas */
  --r:12px; --r2:10px; --r3:8px;
  --sombra:0 1px 2px rgba(43,43,43,.04),0 6px 18px rgba(43,43,43,.05);
  --sombra-alta:0 10px 40px rgba(43,43,43,.14);
  --lateral:232px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); font-size:15px; line-height:1.5; color:var(--tinta);
  background:var(--beige); -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.sin-scroll{overflow:hidden}
.hidden{display:none!important}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; color:var(--bordo); margin:0; line-height:1.25}
h1{font-size:25px} h2{font-size:20px} h3{font-size:17px} h4{font-size:15px}
a{color:var(--bordo)}
b,strong{font-weight:600}
small{font-size:12.5px; color:var(--tinta2)}
hr{border:0;border-top:1px solid var(--borde);margin:18px 0}
::selection{background:var(--dorado-suave)}

/* ---------- Marca (logo en código) ---------- */
.marca-h{display:inline-flex;align-items:center;gap:10px}
.marca-h svg{flex:0 0 auto}
.marca-txt{display:flex;flex-direction:column;line-height:1.1}
.marca-txt b{font-family:var(--serif);font-size:12.5px;letter-spacing:.09em;color:var(--bordo)}
.marca-txt i{font-family:var(--serif);font-style:normal;font-size:10px;letter-spacing:.26em;color:var(--dorado)}
.marca-c{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.marca-c-t{font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:var(--dorado);margin-top:12px}
.marca-c-n{font-family:var(--serif);font-size:17px;letter-spacing:.14em;color:var(--bordo);font-weight:700}
.marca-c-l{font-size:11.5px;letter-spacing:.2em;color:var(--tinta3);text-transform:uppercase;margin-top:3px}

/* ---------- Botones ---------- */
.btn{
  font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer;
  border:1px solid var(--borde); background:var(--blanco); color:var(--tinta);
  padding:9px 15px; border-radius:var(--r3); transition:.15s ease;
  display:inline-flex; align-items:center; gap:7px; line-height:1.2;
}
.btn:hover{border-color:var(--dorado);background:#FFFDF9}
.btn.p{background:var(--bordo);border-color:var(--bordo);color:#fff;font-weight:600}
.btn.p:hover{background:var(--bordo-claro);border-color:var(--bordo-claro)}
.btn.d{background:var(--dorado);border-color:var(--dorado);color:#fff;font-weight:600}
.btn.d:hover{filter:brightness(1.07)}
.btn.s{background:transparent;border-color:transparent;color:var(--tinta2)}
.btn.s:hover{background:#0000000a;border-color:transparent}
.btn.mal{color:var(--terracota)} .btn.mal:hover{border-color:var(--terracota);background:var(--terracota-f)}
.btn.chico{padding:6px 11px;font-size:13px}
.btn.icono{padding:7px 9px}
.btn:disabled{opacity:.45;cursor:default}
.btn-fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Etiquetas de estado ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:99px;border:1px solid var(--borde);
  background:var(--blanco);color:var(--tinta2);white-space:nowrap;
}
.chip::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.75}
.chip.sin::before{display:none}
/* Verde */
.e-cobrado,.e-pagado,.e-obtenido,.e-inscripto,.e-firmada,.e-realizada,.e-cerrada,.e-recibido,.e-devuelto,.e-declarado,.e-confirmada
{color:#4D6B40;background:var(--oliva-f);border-color:#D4E0CC}
/* Ámbar */
.e-pendiente,.e-solicitado,.e-en-preparacion,.e-lista-para-firmar,.e-presentado,.e-consulta,.e-a-solicitar,.e-en-inscripcion,.e-reprogramada,.e-aplicado
{color:#8A6418;background:var(--ambar-f);border-color:#EEDFBF}
/* Terracota */
.e-vencido,.e-cancelada,.e-cancelado{color:#8E3029;background:var(--terracota-f);border-color:#EDD2CE}
/* Neutro */
.e-archivada{color:var(--tinta3);background:#F4F2EE}

.luz{display:inline-block;width:9px;height:9px;border-radius:99px;flex:0 0 auto}
.luz.ok{background:var(--oliva)} .luz.pronto{background:var(--ambar)} .luz.vencido{background:var(--terracota)}
.t-ok{color:var(--oliva)} .t-pronto{color:var(--ambar)} .t-vencido,.t-mal{color:var(--terracota)}
.f-ok{background:var(--oliva-f)} .f-pronto{background:var(--ambar-f)} .f-vencido{background:var(--terracota-f)}

/* ---------- Tarjetas ---------- */
.tarjeta{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra)}
.tarjeta>header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--borde);flex-wrap:wrap;
}
.tarjeta>header h3{display:flex;align-items:center;gap:9px}
.tarjeta>.cuerpo{padding:16px 18px}
.tarjeta>.cuerpo.sin-aire{padding:0}
.titulin{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta3);font-weight:600;font-family:var(--sans)}

/* ---------- Tablas (el centro de la herramienta) ---------- */
.tabla-marco{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3);
  font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--borde);
  white-space:nowrap;background:var(--blanco);
}
table.t td{padding:11px 12px;border-bottom:1px solid #F0EBE2;vertical-align:middle}
table.t tbody tr:hover{background:#FDFBF7}
table.t tbody tr.clic{cursor:pointer}
table.t tbody tr:last-child td{border-bottom:0}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .mini{font-size:12.5px;color:var(--tinta2)}
table.t tfoot td{padding:11px 12px;border-top:2px solid var(--borde);font-weight:600;background:#FDFBF7}
table.t.compacta td,table.t.compacta th{padding:7px 10px}
/* Tablas largas: se desplazan dentro de su propia tarjeta y el encabezado
   queda a la vista. Así la página no se hace eterna ni se superpone nada. */
@media(min-width:761px){
  .tabla-marco.alta{max-height:70vh;overflow:auto}
  .tabla-marco.alta table.t th{position:sticky;top:0;z-index:2}
  .tabla-marco.alta table.t tfoot td{position:sticky;bottom:0;z-index:2}
}
.eq{font-style:normal;color:var(--tinta3);font-size:12px}
.vacio{padding:34px 18px;text-align:center;color:var(--tinta3);font-size:14px}
.vacio b{display:block;font-family:var(--serif);color:var(--tinta2);font-size:15px;margin-bottom:4px}

/* ---------- Campos ---------- */
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.campo>span{font-size:12.5px;font-weight:600;color:var(--tinta2)}
.campo .ayuda{font-size:11.5px;color:var(--tinta3);font-style:normal}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],
input[type=email],input[type=tel],select,textarea{
  font-family:var(--sans);font-size:16px;color:var(--tinta);background:var(--blanco);
  border:1px solid var(--borde);border-radius:var(--r3);padding:9px 11px;width:100%;
  transition:.15s;appearance:none;
}
@media(min-width:760px){ input,select,textarea{font-size:14.5px} }
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--dorado);box-shadow:0 0 0 3px #B9975B22}
select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236F6760' stroke-width='1.4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:10px;padding-right:30px}
textarea{resize:vertical;min-height:70px}
.campo-si{flex-direction:row;align-items:center;gap:9px}
.campo-si input{width:18px;height:18px;flex:0 0 auto}
.campo-si>span{order:2;font-weight:500;color:var(--tinta)}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rejilla .ancho-2{grid-column:1/-1}
.f-sep{grid-column:1/-1;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dorado);border-bottom:1px solid var(--borde);padding-bottom:6px;margin:6px 0 12px}

/* ---------- Ventanitas propias ---------- */
.modal-fondo{position:fixed;inset:0;background:#2B2B2B6E;backdrop-filter:blur(2px);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.modal{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra-alta);width:100%;max-width:560px;
  animation:sube .22s ease}
.modal.ancho{max-width:860px} .modal.angosto{max-width:420px}
.modal>header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--borde)}
.modal .m-x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--tinta3);cursor:pointer;padding:0 4px}
.modal .m-x:hover{color:var(--terracota)}
.m-cuerpo{padding:18px 20px;max-height:min(70vh,640px);overflow:auto}
.m-pie{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--borde);
  background:#FDFBF7;border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Aviso abajo ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:120;
  background:var(--carbon);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--sombra-alta);max-width:92vw;text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#toast.t-mal{background:var(--terracota)} #toast.t-ok{background:#3E5A33}

/* ---------- Lista de sugerencias ---------- */
.sugeridos{position:fixed;z-index:130;background:var(--blanco);border:1px solid var(--borde);
  border-radius:var(--r3);box-shadow:var(--sombra-alta);overflow:auto;padding:4px}
.sugeridos button{display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:9px 11px;font-size:14.5px;font-family:var(--sans);color:var(--tinta);cursor:pointer;border-radius:6px}
.sugeridos button:hover,.sugeridos button.on{background:var(--dorado-suave)}

/* ---------- Animaciones sobrias ---------- */
.aparece{animation:aparece .3s ease both}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== css/02-bienvenida.css ===== */
/* ============================================================
   1) PRESENTACIÓN DE WYDAN   2) PANTALLA DE BLOQUEO
   ============================================================ */

/* ---------- Presentación de Wydan (identidad de Wydan, no del cliente) ---------- */
#bienvenida{
  position:fixed;inset:0;z-index:70;overflow:auto;
  background:#F4F6F9; color:#14294A;
  font-family:'Inter',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:34px 18px;
}
.bv-in{max-width:620px;width:100%;text-align:center;animation:aparece .5s ease both}
.bv-marca img{height:40px;width:auto}
.bv-para{margin-top:30px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#6E7C8C}
.bv-t{font-family:'Poppins','Inter',sans-serif;font-size:30px;font-weight:700;color:#14294A;margin:7px 0 2px;line-height:1.2}
.bv-s{font-size:14px;color:#6E7C8C;font-weight:500}
.bv-frase{font-size:15.5px;line-height:1.6;color:#39485C;max-width:520px;margin:20px auto 26px}
.bv-vista{
  background:#fff;border:1px solid #DCE3EC;border-radius:14px;padding:14px;
  box-shadow:0 18px 44px #14294a1a;text-align:left;
}
.bv-btn{
  margin-top:26px;background:#14294A;color:#fff;border:0;border-radius:10px;
  padding:14px 26px;font-size:15.5px;font-weight:600;font-family:'Poppins','Inter',sans-serif;
  cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:.18s;
}
.bv-btn:hover{background:#1D3C6B;transform:translateY(-1px)}
.bv-pie{margin-top:30px;font-size:12px;color:#8E9BA9;letter-spacing:.04em}

/* Vista previa en miniatura (con los colores del cliente) */
.vp{font-size:11px;color:var(--tinta2)}
.vp-barra{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--borde);padding-bottom:9px;margin-bottom:10px}
.vp-barra b{font-family:var(--serif);font-size:11px;letter-spacing:.1em;color:var(--bordo)}
.vp-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.vp-num{background:var(--beige);border:1px solid var(--borde);border-radius:7px;padding:7px 8px}
.vp-num i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
.vp-num b{font-family:var(--serif);font-size:13px;color:var(--bordo)}
.vp-filas{display:flex;flex-direction:column;gap:5px}
.vp-fila{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--borde);border-radius:6px;padding:5px 8px}
.vp-fila span{flex:1;height:5px;border-radius:9px;background:#EFE9DF}
.vp-fila span.corta{flex:.45}
.vp-fila .luz{flex:0 0 auto;height:7px}

/* ---------- Pantalla de bloqueo ---------- */
#bloqueo{
  position:fixed;inset:0;z-index:60;overflow:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;
  background:
    radial-gradient(1100px 700px at 50% -10%,#FFFCF6,#F1EADC 70%),
    repeating-linear-gradient(0deg,#00000005 0 1px,transparent 1px 4px);
}
/* Sello grande y tenue de fondo, con un movimiento de luz muy leve */
.bq-sello-fondo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  opacity:.055;pointer-events:none;color:var(--bordo);
  animation:respira 11s ease-in-out infinite;
}
.bq-sello-fondo svg{width:min(78vmin,620px);height:auto}
@keyframes respira{0%,100%{opacity:.045;transform:translate(-50%,-50%) scale(1)}50%{opacity:.075;transform:translate(-50%,-50%) scale(1.025)}}

.bq-tarjeta{
  position:relative;z-index:2;width:100%;max-width:392px;text-align:center;
  background:#FFFFFFC9;backdrop-filter:blur(10px) saturate(1.1);
  border:1px solid #FFFFFF;box-shadow:0 22px 60px #5a1f2e1f,0 1px 0 #fff inset;
  border-radius:16px;padding:30px 28px 26px;animation:aparece .45s ease both;
}
.bq-tarjeta.tiembla{animation:tiembla .4s}
@keyframes tiembla{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.bq-saludo{font-family:var(--serif);font-size:16px;color:var(--bordo);margin:18px 0 2px}
.bq-fecha{font-size:12.5px;color:var(--tinta3);margin-bottom:20px}
.bq-linea{height:1px;background:linear-gradient(90deg,transparent,var(--dorado),transparent);margin:0 0 20px}
.bq-tarjeta input{text-align:center;letter-spacing:.42em;font-size:19px;padding:12px;font-family:var(--serif)}
.bq-tarjeta .btn{width:100%;justify-content:center;margin-top:11px;padding:12px}
.bq-ayuda{margin-top:16px;font-size:12px;color:var(--tinta3);line-height:1.5}
.bq-ayuda b{color:var(--bordo)}
.bq-pie{position:relative;z-index:2;margin-top:26px;display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--tinta3);letter-spacing:.05em}
.bq-pie img{height:15px;opacity:.75}
.bq-volver{background:none;border:0;color:var(--tinta3);font-size:12.5px;cursor:pointer;margin-top:14px;
  font-family:var(--sans);position:relative;z-index:2}
.bq-volver:hover{color:var(--bordo)}


/* ===== css/03-app.css ===== */
/* ============================================================
   ESTRUCTURA DE LA PÁGINA · menú, barra de arriba y contenido
   ============================================================ */
#app{min-height:100vh}

/* ---------- Menú lateral (computadora) ---------- */
.lateral{
  position:fixed;top:0;left:0;bottom:0;width:var(--lateral);z-index:40;
  background:var(--bordo);color:#F2E6E9;display:flex;flex-direction:column;
  border-right:1px solid #00000022;
}
/* El logo va sobre blanco: sobre el bordó se perdían el sello y sus colores */
.lat-marca{height:64px;display:flex;align-items:center;padding:0 16px;
  background:var(--blanco);border-bottom:2px solid var(--dorado)}
.lat-marca .marca-h{gap:10px}
.lat-marca .marca-txt b{color:var(--bordo);font-size:10.8px;letter-spacing:.045em;white-space:nowrap}
.lat-marca .marca-txt i{font-size:9.5px;letter-spacing:.22em}
.lat-marca .marca-txt i{color:var(--dorado)}
.lat-menu{flex:1;overflow:auto;padding:10px 8px}
.lat-grupo{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#FFFFFF66;
  padding:14px 10px 6px;font-weight:600}
.lat-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;color:#EFDDE1;font-family:var(--sans);font-size:14px;
  padding:9px 11px;border-radius:var(--r3);cursor:pointer;transition:.14s;position:relative;
}
.lat-item:hover{background:#FFFFFF14;color:#fff}
.lat-item.on{background:#FFFFFF1F;color:#fff;font-weight:600}
.lat-item.on::before{content:'';position:absolute;left:-8px;top:8px;bottom:8px;width:3px;background:var(--dorado);border-radius:0 3px 3px 0}
.lat-item .ic{width:18px;text-align:center;font-size:15px;opacity:.9;flex:0 0 auto}
.lat-item .globo{margin-left:auto;background:var(--dorado);color:#3A2410;font-size:11px;font-weight:700;
  padding:1px 7px;border-radius:99px;min-width:20px;text-align:center}
.lat-item .globo.mal{background:#E8A79F;color:#6A1F18}
/* El pie también sobre blanco: el logo de Wydan es azul marino y sobre el bordó no se leía */
.lat-pie{padding:9px 14px;border-top:2px solid var(--dorado);background:var(--blanco);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.lat-pie img{width:88px;height:auto;opacity:1}

/* ---------- Barra de arriba ---------- */
.arriba{
  position:sticky;top:0;z-index:30;background:var(--beige);
  border-bottom:1px solid var(--borde);padding:12px 26px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 4px 10px -6px rgba(43,43,43,.18);
}
.arriba h1{font-size:21px;flex:0 0 auto}
.arriba .hoy{font-size:12.5px;color:var(--tinta3);white-space:nowrap}
.buscador{position:relative;flex:1;max-width:400px;margin-left:auto}
.buscador input{padding-left:33px;background:var(--blanco)}
.buscador::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--tinta3);pointer-events:none}
.menu-btn{display:none}

/* ---------- Contenido ---------- */
.contenido{margin-left:var(--lateral);min-height:100vh;display:flex;flex-direction:column}
.hoja{padding:22px 26px 60px;flex:1}
.seccion{display:none}
.seccion.on{display:block;animation:aparece .25s ease both}

/* Encabezado de cada sección */
.enc{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.enc .izq{min-width:0}
.enc h2{display:flex;align-items:center;gap:10px}
.enc p{margin:4px 0 0;font-size:13.5px;color:var(--tinta2);max-width:640px}

/* ---------- Solapas internas ---------- */
.solapas{display:flex;gap:2px;border-bottom:1px solid var(--borde);margin-bottom:18px;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.solapas button{
  background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--tinta2);
  padding:10px 15px;white-space:nowrap;transition:.14s;
}
.solapas button:hover{color:var(--bordo)}
.solapas button.on{color:var(--bordo);border-bottom-color:var(--bordo);font-weight:600}

/* ---------- Filtros ---------- */
.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filtros select,.filtros input{width:auto;min-width:140px;font-size:13.5px;padding:7px 10px;background:var(--blanco)}
.filtros .crece{flex:1;min-width:190px}
.filtros .cuenta{font-size:12.5px;color:var(--tinta3);margin-left:auto;white-space:nowrap}

/* ---------- Rejillas ---------- */
.cols{display:grid;gap:16px}
/* Que ninguna caja se estire más que su columna: lo ancho se desliza adentro */
.cols>*,.nums>*,.cuenta-bloques>*,.rejilla>*,.datos>*{min-width:0}
.tarjeta,.tarjeta>.cuerpo,.num,.ficha-tapa{min-width:0;max-width:100%}
.tabla-marco{max-width:100%}
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols.p23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols.p32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1180px){
  .cols.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols.p23,.cols.p32{grid-template-columns:1fr}
}

/* ---------- Menú del celular ---------- */
.tapa{position:fixed;inset:0;background:#2B2B2B66;z-index:39;display:none}
.tapa.ver{display:block}
.abajo{display:none}


/* ===== css/04-secciones.css ===== */
/* ============================================================
   PIEZAS DE CADA SECCIÓN
   ============================================================ */

/* ---------- Números del panel ---------- */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.num{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--sombra);position:relative;overflow:hidden}
.num::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dorado);opacity:.5}
.num.ok::after{background:var(--oliva);opacity:1} .num.pronto::after{background:var(--ambar);opacity:1}
.num.vencido::after{background:var(--terracota);opacity:1}
.num i{display:block;font-style:normal;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta3);font-weight:600;margin-bottom:5px}
.num b{font-family:var(--serif);font-size:23px;color:var(--bordo);display:block;line-height:1.15;
  font-variant-numeric:tabular-nums}
.num small{display:block;margin-top:3px;font-size:12px;color:var(--tinta2)}
.num.clic{cursor:pointer;transition:.15s} .num.clic:hover{border-color:var(--dorado);transform:translateY(-1px)}
@media(max-width:1180px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Listas de avisos ---------- */
.avisos{display:flex;flex-direction:column}
.aviso{display:flex;align-items:flex-start;gap:11px;padding:11px 18px;border-bottom:1px solid #F0EBE2;
  cursor:pointer;transition:.13s}
.aviso:last-child{border-bottom:0}
.aviso:hover{background:#FDFBF7}
.aviso .luz{margin-top:6px}
.aviso .tx{flex:1;min-width:0}
.aviso .tx b{display:block;font-weight:600;font-size:14px;color:var(--tinta)}
.aviso .tx span{display:block;font-size:12.5px;color:var(--tinta2);margin-top:1px}
.aviso .der{text-align:right;font-size:12.5px;white-space:nowrap;color:var(--tinta2);font-variant-numeric:tabular-nums}
.aviso .der b{display:block;font-size:13px;color:var(--tinta)}

/* ---------- Línea de tiempo del día ---------- */
.hilo{position:relative;padding-left:22px}
.hilo::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--borde)}
.hilo-it{position:relative;padding:9px 0}
.hilo-it::before{content:'';position:absolute;left:-21px;top:14px;width:11px;height:11px;border-radius:99px;
  background:var(--blanco);border:2px solid var(--dorado)}
.hilo-it.ok::before{border-color:var(--oliva)} .hilo-it.vencido::before{border-color:var(--terracota)}
.hilo-it.pronto::before{border-color:var(--ambar)}
.hilo-it .h{font-family:var(--serif);font-size:13px;color:var(--bordo);font-weight:700}
.hilo-it .q{font-size:14px;font-weight:600}
.hilo-it .d{font-size:12.5px;color:var(--tinta2)}

/* ---------- Barra de avance ---------- */
.avance{height:7px;background:#F0EBE2;border-radius:99px;overflow:hidden}
.avance i{display:block;height:100%;background:linear-gradient(90deg,var(--dorado),var(--bordo));
  transition:width .4s ease;border-radius:99px}
.avance.verde i{background:var(--oliva)}

/* ---------- Ficha de la carpeta ---------- */
.ficha-tapa{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r);
  box-shadow:var(--sombra);padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.ficha-tapa::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--bordo)}
.ficha-tapa.pronto::before{background:var(--ambar)} .ficha-tapa.vencido::before{background:var(--terracota)}
.ficha-tapa.ok::before{background:var(--oliva)}
.ft-nro{font-family:var(--serif);font-size:12.5px;letter-spacing:.1em;color:var(--dorado);font-weight:700}
.ficha-tapa h2{margin:3px 0 7px;font-size:21px;line-height:1.3}
.ft-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tinta2)}
.ft-meta b{color:var(--tinta);font-weight:600}
.ft-barra{display:flex;align-items:center;gap:12px;margin-top:14px}
.ft-barra .avance{flex:1}
.ft-barra span{font-size:12.5px;color:var(--tinta2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Lo que falta para firmar: lo primero que se lee */
.falta{border-radius:var(--r2);border:1px solid var(--borde);overflow:hidden;margin-top:14px}
.falta-t{padding:8px 13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  background:#FDFBF7;border-bottom:1px solid var(--borde);color:var(--tinta2)}
.falta-l{display:flex;flex-wrap:wrap;gap:6px;padding:11px 13px}
.falta-l .it{display:inline-block;font-size:13px;line-height:1.5;padding:4px 11px;border-radius:14px;
  border:1px solid var(--borde);background:var(--blanco)}
.falta-l .it.vencido{border-color:#EDD2CE;background:var(--terracota-f);color:#8E3029;font-weight:600}
.falta-l .it.pronto{border-color:#EEDFBF;background:var(--ambar-f);color:#8A6418;font-weight:600}
.falta-l .it.plata{border-color:#EEDFBF;background:var(--ambar-f);color:#8A6418}
.falta.listo{border-color:#D4E0CC;background:var(--oliva-f)}
.falta.listo .falta-t{background:transparent;border-bottom:0;color:#4D6B40}

/* Checklist */
.lista-chk{display:flex;flex-direction:column}
.chk{display:flex;align-items:flex-start;gap:11px;padding:10px 16px;border-bottom:1px solid #F0EBE2}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:var(--bordo);cursor:pointer}
.chk .tx{flex:1;min-width:0}
.chk .tx b{font-weight:500;font-size:14px;display:block}
.chk.hecho .tx b{color:var(--tinta3);text-decoration:line-through}
.chk .tx i{font-style:normal;font-size:12px;color:var(--tinta3);display:block;margin-top:1px}
.chk .acc{opacity:0;transition:.15s;display:flex;gap:4px}
.chk:hover .acc{opacity:1}
@media(hover:none){.chk .acc{opacity:1}}

/* Línea de tiempo de la carpeta */
.tiempo{position:relative;padding-left:20px}
.tiempo::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--borde)}
.tiempo-it{position:relative;padding:7px 0;font-size:13.5px}
.tiempo-it::before{content:'';position:absolute;left:-19px;top:13px;width:9px;height:9px;border-radius:99px;
  background:var(--dorado)}
.tiempo-it.firma::before{background:var(--bordo);box-shadow:0 0 0 3px #5a1f2e22}
.tiempo-it.cobro::before{background:var(--oliva)}
.tiempo-it .f{font-size:12px;color:var(--tinta3);font-variant-numeric:tabular-nums}

/* Cuenta de la carpeta */
.cuenta-bloques{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.cuenta-bloques{grid-template-columns:1fr}}
.cb{border:1px solid var(--borde);border-radius:var(--r2);padding:13px 15px;background:#FDFBF7}
.cb h4{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3);
  margin-bottom:9px}
.cb .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
.cb .l span{color:var(--tinta2);min-width:0} .cb .l b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cb .total{border-top:1px solid var(--borde);margin-top:7px;padding-top:7px;font-weight:700}
.cb .total b{font-family:var(--serif);color:var(--bordo);font-size:15px}
.cb.verde{background:var(--oliva-f);border-color:#D4E0CC} .cb.verde .total b{color:#4D6B40}
.cb.roja{background:var(--terracota-f);border-color:#EDD2CE} .cb.roja .total b{color:#8E3029}

/* ---------- Agenda ---------- */
.ag-mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--borde);
  border:1px solid var(--borde);border-radius:var(--r2);overflow:hidden}
.ag-dw{background:#FDFBF7;padding:7px 4px;text-align:center;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta3);font-weight:600}
.ag-d{background:var(--blanco);min-height:92px;padding:5px 6px;cursor:pointer;transition:.13s}
.ag-d:hover{background:#FDFBF7}
.ag-d.fuera{background:#FAF7F1;color:var(--tinta3)}
.ag-d.hoy{box-shadow:inset 0 0 0 2px var(--bordo)}
.ag-d .dn{font-size:12px;font-weight:600;color:var(--tinta2);font-variant-numeric:tabular-nums}
.ag-d.hoy .dn{color:var(--bordo)}
.ag-pt{display:block;font-size:11px;padding:2px 5px;border-radius:4px;margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;background:var(--dorado-suave);color:#6A4F1E}
.ag-pt.firma{background:#EEDDE1;color:var(--bordo);font-weight:600}
.ag-pt.vencido{background:var(--terracota-f);color:#8E3029;font-weight:600}
.ag-pt.pronto{background:var(--ambar-f);color:#8A6418}
.ag-dia{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #F0EBE2}
.ag-dia:last-child{border-bottom:0}
.ag-dia .hr{font-family:var(--serif);font-size:15px;color:var(--bordo);width:52px;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.ag-dia .cu{flex:1;min-width:0}
.ag-dia .cu b{display:block;font-size:14.5px}
.ag-dia .cu span{display:block;font-size:12.5px;color:var(--tinta2);margin-top:1px}
.ag-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ag-cab h3{}

/* ---------- Gráficos ---------- */
.graf{width:100%;height:auto;display:block;overflow:visible}
.graf .eje{stroke:var(--borde);stroke-width:1}
.graf .et{font-size:9.5px;fill:var(--tinta3);font-family:var(--sans)}
.graf .bi{fill:var(--bordo);opacity:.85} .graf .be{fill:var(--dorado);opacity:.85}
.graf .ln{fill:none;stroke:var(--bordo);stroke-width:2}
.graf .ar{fill:var(--bordo);opacity:.07}
.graf .pt{fill:var(--bordo)}
.graf-leyenda{display:flex;gap:16px;font-size:12px;color:var(--tinta2);margin-top:8px;flex-wrap:wrap}
.graf-leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.barra-h{display:flex;align-items:center;gap:10px;padding:6px 0}
.barra-h .nm{font-size:13px;flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra-h .bg{flex:1;height:9px;background:#F0EBE2;border-radius:99px;overflow:hidden}
.barra-h .bg i{display:block;height:100%;background:var(--bordo);border-radius:99px}
.barra-h .vl{font-size:12.5px;color:var(--tinta2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Aclaraciones y notas ---------- */
.nota-legal{display:flex;gap:9px;background:var(--ambar-f);border:1px solid #EEDFBF;border-radius:var(--r2);
  padding:10px 13px;font-size:12.5px;color:#7A5A16;line-height:1.5;margin-bottom:16px}
.nota-legal b{color:#6A4E12}
.nota{background:#FDFBF7;border:1px solid var(--borde);border-radius:var(--r2);padding:11px 14px;
  font-size:13px;color:var(--tinta2);line-height:1.55}
.nota b{color:var(--tinta)}

/* ---------- Fichas (una fila = una ficha; se usa en celular) ---------- */
.fichas{display:flex;flex-direction:column;gap:10px}
.fi{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--r2);padding:12px 14px;
  box-shadow:var(--sombra);cursor:pointer}
.fi-t{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:7px}
.fi-t b{font-size:14.5px;font-weight:600;line-height:1.35}
.fi-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
.fi-l span{color:var(--tinta3)} .fi-l b{font-weight:500;text-align:right}

/* ---------- Detalle en dos columnas ---------- */
.datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 20px}
.datos .d{padding:7px 0;border-bottom:1px solid #F4F0E9;min-width:0}
.datos .d i{display:block;font-style:normal;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tinta3);font-weight:600}
.datos .d b{font-weight:500;font-size:14px;word-break:break-word}
.datos .ancho-2{grid-column:1/-1}
@media(max-width:600px){.datos{grid-template-columns:1fr}}

/* ---------- Modo registro (para el celular, parada en el Registro) ---------- */
.registro-modo .rm{background:var(--blanco);border:1px solid var(--borde);border-left:4px solid var(--bordo);
  border-radius:var(--r2);padding:14px 16px;margin-bottom:11px}
.registro-modo .rm b{font-family:var(--serif);font-size:17px;color:var(--bordo);display:block}
.registro-modo .rm .dato{font-size:17px;font-weight:600;margin-top:5px;letter-spacing:.02em}
.registro-modo .rm .sub{font-size:13.5px;color:var(--tinta2);margin-top:3px}

/* ---------- Varios ---------- */
.volver{background:none;border:0;color:var(--tinta2);font-size:13.5px;cursor:pointer;padding:0;
  font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.volver:hover{color:var(--bordo)}
.pild{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:#FDFBF7;border:1px solid var(--borde);
  border-radius:99px;padding:3px 10px;color:var(--tinta2)}
.enlace{background:none;border:0;color:var(--bordo);font-size:inherit;font-family:inherit;cursor:pointer;
  padding:0;text-align:left;text-decoration:underline;text-decoration-color:#5a1f2e44}
.enlace:hover{text-decoration-color:var(--bordo)}
.sep-mes{font-family:var(--serif);font-size:13px;color:var(--dorado);letter-spacing:.08em;
  padding:12px 16px 4px;font-weight:700}
.tot-fila td{background:#FDFBF7;font-weight:600}
/* El aviso de "se desliza" solo tiene sentido en el celular */
.cel-ancho-aviso{display:none}
.resal{background:var(--dorado-suave);border-radius:3px;padding:0 2px}

/* En pantallas medianas, antes de apretar las columnas, la tabla se desliza */
@media(min-width:761px){ table.t{min-width:620px} table.t.compacta{min-width:480px} }


/* ===== css/05-celular.css ===== */
/* ============================================================
   CELULAR Y TABLET  (estándar de Wydan: probar siempre a 375 px)
   · El menú lateral se guarda y aparece una barra abajo.
   · Las tablas angostas se convierten en FICHAS (etiqueta a la
     izquierda, dato a la derecha).
   · Las tablas anchas se deslizan de costado con la primera
     columna fija. Lo decide solo js/98-celular.js.
   ============================================================ */

@media(max-width:1000px){
  :root{--lateral:260px}
  .lateral{transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sombra-alta)}
  .lateral.abierto{transform:none}
  .contenido{margin-left:0}
  .menu-btn{display:inline-flex}
  .arriba{padding:10px 14px;gap:10px}
  .arriba h1{font-size:18px}
  .arriba .hoy{display:none}
  .arriba{flex-wrap:wrap}
  .buscador{order:9;flex:1 1 100%;max-width:none;margin-left:0}

/* ===== js/02-utils.js ===== */
/* ============================================================
   HERRAMIENTAS DE USO GENERAL
   Fechas, dinero, textos, ventanitas propias (nada de prompt ni alert)
   y listas de sugerencias que funcionan igual en compu y en celular.
   ============================================================ */

/* ---------- Buscar en la pantalla ---------- */
const $  = (s, ctx = document) => ctx.querySelector(s);
const $$ = (s, ctx = document) => Array.from(ctx.querySelectorAll(s));

/* ---------- Textos ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const sinTildes = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* Busca un texto dentro de otro, sin importar tildes ni mayúsculas */
const contiene = (texto, busca) => sinTildes(texto).includes(sinTildes(busca));

/* Clase CSS a partir de un estado ("En preparación" → "e-en-preparacion") */
const claseEstado = e => 'e-' + sinTildes(e).replace(/[^a-z0-9]+/g, '-');

const chip = (estado, extra = '') =>
  `<span class="chip ${claseEstado(estado)} ${extra}">${esc(estado)}</span>`;

/* ---------- Fechas ---------- */
const HOY = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

/* aaaa-mm-dd (así se guardan todas las fechas) */
const iso = d => {
  const x = d instanceof Date ? d : new Date(d + 'T00:00:00');
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
};
const fecha = f => {
  if (!f) return '—';
  const [a, m, d] = String(f).slice(0, 10).split('-');
  return `${d}/${m}/${a}`;
};
const fechaCorta = f => f ? fecha(f).slice(0, 5) : '—';
const aDate = f => new Date(String(f).slice(0, 10) + 'T00:00:00');
const sumarDias = (f, n) => { const d = aDate(iso(f)); d.setDate(d.getDate() + n); return iso(d); };
const sumarMeses = (f, n) => { const d = aDate(iso(f)); d.setMonth(d.getMonth() + n); return iso(d); };
/* Días desde hoy hasta la fecha (negativo = ya pasó) */
const diasHasta = f => Math.round((aDate(f) - HOY()) / 86400000);
const diasEntre = (a, b) => Math.round((aDate(b) - aDate(a)) / 86400000);

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
  'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAS_C = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'];

const clave = f => String(f).slice(0, 7);                       // aaaa-mm
const mesNombre = k => `${MESES[+k.slice(5, 7) - 1]} ${k.slice(0, 4)}`;
const mesCorto = k => `${MESES_C[+k.slice(5, 7) - 1]} ${k.slice(2, 4)}`;
const primerDia = k => k + '-01';
const ultimoDia = k => iso(new Date(+k.slice(0, 4), +k.slice(5, 7), 0));
const diaSemana = f => DIAS[aDate(f).getDay()];
const esFinde = f => [0, 6].includes(aDate(f).getDay());

/* Primera letra en mayúscula ("miércoles 14" → "Miércoles 14") */
const conMayuscula = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);

/* "hoy", "ayer", "en 3 días", "hace 12 días" */
function enPalabras(f) {
  const d = diasHasta(f);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  if (d === -1) return 'ayer';
  return d > 0 ? `en ${d} días` : `hace ${-d} días`;
}

/* ---------- Dinero y números (formato uruguayo: $ 48.300) ---------- */
const nf = new Intl.NumberFormat('es-UY', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-UY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numero = n => nf.format(Math.round(+n || 0));
const pesos = n => '$ ' + numero(n);
const pesosFinos = n => '$ ' + nf2.format(+n || 0);
const dolares = n => 'US$ ' + nf2.format(+n || 0);
/* Muestra el monto en su moneda y, si es en dólares, el equivalente en pesos */
function plata(monto, moneda = '$', tc) {
  if (moneda === 'USD') return `${dolares(monto)} <i class="eq">(${pesos(monto * (tc || Store.cfg().tipoCambio))})</i>`;
  return pesos(monto);
}
/* Siempre en pesos, para poder sumar */
const aPesos = (m, moneda, tc) => moneda === 'USD' ? (+m || 0) * (tc || Store.cfg().tipoCambio) : (+m || 0);

const pct = (n, total) => total ? Math.round((n / total) * 100) : 0;

/* ---------- Semáforo de plazos ---------- */
/* Devuelve: ok (verde) · pronto (ámbar) · vencido (terracota) */
function semaforo(fechaLimite) {
  if (!fechaLimite) return 'ok';
  const d = diasHasta(fechaLimite);
  if (d < 0) return 'vencido';
  if (d <= Store.cfg().avisoPrevio) return 'pronto';
  return 'ok';
}

/* ---------- Avisos cortos abajo de la pantalla ---------- */
let _tToast;
function aviso(texto, tipo = 'ok') {
  let c = $('#toast');
  if (!c) { c = document.createElement('div'); c.id = 'toast'; document.body.appendChild(c); }
  c.className = 't-' + tipo;
  c.innerHTML = esc(texto);
  c.classList.add('ver');
  clearTimeout(_tToast);
  _tToast = setTimeout(() => c.classList.remove('ver'), 3200);
}

/* ---------- Ventanita propia (en vez de las del navegador) ---------- */
let _modales = 0;
function modal({ titulo, cuerpo, ancho = '', acciones = [], alCerrar }) {
  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  fondo.innerHTML = `<div class="modal ${ancho}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <header><h3>${esc(titulo)}</h3><button class="m-x" aria-label="Cerrar">×</button></header>
    <div class="m-cuerpo">${cuerpo}</div>
    <footer class="m-pie"></footer></div>`;
  const pie = $('.m-pie', fondo);
  acciones.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.clase || '');
    b.textContent = a.texto;
    b.onclick = () => { if (a.hacer?.(fondo) !== false) cerrar(); };
    pie.appendChild(b);
  });
  if (!acciones.length) pie.remove();
  const cerrar = () => { fondo.remove(); if (!--_modales) document.body.classList.remove('sin-scroll'); alCerrar?.(); };
  $('.m-x', fondo).onclick = cerrar;
  fondo.onclick = e => { if (e.target === fondo) cerrar(); };
  document.addEventListener('keydown', function salir(e) {
    if (e.key === 'Escape' && document.body.contains(fondo)) { cerrar(); document.removeEventListener('keydown', salir); }
  });
  document.body.appendChild(fondo);
  _modales++; document.body.classList.add('sin-scroll');
  setTimeout(() => $('input,textarea,select,button.p', fondo)?.focus(), 60);
  return { fondo, cerrar };
}

/* Pide UN texto con una ventanita de la página (reemplaza a prompt()) */
function pedirTexto({ titulo, etiqueta = '', valor = '', largo = false, tipo = 'text' }) {
  return new Promise(resolver => {
    const campo = largo
      ? `<textarea id="pt-v" rows="4">${esc(valor)}</textarea>`
      : `<input id="pt-v" type="${tipo}" value="${esc(valor)}">`;
    const m = modal({
      titulo,
      cuerpo: `<label class="campo">${etiqueta ? `<span>${esc(etiqueta)}</span>` : ''}${campo}</label>`,
      acciones: [
        { texto: 'Cancelar', clase: 's', hacer: () => resolver(null) },
        { texto: 'Guardar', clase: 'p', hacer: f => resolver($('#pt-v', f).value.trim()) },
      ],
      alCerrar: () => resolver(null),
    });
    const inp = $('#pt-v', m.fondo);
    inp.focus(); inp.select?.();
    if (!largo) inp.onkeydown = e => { if (e.key === 'Enter') { resolver(inp.value.trim()); m.cerrar(); } };
  });
}

/* ---------- Formularios ---------- */
/* Arma un formulario a partir de una lista de campos y devuelve lo cargado */
function formulario(campos) {
  return campos.map(c => {
    if (c.tipo === 'titulo') return `<h4 class="f-sep">${esc(c.texto)}</h4>`;
    const id = 'f-' + c.n;
    const req = c.req ? 'required' : '';
    let dentro;
    if (c.tipo === 'select') {
      dentro = `<select id="${id}" ${req}>${(c.ops || []).map(o => {
        const v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
        return `<option value="${esc(v)}" ${String(c.valor) === String(v) ? 'selected' : ''}>${esc(t)}</option>`;
      }).join('')}</select>`;
    } else if (c.tipo === 'textarea') {
      dentro = `<textarea id="${id}" rows="${c.filas || 3}" ${req}>${esc(c.valor ?? '')}</textarea>`;
    } else if (c.tipo === 'checkbox') {
      dentro = `<input id="${id}" type="checkbox" ${c.valor ? 'checked' : ''}>`;
    } else if (c.tipo === 'sugerido') {
      dentro = `<input id="${id}" type="text" value="${esc(c.valor ?? '')}" autocomplete="off"
        data-sugerido="${esc((c.ops || []).join('|'))}" ${req} placeholder="${esc(c.ph || 'Escribí para buscar…')}">`;
    } else {
      dentro = `<input id="${id}" type="${c.tipo || 'text'}" value="${esc(c.valor ?? '')}"
        ${c.paso ? `step="${c.paso}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''} ${req}>`;
    }
    return `<label class="campo ${c.tipo === 'checkbox' ? 'campo-si' : ''} ${c.ancho || ''}">
      <span>${esc(c.e)}</span>${dentro}${c.ayuda ? `<i class="ayuda">${esc(c.ayuda)}</i>` : ''}</label>`;
  }).join('');
}

/* Lee los valores de un formulario armado con formulario() */
function leerFormulario(campos, ctx) {
  const r = {};
  campos.forEach(c => {
    if (c.tipo === 'titulo') return;
    const e = $('#f-' + c.n, ctx);
    if (!e) return;
    r[c.n] = c.tipo === 'checkbox' ? e.checked
      : (c.tipo === 'number' ? (e.value === '' ? null : +e.value) : e.value.trim());
  });
  return r;
}

/* ---------- Listas de sugerencias propias ----------
   No usamos <datalist>: en el celular no se despliega bien.
   Esta lista se abre hacia arriba si abajo no hay lugar y sigue al campo
   cuando la página se mueve (teclado del celular).                        */
(function listasPropias() {
  let caja, campo, opciones = [], marcado = -1;

  const cerrar = () => { caja?.remove(); caja = null; campo = null; marcado = -1; };

  function ubicar() {
    if (!caja || !campo) return;
    const r = campo.getBoundingClientRect();
    const alto = Math.min(caja.scrollHeight, 240);
    const abajo = window.innerHeight - r.bottom;
    caja.style.left = r.left + 'px';
    caja.style.width = r.width + 'px';
    caja.style.maxHeight = alto + 'px';
    if (abajo < alto + 16 && r.top > alto + 16) caja.style.top = (r.top - alto - 4) + 'px';
    else caja.style.top = (r.bottom + 4) + 'px';
  }

  function pintar() {
    const txt = campo.value.trim();
    const lista = opciones.filter(o => !txt || contiene(o, txt)).slice(0, 60);
    if (!lista.length) return cerrar();
    if (!caja) { caja = document.createElement('div'); caja.className = 'sugeridos'; document.body.appendChild(caja); }
    caja.innerHTML = lista.map((o, i) =>
      `<button type="button" class="${i === marcado ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
    caja.onmousedown = e => {
      const b = e.target.closest('button'); if (!b) return;
      e.preventDefault();
      campo.value = b.dataset.v;
      campo.dispatchEvent(new Event('change', { bubbles: true }));
      cerrar();
    };
    ubicar();
  }

  document.addEventListener('focusin', e => {
    const i = e.target.closest('input[data-sugerido]');
    if (!i) return cerrar();
    campo = i; marcado = -1;
    opciones = (i.dataset.sugerido || '').split('|').filter(Boolean);
    pintar();
  });
  document.addEventListener('input', e => { if (e.target === campo) { marcado = -1; pintar(); } });
  document.addEventListener('focusout', e => { if (e.target === campo) setTimeout(cerrar, 120); });
  document.addEventListener('keydown', e => {
    if (!caja || e.target !== campo) return;
    const bs = $$('button', caja);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      marcado = Math.max(0, Math.min(bs.length - 1, marcado + (e.key === 'ArrowDown' ? 1 : -1)));
      pintar(); bs[marcado]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && marcado >= 0) {
      e.preventDefault(); campo.value = bs[marcado].dataset.v;
      campo.dispatchEvent(new Event('change', { bubbles: true })); cerrar();
    } else if (e.key === 'Escape') cerrar();
  });
  window.addEventListener('scroll', ubicar, true);
  window.addEventListener('resize', ubicar);
})();

/* ===== js/03-store.js ===== */
/* ============================================================
   CAPA DE DATOS  ·  ¡ESTO ES LO ÚNICO QUE SE CAMBIA PARA LA NUBE!
   ------------------------------------------------------------
   La pantalla nunca toca los datos directamente: siempre pasa por acá
   (listar / obtener / crear / editar / borrar). Para conectar una base
   de datos real (Firebase u otra) se reemplazan estas funciones por las
   de la base, y la pantalla no se toca.

   HOY (demostración): los datos son inventados y viven en el navegador
   de quien abre la página (localStorage). Nada sale de su equipo.
   ============================================================ */

const Store = {
  CLAVE: 'escribania_fo_demo_v1',
  datos: null,

  /* Colecciones (en la nube, cada una sería una "colección" de Firestore,
     con un documento por registro — nunca todo junto en un solo documento). */
  COLECCIONES: ['clientes', 'bienes', 'carpetas', 'documentos', 'tramites', 'escrituras',
    'certificaciones', 'eventos', 'movimientos', 'gastos', 'fondos', 'actividad'],

  /* ---------- Abrir y guardar ---------- */
  abrir() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.CLAVE) || 'null'); } catch (e) { d = null; }

    // Si no hay nada, o quedó de una versión anterior, o los ejemplos
    // envejecieron, se vuelven a sembrar: una demo vacía no sirve de nada.
    const viejo = d && (d.version !== 1 || !d.carpetas?.length ||
      Math.abs(diasEntre(d.sembradoEl || '2000-01-01', iso(HOY()))) > 45);
    if (!d || viejo) {
      this.datos = sembrarEjemplos();
      this.guardar();
    } else {
      this.datos = d;
    }
    // Campos nuevos que pudieran faltar
    this.COLECCIONES.forEach(c => { if (!Array.isArray(this.datos[c])) this.datos[c] = []; });
    this.datos.config = Object.assign({}, CONFIG_INICIAL, this.datos.config || {});
    if (!this.datos.tiposAsunto?.length) this.datos.tiposAsunto = JSON.parse(JSON.stringify(TIPOS_ASUNTO));
    return this.datos;
  },

  guardar() {
    try { localStorage.setItem(this.CLAVE, JSON.stringify(this.datos)); }
    catch (e) { console.warn('No se pudo guardar en este navegador', e); }
  },

  /* Vuelve a los datos de ejemplo (botón en Configuración) */
  reiniciar() { localStorage.removeItem(this.CLAVE); this.datos = null; this.abrir(); },

  /* ---------- Leer ---------- */
  listar(col, filtro) {
    const l = this.datos[col] || [];
    return filtro ? l.filter(filtro) : l;
  },
  obtener(col, id) { return (this.datos[col] || []).find(x => x.id === id) || null; },

  /* ---------- Escribir ---------- */
  crear(col, obj) {
    const nuevo = Object.assign({ id: uid(col.slice(0, 3)), creadoEl: iso(HOY()) }, obj);
    this.datos[col].push(nuevo);
    this.guardar();
    return nuevo;
  },
  editar(col, id, cambios) {
    const x = this.obtener(col, id);
    if (!x) return null;
    Object.assign(x, cambios);
    this.guardar();
    return x;
  },
  borrar(col, id) {
    const i = (this.datos[col] || []).findIndex(x => x.id === id);
    if (i < 0) return false;
    this.datos[col].splice(i, 1);
    this.guardar();
    return true;
  },

  /* ---------- Configuración ---------- */
  cfg() { return this.datos?.config || CONFIG_INICIAL; },
  guardarCfg(cambios) { Object.assign(this.datos.config, cambios); this.guardar(); },

  /* ---------- Tipos de asunto ---------- */
  tipos() { return this.datos.tiposAsunto || []; },
  tipo(id) { return this.tipos().find(t => t.id === id) || { nombre: 'Sin tipo', cat: 'Otros', honorario: 0 }; },

  /* ---------- Registro de lo que se hace (quién y cuándo) ---------- */
  anotar(texto, carpetaId) {
    this.datos.actividad.unshift({ id: uid('act'), fecha: iso(HOY()), texto, carpetaId });
    if (this.datos.actividad.length > 400) this.datos.actividad.length = 400;
    this.guardar();
  },
};

/* ============================================================
   ATAJOS DE LECTURA (siempre pasan por Store)
   ============================================================ */
const Datos = {
  cliente: id => Store.obtener('clientes', id),
  bien: id => Store.obtener('bienes', id),
  carpeta: id => Store.obtener('carpetas', id),

  nombreCliente(id) {
    const c = Store.obtener('clientes', id);
    return c ? (c.tipo === 'juridica' ? c.razon : c.nombre) : '—';
  },
  docCliente(id) {
    const c = Store.obtener('clientes', id);
    return c ? (c.tipo === 'juridica' ? 'RUT ' + c.rut : 'CI ' + c.ci) : '';
  },
  telCliente(id) { return Store.obtener('clientes', id)?.tel || ''; },

  /* Todo lo que cuelga de una carpeta */
  deCarpeta(id) {
    return {
      documentos: Store.listar('documentos', d => d.carpetaId === id),
      tramites: Store.listar('tramites', t => t.carpetaId === id),
      gastos: Store.listar('gastos', g => g.carpetaId === id),
      fondos: Store.listar('fondos', f => f.carpetaId === id),
      ingresos: Store.listar('movimientos', m => m.carpetaId === id && m.clase === 'ingreso'),
      eventos: Store.listar('eventos', e => e.carpetaId === id),
      escritura: Store.listar('escrituras', e => e.carpetaId === id)[0] || null,
    };
  },

  /* Nombre del bien, para mostrar en una línea */
  nombreBien(id) {
    const b = Store.obtener('bienes', id);
    if (!b) return '—';
    return b.clase === 'inmueble'
      ? `Padrón ${b.padron} · ${b.localidad}`
      : `${b.marca} ${b.modelo} · Matrícula ${b.matricula}`;
  },

  /* Las partes de una carpeta, en texto ("Rodríguez (vendedor), Pereira (comprador)") */
  partesTexto(carpeta, corto) {
    const p = (carpeta.partes || []).map(x => {
      const n = this.nombreCliente(x.clienteId);
      return corto ? n.split(' ').slice(-2).join(' ') : `${n} (${x.rol.toLowerCase()})`;
    });
    return p.join(corto ? ' · ' : ', ') || '—';
  },
};


/* ===== js/04-reglas.js ===== */
/* ============================================================
   REGLAS DEL NEGOCIO
   Acá están los cálculos propios de una escribanía: avance de la carpeta,
   plazos y vencimientos, ITP, honorarios y la cuenta de cada carpeta.
   La pantalla solo muestra lo que estas funciones devuelven.

   ⚠ Los plazos y porcentajes son VALORES ORIENTATIVOS, editables en
     Configuración. Hay que verificar siempre la normativa vigente.
   ============================================================ */

const Reglas = {

  /* ---------- Checklist ----------
     Al elegir el tipo de asunto, la carpeta nace con su lista de
     documentos a pedir, certificados a solicitar y trámites posteriores. */
  checklistDe(tipoId) {
    const t = Store.tipo(tipoId);
    const armar = (grupo, lista) => (lista || []).map(texto => ({
      id: uid('it'), grupo, texto, hecho: false, fecha: null, nota: '',
    }));
    return [...armar('doc', t.doc), ...armar('cert', t.cert), ...armar('tram', t.tram)];
  },

  GRUPOS: { doc: 'Documentos a reunir', cert: 'Certificados previos', tram: 'Trámites posteriores' },

  avance(c) {
    const l = c.checklist || [];
    const hechos = l.filter(i => i.hecho).length;
    return { hechos, total: l.length, pct: pct(hechos, l.length) };
  },

  /* ---------- Vencimientos de un trámite ----------
     Hay dos cosas distintas y conviene no mezclarlas:
     · PLAZO PARA HACERLO (pagar el ITP, inscribir la escritura):
       corre desde la firma y deja de contar cuando ya se hizo.
     · VIGENCIA (certificados registrales, reserva de prioridad):
       empieza cuando se obtiene y es lo que se puede "vencer" encima. */
  HECHOS: ['Obtenido', 'Presentado', 'Inscripto'],

  esPlazoParaHacer(t) { return /^Pago de ITP|^Inscripción|^Declaración de beneficiario/.test(t.tipo); },

  vencimiento(t) {
    const cfg = Store.cfg();
    const c = Datos.carpeta(t.carpetaId);
    const firma = c?.fFirmaReal || c?.fFirmaEst;
    if (/^Pago de ITP/.test(t.tipo))
      return this.HECHOS.includes(t.estado) ? null : (firma ? sumarDias(firma, cfg.plazoITP) : null);
    if (/^Inscripción/.test(t.tipo))
      return this.HECHOS.includes(t.estado) ? null : (c?.fFirmaReal ? sumarDias(c.fFirmaReal, cfg.plazoInscripcion) : null);
    if (/^Declaración de beneficiario/.test(t.tipo))
      return this.HECHOS.includes(t.estado) ? null : (c?.fFirmaReal ? sumarDias(c.fFirmaReal, 30) : null);
    if (/^Reserva/.test(t.tipo)) return t.fSolicitud ? sumarDias(t.fSolicitud, t.vigencia || cfg.vigenciaCertificado) : null;
    /* La vigencia de un certificado importa hasta la firma: después de
       otorgada la escritura ya cumplió su función y no se avisa más. */
    if (c?.fFirmaReal) return null;
    if (t.vigencia && t.fObtencion) return sumarDias(t.fObtencion, t.vigencia);
    return null;
  },

  /* El estado real: si está obtenido pero se le pasó la fecha, está vencido */
  estadoTramite(t) {
    const v = this.vencimiento(t);
    if (t.estado === 'Obtenido' && v && diasHasta(v) < 0) return 'Vencido';
    return t.estado;
  },

  /* Lo que hay que mirar: trámites que vencen o vencieron */
  tramitesConPlazo(filtro) {
    return Store.listar('tramites', filtro).map(t => {
      const vence = this.vencimiento(t);
      return Object.assign({}, t, {
        vence,
        estadoReal: this.estadoTramite(t),
        dias: vence ? diasHasta(vence) : null,
        luz: vence ? semaforo(vence) : 'ok',
      });
    });
  },

  /* ---------- Plazos de una carpeta, todos juntos ---------- */
  plazos(c) {
    const l = [];
    this.tramitesConPlazo(t => t.carpetaId === c.id).forEach(t => {
      if (!t.vence) return;
      l.push({
        texto: this.esPlazoParaHacer(t) ? `${t.tipo} — plazo` : `${t.tipo} — vigencia`,
        fecha: t.vence, luz: t.luz, tramiteId: t.id, dias: t.dias,
      });
    });
    return ordenar(l, x => x.fecha);
  },

  /* El peor semáforo de la carpeta (para la lista) */
  luzCarpeta(c) {
    if (['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado)) return 'ok';
    const p = this.plazos(c);
    if (p.some(x => x.luz === 'vencido')) return 'vencido';
    if (p.some(x => x.luz === 'pronto')) return 'pronto';
    return 'ok';
  },

  /* ---------- "Qué falta para firmar" ----------
     Las tres o cuatro líneas que la escribana lee primero. */
  faltaParaFirmar(c) {
    const falta = [];
    const { documentos, tramites } = Datos.deCarpeta(c.id);

    (c.checklist || []).filter(i => !i.hecho && i.grupo === 'doc')
      .forEach(i => falta.push({ tipo: 'doc', texto: i.texto }));

    (c.checklist || []).filter(i => !i.hecho && i.grupo === 'cert')
      .forEach(i => falta.push({ tipo: 'cert', texto: i.texto }));

    this.tramitesConPlazo(t => t.carpetaId === c.id).forEach(t => {
      if (t.estadoReal === 'Vencido') falta.push({ tipo: 'vencido', texto: `${t.tipo} — vencido el ${fecha(t.vence)}` });
      else if (t.luz === 'pronto' && t.estado === 'Obtenido')
        falta.push({ tipo: 'pronto', texto: `${t.tipo} — vence ${enPalabras(t.vence)}` });
    });

    documentos.filter(d => d.estado === 'Pendiente')
      .forEach(d => falta.push({ tipo: 'doc', texto: `Falta recibir: ${d.nombre}` }));

    // Cédulas que vencen antes de la firma
    const firma = c.fFirmaEst || c.fFirmaReal;
    if (firma) (c.partes || []).forEach(p => {
      const cl = Datos.cliente(p.clienteId);
      if (cl?.cedulaVence && diasEntre(cl.cedulaVence, firma) > 0)
        falta.push({ tipo: 'vencido', texto: `La cédula de ${cl.nombre} vence el ${fecha(cl.cedulaVence)}, antes de la firma` });
    });

    if (!c.honorario) falta.push({ tipo: 'plata', texto: 'Falta pactar el honorario' });

    return falta;
  },

  /* ---------- Cuenta de la carpeta ----------
     Tres bloques: honorarios del estudio, gastos por cuenta del cliente
     y fondos que el cliente entregó. Nunca se mezclan. */
  cuenta(c) {
    const { gastos, fondos, ingresos } = Datos.deCarpeta(c.id);
    const cfg = Store.cfg();
    const honorario = aPesos(c.honorario || 0, c.moneda, c.tc);
    const iva = honorario * (cfg.iva / 100);
    const totalHonorario = honorario + iva;
    const cobrado = suma(ingresos.filter(m => m.estado === 'Cobrado'), m => aPesos(m.monto, m.moneda, m.tc));
    const porCobrar = Math.max(0, totalHonorario - cobrado);

    const gTotal = suma(gastos, g => g.monto);
    const gPagados = suma(gastos.filter(g => g.estado === 'Pagado'), g => g.monto);
    const gPendientes = gTotal - gPagados;
    const gConFondos = suma(gastos.filter(g => g.estado === 'Pagado' && g.pagadoCon === 'fondos'), g => g.monto);
    const gDelEstudio = suma(gastos.filter(g => g.estado === 'Pagado' && g.pagadoCon === 'estudio'), g => g.monto);

    const recibido = suma(fondos.filter(f => f.tipo === 'Recibido'), f => f.monto);
    const devuelto = suma(fondos.filter(f => f.tipo === 'Devuelto'), f => f.monto);
    const saldoFondos = recibido - gConFondos - devuelto;   // + a devolver · − a reclamar

    return {
      honorario, iva, totalHonorario, cobrado, porCobrar,
      gTotal, gPagados, gPendientes, gConFondos, gDelEstudio,
      recibido, devuelto, saldoFondos,
      // Lo que el cliente debe o tiene a favor, todo junto
      saldoCliente: saldoFondos - porCobrar - gDelEstudio,
      cajaNotarial: honorario * (cfg.cajaNotarial / 100),
    };
  },

  /* ---------- ITP ----------
     2 % del valor real para cada parte (4 % en total). */
  itp(valorReal) {
    const p = Store.cfg().itpPorParte / 100;
    const porParte = (+valorReal || 0) * p;
    return { porParte, total: porParte * 2, pctParte: Store.cfg().itpPorParte };
  },

  /* ---------- Honorario sugerido ----------
     El valor de referencia del tipo de asunto, ajustado por lo que ese
     mismo asunto cobró de verdad en el último año. */
  honorarioSugerido(tipoId, precio) {
    const t = Store.tipo(tipoId);
    const base = (t.pctPrecio && precio) ? precio * (t.pctPrecio / 100) : t.honorario;
    const hace1 = sumarMeses(iso(HOY()), -12);
    const hist = Store.listar('carpetas', c => c.tipoId === tipoId && c.honorario && c.fApertura >= hace1)
      .map(c => aPesos(c.honorario, c.moneda, c.tc));
    const promedio = hist.length >= 3 ? suma(hist, x => x) / hist.length : null;
    return {
      sugerido: Math.round((promedio ? (promedio * 0.6 + base * 0.4) : base) / 100) * 100,
      referencia: Math.round(base),
      promedio: promedio ? Math.round(promedio) : null,
      casos: hist.length,
    };
  },

  /* ---------- Avisos de un cliente ---------- */
  alertasCliente(cl) {
    const a = [];
    if (cl.cedulaVence) {
      const d = diasHasta(cl.cedulaVence);
      if (d < 0) a.push({ luz: 'vencido', texto: `Cédula vencida el ${fecha(cl.cedulaVence)}` });
      else if (d <= 90) a.push({ luz: 'pronto', texto: `La cédula vence ${enPalabras(cl.cedulaVence)}` });
    }
    if (cl.tipo === 'juridica' && cl.benefFinal === 'Pendiente')
      a.push({ luz: 'pronto', texto: 'Beneficiario final sin declarar' });

    const carpetas = Store.listar('carpetas', c => (c.partes || []).some(p => p.clienteId === cl.id));
    const deuda = suma(carpetas, c => this.cuenta(c).porCobrar);
    if (deuda > 0) a.push({ luz: 'pronto', texto: `Saldo pendiente de ${pesos(deuda)}` });

    const docs = Store.listar('documentos', d => d.estado === 'Recibido' && d.original &&
      carpetas.some(c => c.id === d.carpetaId));
    if (docs.length) a.push({ luz: 'ok', texto: `${docs.length} documento(s) original(es) en el estudio` });
    return a;
  },

  /* ---------- Documentos originales en custodia (todo el estudio) ---------- */
  originalesEnCustodia() {
    return Store.listar('documentos', d => d.original && d.estado === 'Recibido' && !d.devuelto)
      .map(d => Object.assign({}, d, { dias: -diasHasta(d.fRecepcion) }));
  },

  /* ---------- Carpetas dormidas ---------- */
  sinMovimiento() {
    const limite = Store.cfg().sinMovimiento;
    return Store.listar('carpetas', c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado))
      .map(c => {
        const ultimo = (c.hitos || []).map(h => h.fecha).sort().pop() || c.fApertura;
        return Object.assign({}, c, { ultimo, dias: -diasHasta(ultimo) });
      })
      .filter(c => c.dias > limite)
      .sort((a, b) => b.dias - a.dias);
  },

  /* ---------- Hitos (línea de tiempo) ---------- */
  anotarHito(carpetaId, texto, tipo = 'nota', f) {
    const c = Datos.carpeta(carpetaId);
    if (!c) return;
    c.hitos = c.hitos || [];
    c.hitos.push({ fecha: f || iso(HOY()), texto, tipo });
    Store.guardar();
    Store.anotar(texto, carpetaId);
  },

  /* ---------- Correr la fecha de firma ----------
     Es el cambio más delicado: al mover la firma, se mueven solos el
     plazo del ITP y el de la inscripción (se recalculan al mostrarlos),
     y se avisa qué certificados ya no van a estar vigentes ese día. */
  certificadosQueNoLlegan(c, nuevaFirma) {
    return this.tramitesConPlazo(t => t.carpetaId === c.id)
      .filter(t => t.vence && t.estado === 'Obtenido' && diasEntre(t.vence, nuevaFirma) > 0)
      .map(t => `${t.tipo} (vence el ${fecha(t.vence)})`);
  },

  /* ---------- Próximo número de carpeta y de escritura ---------- */
  proximaCarpeta() {
    const anio = String(HOY().getFullYear());
    const n = Store.listar('carpetas', c => String(c.nro).startsWith(anio))
      .map(c => +String(c.nro).split('-')[1] || 0);
    return `${anio}-${String(Math.max(0, ...n) + 1).padStart(3, '0')}`;
  },
  proximaEscritura() {
    const anio = HOY().getFullYear();
    const n = Store.listar('escrituras', e => e.anio === anio).map(e => e.nro);
    return { anio, nro: Math.max(0, ...n) + 1 };
  },
  proximaCertificacion() {
    const n = Store.listar('certificaciones').map(c => c.nro);
    return Math.max(0, ...n) + 1;
  },
};


/* ===== js/05-reglas-finanzas.js ===== */
/* ============================================================
   FINANZAS · CÁLCULOS
   Dos miradas distintas, a propósito:
   · RESULTADOS  → por la fecha del trabajo (lo ganado y lo gastado del mes),
                   sin IVA, porque el IVA no es ingreso del estudio.
   · FLUJO DE CAJA → por la fecha en que la plata entró o salió de verdad.
                   Lo pendiente NO entra hasta que se marca cobrado o pagado.
   Los FONDOS DE CLIENTES pasan por la caja pero nunca por el resultado.
   ============================================================ */

const Fin = {

  /* Las últimas n claves de mes (aaaa-mm), de la más vieja a la más nueva */
  meses(n = 24, hasta) {
    const base = hasta ? aDate(primerDia(hasta)) : HOY();
    const l = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
      l.push(iso(d).slice(0, 7));
    }
    return l;
  },

  /* ---------- Estado real de un ingreso o egreso ---------- */
  estadoIngreso(m) {
    if (m.estado === 'Cobrado') return 'Cobrado';
    return (m.fEstimada && diasHasta(m.fEstimada) < 0) ? 'Vencido' : 'Pendiente';
  },
  estadoEgreso(m) {
    if (m.estado === 'Pagado') return 'Pagado';
    return 'Pendiente';
  },

  ingresos(filtro) { return Store.listar('movimientos', m => m.clase === 'ingreso' && (!filtro || filtro(m))); },
  egresos(filtro) { return Store.listar('movimientos', m => m.clase === 'egreso' && (!filtro || filtro(m))); },

  /* Monto siempre en pesos; neto = sin IVA */
  monto(m) { return aPesos(m.monto, m.moneda, m.tc); },
  neto(m) { return this.monto(m) / (1 + (m.iva || 0) / 100); },
  ivaDe(m) { return this.monto(m) - this.neto(m); },

  /* ---------- RESULTADOS (devengado, sin IVA) ---------- */
  resultados(n = 24) {
    return this.meses(n).map(k => {
      const ing = this.ingresos(m => clave(m.fecha) === k);
      const eg = this.egresos(m => clave(m.fecha) === k);
      const porTipo = {}, porCat = {};
      ing.forEach(m => {
        const t = m.tipoAsunto || 'Otros trabajos';
        porTipo[t] = (porTipo[t] || 0) + this.neto(m);
      });
      eg.forEach(m => { porCat[m.categoria] = (porCat[m.categoria] || 0) + this.monto(m); });
      const ingresos = suma(ing, m => this.neto(m));
      const egresos = suma(eg, m => this.monto(m));
      const carpetas = Store.listar('carpetas', c => c.fCierre && clave(c.fCierre) === k).length;
      return {
        k, ingresos, egresos, porTipo, porCat,
        resultado: ingresos - egresos,
        margen: ingresos ? Math.round(((ingresos - egresos) / ingresos) * 100) : 0,
        carpetasCerradas: carpetas,
        honorarioPromedio: ing.length ? ingresos / ing.length : 0,
      };
    });
  },

  /* ---------- FLUJO DE CAJA (solo lo real) ---------- */
  flujo(n = 24) {
    const meses = this.meses(n);
    let saldo = Store.datos.saldoInicialCaja || 0;
    // Arrastre de todo lo anterior al primer mes mostrado
    const antes = meses[0];
    saldo += this.movidaCaja(m => m < antes).neto;
    return meses.map(k => {
      const mv = this.movidaCaja(m => m === k);
      const inicial = saldo;
      saldo = inicial + mv.neto;
      return Object.assign({ k, inicial, final: saldo }, mv);
    });
  },

  /* Lo que entró y salió de la caja en los meses que cumplen la condición */
  movidaCaja(cond) {
    const cobros = this.ingresos(m => m.estado === 'Cobrado' && m.fEfectiva && cond(clave(m.fEfectiva)));
    const pagos = this.egresos(m => m.estado === 'Pagado' && m.fEfectiva && cond(clave(m.fEfectiva)));
    const recibidos = Store.listar('fondos', f => f.tipo === 'Recibido' && cond(clave(f.fecha)));
    const devueltos = Store.listar('fondos', f => f.tipo === 'Devuelto' && cond(clave(f.fecha)));
    const aplicados = Store.listar('gastos', g => g.estado === 'Pagado' && g.pagadoCon === 'fondos' && g.fPago && cond(clave(g.fPago)));

    const porMedio = {};
    cobros.forEach(m => { porMedio[m.medio] = (porMedio[m.medio] || 0) + this.monto(m); });

    const tCobros = suma(cobros, m => this.monto(m));
    const tPagos = suma(pagos, m => this.monto(m));
    const tFondos = suma(recibidos, f => f.monto) - suma(devueltos, f => f.monto) - suma(aplicados, g => g.monto);
    return {
      cobros: tCobros, pagos: tPagos, fondos: tFondos,
      neto: tCobros - tPagos + tFondos,
      porMedio, nCobros: cobros.length, nPagos: pagos.length,
    };
  },

  saldoCaja() { const f = this.flujo(24); return f.length ? f[f.length - 1].final : 0; },

  /* ---------- Pendientes ---------- */
  porCobrar() {
    return ordenar(this.ingresos(m => m.estado !== 'Cobrado')
      .map(m => Object.assign({}, m, { estadoReal: this.estadoIngreso(m), dias: m.fEstimada ? diasHasta(m.fEstimada) : null })),
      m => m.fEstimada || '9999');
  },
  porPagar() {
    return ordenar(this.egresos(m => m.estado !== 'Pagado')
      .map(m => Object.assign({}, m, { dias: m.fVence ? diasHasta(m.fVence) : null })),
      m => m.fVence || '9999');
  },

  /* ---------- FONDOS DE CLIENTES ---------- */
  fondosPorCarpeta() {
    const l = [];
    Store.listar('carpetas').forEach(c => {
      const f = Store.listar('fondos', x => x.carpetaId === c.id);
      if (!f.length) return;
      const recibido = suma(f.filter(x => x.tipo === 'Recibido'), x => x.monto);
      const devuelto = suma(f.filter(x => x.tipo === 'Devuelto'), x => x.monto);
      const aplicado = suma(Store.listar('gastos', g => g.carpetaId === c.id && g.estado === 'Pagado' && g.pagadoCon === 'fondos'), g => g.monto);
      l.push({ carpeta: c, recibido, aplicado, devuelto, saldo: recibido - aplicado - devuelto });
    });
    return ordenar(l, x => -Math.abs(x.saldo));
  },
  enCustodia() { return suma(this.fondosPorCarpeta(), f => Math.max(0, f.saldo)); },
  aReclamar() { return suma(this.fondosPorCarpeta(), f => Math.min(0, f.saldo)); },
  rendicionesPendientes() { return this.fondosPorCarpeta().filter(f => Math.abs(f.saldo) > 1 && ['Firmada', 'En inscripción', 'Cerrada'].includes(f.carpeta.estado)); },

  /* ---------- Rankings y comparativos ---------- */
  rankingTipos(desde, hasta) {
    const m = {};
    this.ingresos(x => x.fecha >= desde && x.fecha <= hasta).forEach(x => {
      const t = x.tipoAsunto || 'Otros trabajos';
      m[t] = m[t] || { tipo: t, total: 0, n: 0 };
      m[t].total += this.neto(x); m[t].n++;
    });
    return ordenar(Object.values(m), x => -x.total);
  },
  rankingClientes(desde, hasta) {
    const m = {};
    this.ingresos(x => x.fecha >= desde && x.fecha <= hasta && x.clienteId).forEach(x => {
      m[x.clienteId] = m[x.clienteId] || { clienteId: x.clienteId, total: 0, n: 0 };
      m[x.clienteId].total += this.neto(x); m[x.clienteId].n++;
    });
    return ordenar(Object.values(m), x => -x.total);
  },

  /* Totales rápidos para el panel */
  cobradoHoy() { return suma(this.ingresos(m => m.estado === 'Cobrado' && m.fEfectiva === iso(HOY())), m => this.monto(m)); },
  cobradoMes() { return suma(this.ingresos(m => m.estado === 'Cobrado' && clave(m.fEfectiva || '') === clave(iso(HOY()))), m => this.monto(m)); },
  facturadoMes() { return suma(this.ingresos(m => clave(m.fecha) === clave(iso(HOY()))), m => this.monto(m)); },
};
