VISTAS.bienes = function (cont, extra) {
  if (typeof extra === 'string') bienAbierto = extra;
  if (bienAbierto && Datos.bien(bienAbierto)) return pintarFichaBien(cont, bienAbierto);
  bienAbierto = null;

  const f = filtrosBien;
  let lista = Store.listar('bienes');
  if (f.clase) lista = lista.filter(b => b.clase === f.clase);
  if (f.depto) lista = lista.filter(b => b.depto === f.depto);
  if (f.texto) lista = lista.filter(b => contiene(b.padron || '', f.texto) || contiene(b.matricula || '', f.texto) ||
    contiene(b.direccion || '', f.texto) || contiene(`${b.marca || ''} ${b.modelo || ''}`, f.texto) ||
    contiene(Datos.nombreCliente(b.titularId), f.texto));
  lista = ordenar(lista, b => b.clase + (b.padron || ''));

  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Bienes</h2>
    <p>Los inmuebles y vehículos que pasan por el estudio, con el historial de carpetas en las
       que participaron y la fecha del último certificado registral.</p>
  </div><div class="btn-fila"><button class="btn p" data-nuevo>+ Nuevo bien</button></div></div>

  <div class="filtros">
    <input type="search" class="crece" id="fb-texto" placeholder="Padrón, matrícula, dirección o titular…" value="${esc(f.texto)}">
    <select id="fb-clase"><option value="">Inmuebles y vehículos</option>
      <option value="inmueble" ${f.clase === 'inmueble' ? 'selected' : ''}>Solo inmuebles</option>
      <option value="vehiculo" ${f.clase === 'vehiculo' ? 'selected' : ''}>Solo vehículos</option></select>
    <select id="fb-depto"><option value="">Todos los departamentos</option>
      ${unicos(Store.listar('bienes').map(b => b.depto)).map(d => `<option ${f.depto === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select>
    <span class="cuenta">${lista.length} bien(es)</span>
  </div>

  <section class="tarjeta"><div class="cuerpo sin-aire"><div class="tabla-marco">
  ${lista.length ? `<table class="t">
    <thead><tr><th>Bien</th><th>Ubicación</th><th>Titular</th><th>Carpetas</th>
      <th>Último certificado</th><th class="n">Valor real</th></tr></thead>
    <tbody>${lista.map(b => {
      const carpetas = Store.listar('carpetas', c => c.bienId === b.id);
      const act = carpetas.find(c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado));
      return `<tr class="clic" data-ir="${b.id}">
        <td class="titulo"><b>${esc(Datos.nombreBien(b.id))}</b>
          <i style="display:block;font-style:normal;font-size:12px;color:var(--tinta3)">
            ${b.clase === 'inmueble' ? esc(b.tipo) + ' · matrícula ' + esc(b.matricula) : `${esc(b.marca)} ${esc(b.modelo)} ${b.anio}`}</i></td>
        <td class="mini">${b.clase === 'inmueble' ? esc(b.direccion) + ' — ' + esc(b.localidad) : esc(b.depto)}</td>
        <td class="mini">${esc(Datos.nombreCliente(b.titularId))}</td>
        <td class="n">${carpetas.length}${act ? ' <span class="chip e-en-preparacion sin">activa</span>' : ''}</td>
        <td class="mini">${b.ultimoCert ? fecha(b.ultimoCert) : '—'}</td>
        <td class="n">${pesos(b.valorCatastral)}</td></tr>`;
    }).join('')}</tbody></table>` : vacio('No hay bienes con esos filtros')}
  </div></div></section>`;

  const t = $('#fb-texto', cont); let esp;
  t.oninput = () => { clearTimeout(esp); esp = setTimeout(() => { filtrosBien.texto = t.value; repintar(); $('#fb-texto')?.focus(); }, 320); };
  $('#fb-clase', cont).onchange = e => { filtrosBien.clase = e.target.value; repintar(); };
  $('#fb-depto', cont).onchange = e => { filtrosBien.depto = e.target.value; repintar(); };
  $$('[data-ir]', cont).forEach(tr => tr.onclick = () => abrirBien(tr.dataset.ir));
  $('[data-nuevo]', cont).onclick = () => formBien();
};

function pintarFichaBien(cont, id) {
  const b = Datos.bien(id);
  const carpetas = ordenar(Store.listar('carpetas', c => c.bienId === id), c => c.fApertura, true);
  const activa = carpetas.find(c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado));
  const pendientes = activa ? Reglas.tramitesConPlazo(t => t.carpetaId === activa.id)
    .filter(t => !['Inscripto', 'Presentado'].includes(t.estado)) : [];
  const itp = Reglas.itp(b.valorCatastral);

  cont.innerHTML = `
  <button class="volver" data-volver>‹ Volver a todos los bienes</button>

  <div class="ficha-tapa">
    <div class="ft-nro">${b.clase === 'inmueble' ? 'INMUEBLE' : 'VEHÍCULO'}</div>
    <h2>${esc(Datos.nombreBien(id))}</h2>
    <div class="ft-meta">
      ${b.clase === 'inmueble' ? `
        <span><b>Tipo:</b> ${esc(b.tipo)}</span>
        <span><b>Matrícula:</b> ${esc(b.matricula)}</span>
        <span><b>Superficie:</b> ${esc(b.superficie)}</span>
        <span><b>Dirección:</b> ${esc(b.direccion)} — ${esc(b.localidad)}, ${esc(b.depto)}</span>`
      : `<span><b>Vehículo:</b> ${esc(b.marca)} ${esc(b.modelo)} ${b.anio}</span>
        <span><b>Padrón:</b> ${esc(b.padron)}</span>
        <span><b>Empadronado en:</b> ${esc(b.depto)}</span>`}
      <span><b>Titular:</b> <button class="enlace" data-ver-cliente="${b.titularId}">${esc(Datos.nombreCliente(b.titularId))}</button></span>
    </div>
    ${activa ? `<div class="falta ${pendientes.some(p => p.luz === 'vencido') ? '' : 'listo'}">
      <div class="falta-t">En la carpeta activa (${esc(activa.nro)})</div>
      <div class="falta-l">${pendientes.length ? pendientes.map(p => `<span class="it ${p.luz === 'ok' ? '' : p.luz}">
        ${esc(p.tipo)} · ${esc(p.estadoReal.toLowerCase())}${p.vence ? ' · vence ' + enPalabras(p.vence) : ''}</span>`).join('')
        : '<span class="it">✓ No queda nada pendiente</span>'}</div></div>` : ''}
  </div>

  <div class="btn-fila no-imprimir" style="margin-bottom:18px">
    ${activa ? `<button class="btn p" data-ir-carpeta="${activa.id}">Abrir la carpeta activa</button>` : ''}
    <button class="btn s" data-editar>Editar datos</button>
  </div>

  <div class="cols p23">
    ${tarjeta({
      titulo: 'Historial de carpetas', sinAire: true,
      cuerpo: carpetas.length ? `<div class="tabla-marco"><table class="t compacta">
        <thead><tr><th>Carpeta</th><th>Asunto</th><th>Estado</th><th>Firma</th><th>Escritura</th></tr></thead>
        <tbody>${carpetas.map(c => `<tr class="clic" data-ir-carpeta="${c.id}">
          <td class="titulo"><b>${esc(c.caratula)}</b>
            <i style="display:block;font-style:normal;font-size:12px;color:var(--tinta3)">N° ${c.nro}</i></td>
          <td class="mini">${esc(Store.tipo(c.tipoId).nombre)}</td>
          <td>${chip(c.estado)}</td>
          <td class="mini">${c.fFirmaReal ? fecha(c.fFirmaReal) : '—'}</td>
          <td class="mini">${c.escrituraNro ? 'N° ' + esc(c.escrituraNro) : '—'}</td></tr>`).join('')}
        </tbody></table></div>` : vacio('Este bien todavía no participó en ninguna carpeta'),
    })}

    <div class="cols">
      ${tarjeta({
        titulo: 'Datos registrales',
        cuerpo: `<div class="datos">
          ${b.clase === 'inmueble' ? `
            <div class="d"><i>Padrón</i><b>${esc(b.padron)}</b></div>
            <div class="d"><i>Matrícula</i><b>${esc(b.matricula)}</b></div>
            <div class="d"><i>Departamento</i><b>${esc(b.depto)}</b></div>
            <div class="d"><i>Localidad / sección</i><b>${esc(b.localidad)} · ${esc(b.seccion || '—')}</b></div>
            <div class="d"><i>Superficie del terreno</i><b>${esc(b.superficie)}</b></div>
            <div class="d"><i>Edificado</i><b>${esc(b.edificado || '—')}</b></div>`
          : `<div class="d"><i>Matrícula</i><b>${esc(b.matricula)}</b></div>
            <div class="d"><i>Padrón</i><b>${esc(b.padron)}</b></div>
            <div class="d"><i>Motor</i><b>${esc(b.motor)}</b></div>
            <div class="d"><i>Chasis</i><b>${esc(b.chasis)}</b></div>
            <div class="d"><i>Año</i><b>${b.anio}</b></div>`}
          <div class="d"><i>Último certificado registral</i><b>${b.ultimoCert ? fecha(b.ultimoCert) + ' · ' + enPalabras(b.ultimoCert) : '—'}</b></div>
          <div class="d"><i>Valor real catastral</i><b>${pesos(b.valorCatastral)}</b></div>
        </div>`,
      })}

      ${tarjeta({
        titulo: 'ITP estimado',
        cuerpo: `<div class="cb">
          <div class="l"><span>Valor real catastral</span><b>${pesos(b.valorCatastral)}</b></div>
          <div class="l"><span>ITP por cada parte (${itp.pctParte} %)</span><b>${pesos(itp.porParte)}</b></div>
          <div class="l total"><span>ITP total (las dos partes)</span><b>${pesos(itp.total)}</b></div>
        </div>
        <div class="nota-legal" style="margin-top:12px"><div><b>Valor orientativo.</b> El porcentaje y el
          plazo se editan en Configuración; el valor real lo determina la DGI. Verificar la normativa vigente.</div></div>`,
      })}
    </div>
  </div>`;

  $('[data-volver]', cont).onclick = () => { bienAbierto = null; VISTA_EXTRA = null; irA('bienes'); };
  $$('[data-ir-carpeta]', cont).forEach(x => x.onclick = () => abrirCarpeta(x.dataset.irCarpeta));
  $$('[data-ver-cliente]', cont).forEach(x => x.onclick = () => abrirCliente(x.dataset.verCliente));
  $('[data-editar]', cont).onclick = () => formBien(id);
}

/* ---------- Alta y edición ---------- */
function formBien(id) {
  const b = id ? Datos.bien(id) : null;
  const clientes = Store.listar('clientes');
  const nombreCl = c => c.tipo === 'juridica' ? `${c.razon} · RUT ${c.rut}` : `${c.nombre} · CI ${c.ci}`;
  const esVeh = b ? b.clase === 'vehiculo' : false;

  const armar = veh => veh ? [
    { n: 'matricula', e: 'Matrícula', req: true, valor: b?.matricula || '', ph: 'RAB 1234' },
    { n: 'padron', e: 'Padrón', valor: b?.padron || '' },
    { n: 'marca', e: 'Marca', req: true, valor: b?.marca || '' },
    { n: 'modelo', e: 'Modelo', valor: b?.modelo || '' },
    { n: 'anio', e: 'Año', tipo: 'number', valor: b?.anio || '' },
    { n: 'depto', e: 'Departamento de empadronamiento', tipo: 'sugerido', valor: b?.depto || 'Rivera',
      ops: ['Rivera', 'Tacuarembó', 'Montevideo', 'Salto', 'Artigas', 'Cerro Largo'] },
    { n: 'motor', e: 'N° de motor', valor: b?.motor || '' },
    { n: 'chasis', e: 'N° de chasis', valor: b?.chasis || '' },
    { n: 'valorCatastral', e: 'Valor de referencia ($)', tipo: 'number', valor: b?.valorCatastral || null },
    { n: 'titular', e: 'Titular actual', tipo: 'sugerido', ancho: 'ancho-2',
      valor: b?.titularId ? nombreCl(Datos.cliente(b.titularId)) : '', ops: clientes.map(nombreCl) },
  ] : [
    { n: 'padron', e: 'Padrón', req: true, valor: b?.padron || '' },
    { n: 'matricula', e: 'Matrícula registral', valor: b?.matricula || '' },
    { n: 'tipo', e: 'Tipo', tipo: 'select', valor: b?.tipo || 'Casa',
      ops: ['Casa', 'Apartamento', 'Terreno', 'Campo', 'PH', 'Local comercial', 'Galpón'] },
    { n: 'depto', e: 'Departamento', tipo: 'sugerido', valor: b?.depto || 'Rivera',
      ops: ['Rivera', 'Tacuarembó', 'Montevideo', 'Salto', 'Artigas', 'Cerro Largo'] },
    { n: 'localidad', e: 'Localidad', valor: b?.localidad || 'Rivera' },
    { n: 'seccion', e: 'Sección / barrio', valor: b?.seccion || '' },
    { n: 'direccion', e: 'Dirección', ancho: 'ancho-2', valor: b?.direccion || '' },
    { n: 'superficie', e: 'Superficie del terreno', valor: b?.superficie || '', ph: '450 m² o 120 ha' },
    { n: 'edificado', e: 'Superficie edificada', valor: b?.edificado || '' },
    { n: 'valorCatastral', e: 'Valor real catastral ($)', tipo: 'number', valor: b?.valorCatastral || null,
      ayuda: 'Se usa para calcular el ITP' },
    { n: 'titular', e: 'Titular actual', tipo: 'sugerido', ancho: 'ancho-2',
      valor: b?.titularId ? nombreCl(Datos.cliente(b.titularId)) : '', ops: clientes.map(nombreCl) },
  ];

  let campos = armar(esVeh);
  const m = modal({
    titulo: id ? 'Editar el bien' : 'Nuevo bien', ancho: 'ancho',
    cuerpo: `${id ? '' : `<div class="solapas" id="bi-tipo">
        <button class="on" data-t="inmueble">Inmueble</button>
        <button data-t="vehiculo">Vehículo</button></div>`}
      <div class="rejilla" id="bi-campos">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Guardar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      const veh = campos.some(x => x.n === 'marca');
      if (veh ? !v.matricula : !v.padron) { aviso(veh ? 'Falta la matrícula' : 'Falta el padrón', 'mal'); return false; }
      const titular = v.titular ? (clientes.find(c => nombreCl(c) === v.titular) || clientes.find(c => contiene(nombreCl(c), v.titular))) : null;
      const datos = Object.assign({}, v, { clase: veh ? 'vehiculo' : 'inmueble', titularId: titular ? titular.id : null });
      delete datos.titular;
      if (id) { Store.editar('bienes', id, datos); aviso('Bien actualizado'); }
      else { const n = Store.crear('bienes', Object.assign({ ultimoCert: null }, datos)); bienAbierto = n.id; VISTA_EXTRA = n.id; aviso('Bien creado'); }
      repintar();
    } }],
  });

  $$('#bi-tipo button', m.fondo).forEach(btn => btn.onclick = () => {
    $$('#bi-tipo button', m.fondo).forEach(x => x.classList.remove('on'));
    btn.classList.add('on');
    campos = armar(btn.dataset.t === 'vehiculo');
    $('#bi-campos', m.fondo).innerHTML = formulario(campos);
  });
}


/* ===== js/16-protocolo.js ===== */
/* ============================================================
   PROTOCOLO Y CERTIFICACIONES
   El índice del protocolo del año, el registro de certificaciones
   de firmas y el control de papel notarial y timbres.
   ============================================================ */

let protSolapa = 'protocolo';
let protFiltros = { anio: String(HOY().getFullYear()), tipo: '', texto: '' };

VISTAS.protocolo = function (cont) {
  const anios = unicos(Store.listar('escrituras').map(e => String(e.anio))).reverse();
  if (!anios.includes(protFiltros.anio) && anios.length) protFiltros.anio = anios[0];

  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Protocolo y certificaciones</h2>
    <p>El índice de las escrituras del año con sus folios, inscripciones y copias expedidas,
       y el registro correlativo de certificaciones de firmas.</p>
  </div><div class="btn-fila">
    ${protSolapa === 'protocolo'
      ? '<button class="btn" data-imp-protocolo>Imprimir el índice</button>'
      : '<button class="btn p" data-nueva-cert>+ Nueva certificación</button>'}
  </div></div>

  <div class="solapas">
    <button class="${protSolapa === 'protocolo' ? 'on' : ''}" data-sol="protocolo">Índice del protocolo</button>
    <button class="${protSolapa === 'certificaciones' ? 'on' : ''}" data-sol="certificaciones">Certificaciones de firmas</button>
    <button class="${protSolapa === 'papel' ? 'on' : ''}" data-sol="papel">Papel notarial y timbres</button>
  </div>

  <div id="prot-cuerpo"></div>`;

  $$('[data-sol]', cont).forEach(b => b.onclick = () => { protSolapa = b.dataset.sol; repintar(); });
  const cuerpo = $('#prot-cuerpo', cont);
  if (protSolapa === 'protocolo') pintarProtocolo(cuerpo, anios);
  else if (protSolapa === 'certificaciones') pintarCertificaciones(cuerpo);
  else pintarPapel(cuerpo);
  $('[data-imp-protocolo]', cont)?.addEventListener('click', () => imprimirProtocolo(protFiltros.anio));
  $('[data-nueva-cert]', cont)?.addEventListener('click', () => formCertificacion());
  prepararTablas(cont);
};

function pintarProtocolo(cont, anios) {
  const f = protFiltros;
  let lista = Store.listar('escrituras', e => String(e.anio) === f.anio);
  if (f.tipo) lista = lista.filter(e => e.acto === f.tipo);
  if (f.texto) lista = lista.filter(e => contiene(e.otorgantes, f.texto) ||
    contiene(String(e.nro), f.texto) || contiene(e.acto, f.texto));
  lista = ordenar(lista, e => e.nro, true);

  const copias = suma(lista, e => (e.copias || []).length);
  const sinInscribir = lista.filter(e => e.inscripcion?.registro && !e.inscripcion.fecha).length;

  cont.innerHTML = `
  <div class="nums">
    ${numero_('Escrituras del año', lista.length, `Protocolo ${f.anio}`)}
    ${numero_('Folios usados', lista.length ? (Math.max(...lista.map(e => e.folioHasta || 0)) || '—') : '—', 'Último folio ocupado')}
    ${numero_('Copias expedidas', copias, 'Primeras y segundas copias')}
    ${numero_('Sin inscribir', sinInscribir, sinInscribir ? 'Revisar el plazo de prioridad' : 'Todo inscripto',
      sinInscribir ? 'pronto' : 'ok')}
  </div>

  <div class="filtros">
    <select id="fp-anio">${anios.map(a => `<option ${f.anio === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select id="fp-tipo"><option value="">Todos los actos</option>
      ${unicos(Store.listar('escrituras', e => String(e.anio) === f.anio).map(e => e.acto))
        .map(t => `<option ${f.tipo === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <input type="search" class="crece" id="fp-texto" placeholder="N° de escritura, otorgante o acto…" value="${esc(f.texto)}">
    <span class="cuenta">${lista.length} escritura(s)</span>
  </div>

  <section class="tarjeta"><div class="cuerpo sin-aire"><div class="tabla-marco">
  ${lista.length ? `<table class="t">
    <thead><tr><th>N°</th><th>Fecha</th><th>Acto</th><th>Otorgantes</th><th>Folios</th>
      <th>Inscripción</th><th>Copias</th></tr></thead>
    <tbody>${lista.map(e => `<tr class="clic" data-esc="${e.id}">
      <td class="titulo"><b>N° ${e.nro}/${e.anio}</b></td>
      <td class="mini">${fecha(e.fecha)}</td>
      <td>${esc(e.acto)}</td>
      <td class="mini">${esc(e.otorgantes)}</td>
      <td class="mini">${e.folioDesde ? `${e.folioDesde}–${e.folioHasta}` : '—'}</td>
      <td class="mini">${e.inscripcion?.fecha
        ? `<span class="t-ok">✓ ${fecha(e.inscripcion.fecha)}</span><br><small>N° ${esc(e.inscripcion.nro || '')}</small>`
        : (e.inscripcion?.registro ? '<span class="t-pronto">presentada</span>' : '—')}</td>
      <td class="mini">${(e.copias || []).length || '—'}</td>
    </tr>`).join('')}</tbody></table>` : vacio('No hay escrituras con esos filtros')}
  </div></div></section>`;

  $('#fp-anio', cont).onchange = e => { protFiltros.anio = e.target.value; repintar(); };
  $('#fp-tipo', cont).onchange = e => { protFiltros.tipo = e.target.value; repintar(); };
  const t = $('#fp-texto', cont); let esp;
  t.oninput = () => { clearTimeout(esp); esp = setTimeout(() => { protFiltros.texto = t.value; repintar(); $('#fp-texto')?.focus(); }, 320); };
  $$('[data-esc]', cont).forEach(tr => tr.onclick = () => verEscritura(tr.dataset.esc));
}

function verEscritura(id) {
  const e = Store.obtener('escrituras', id);
  if (!e) return;
  const c = e.carpetaId ? Datos.carpeta(e.carpetaId) : null;
  modal({
    titulo: `Escritura N° ${e.nro}/${e.anio}`, ancho: 'ancho',
    cuerpo: `<div class="datos">
      <div class="d"><i>Fecha</i><b>${fecha(e.fecha)}</b></div>
      <div class="d"><i>Tipo de acto</i><b>${esc(e.acto)}</b></div>
      <div class="d ancho-2"><i>Otorgantes</i><b>${esc(e.otorgantes)}</b></div>
      <div class="d"><i>Folios</i><b>${e.folioDesde ? `${e.folioDesde} a ${e.folioHasta}` : '—'}</b></div>
      <div class="d"><i>Carpeta</i><b>${c ? esc(c.nro + ' · ' + c.caratula) : '—'}</b></div>
      <div class="d ancho-2"><i>Inscripción</i><b>${e.inscripcion?.fecha
        ? `${esc(e.inscripcion.registro)} · ${fecha(e.inscripcion.fecha)} · N° ${esc(e.inscripcion.nro || '')}`
        : (e.inscripcion?.registro ? 'Presentada, sin número todavía' : 'No requiere inscripción')}</b></div>
    </div>
    <h4 class="f-sep">Copias expedidas</h4>
    ${(e.copias || []).length ? `<table class="t compacta"><tbody>
      ${e.copias.map(x => `<tr><td><b>${esc(x.tipo)}</b></td><td class="mini">${esc(x.aQuien)}</td>
        <td class="mini n">${fecha(x.fecha)}</td></tr>`).join('')}</tbody></table>`
      : '<div class="nota">Todavía no se expidieron copias de esta escritura.</div>'}`,
    acciones: [
      ...(c ? [{ texto: 'Abrir la carpeta', hacer: () => abrirCarpeta(c.id) }] : []),
      { texto: 'Expedir copia', clase: 'p', hacer: () => { expedirCopia(id); return true; } },
      { texto: 'Editar', hacer: () => formEscritura(id) },
    ],
  });
}

function expedirCopia(id) {
  const e = Store.obtener('escrituras', id);
  const c = e.carpetaId ? Datos.carpeta(e.carpetaId) : null;
  const partes = c ? (c.partes || []).map(p => Datos.nombreCliente(p.clienteId)) : [];
  const campos = [
    { n: 'tipo', e: 'Qué copia', tipo: 'select', ops: ['Primera copia', 'Segunda copia', 'Testimonio'] },
    { n: 'aQuien', e: 'Para quién', tipo: 'sugerido', ops: [...partes, 'Banco', 'Registro', 'Intendencia'], valor: partes[1] || partes[0] || '' },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: iso(HOY()) },
  ];
  modal({
    titulo: 'Expedir una copia',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Registrar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      e.copias = e.copias || [];
      e.copias.push({ tipo: v.tipo, aQuien: v.aQuien, fecha: v.fecha });
      Store.guardar();
      if (c) Reglas.anotarHito(c.id, `Se expidió ${v.tipo.toLowerCase()} a ${v.aQuien}`, 'nota', v.fecha);
      aviso('Copia registrada'); repintar();
    } }],
  });
}

function formEscritura(id) {
  const e = Store.obtener('escrituras', id);
  const campos = [
    { n: 'nro', e: 'N° de escritura', tipo: 'number', valor: e.nro, req: true },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: e.fecha, req: true },
    { n: 'acto', e: 'Tipo de acto', ancho: 'ancho-2', valor: e.acto },
    { n: 'otorgantes', e: 'Otorgantes', ancho: 'ancho-2', valor: e.otorgantes },
    { n: 'folioDesde', e: 'Folio desde', tipo: 'number', valor: e.folioDesde },
    { n: 'folioHasta', e: 'Folio hasta', tipo: 'number', valor: e.folioHasta },
    { tipo: 'titulo', texto: 'Inscripción' },
    { n: 'registro', e: 'Registro', tipo: 'sugerido', valor: e.inscripcion?.registro || '', ops: ORGANISMOS, ancho: 'ancho-2' },
    { n: 'fInsc', e: 'Fecha de inscripción', tipo: 'date', valor: e.inscripcion?.fecha || '' },
    { n: 'nroInsc', e: 'N° de inscripción', valor: e.inscripcion?.nro || '' },
  ];
  modal({
    titulo: `Editar la escritura N° ${e.nro}/${e.anio}`, ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Guardar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      Store.editar('escrituras', id, { nro: v.nro, fecha: v.fecha, acto: v.acto, otorgantes: v.otorgantes,
        folioDesde: v.folioDesde, folioHasta: v.folioHasta, anio: +v.fecha.slice(0, 4),
        inscripcion: { registro: v.registro, fecha: v.fInsc || null, nro: v.nroInsc } });
      aviso('Escritura guardada'); repintar();
    } }],
  });
}

/* ---------- Certificaciones de firmas ---------- */
function pintarCertificaciones(cont) {
  const anio = String(HOY().getFullYear());
  const lista = ordenar(Store.listar('certificaciones', c => String(c.fecha).startsWith(anio)), c => c.nro, true);
  const total = suma(lista, c => c.honorario);
  const mes = lista.filter(c => clave(c.fecha) === clave(iso(HOY())));

  cont.innerHTML = `
  <div class="nums">
    ${numero_('Certificaciones del año', lista.length, `Año ${anio}`)}
    ${numero_('Este mes', mes.length, pesos(suma(mes, c => c.honorario)))}
    ${numero_('Honorarios del año', pesos(total), 'Sin IVA')}
    ${numero_('Hojas certificadas', suma(lista, c => c.hojas), 'En el año')}
  </div>

  <section class="tarjeta"><div class="cuerpo sin-aire"><div class="tabla-marco">
  ${lista.length ? `<table class="t">
    <thead><tr><th>N°</th><th>Fecha</th><th>Documento</th><th>Firmantes</th>
      <th>Hojas</th><th class="n">Honorario</th><th></th></tr></thead>
    <tbody>${lista.map(c => `<tr>
      <td class="titulo"><b>N° ${c.nro}</b></td>
      <td class="mini">${fecha(c.fecha)}</td>
      <td>${esc(c.documento)}</td>
      <td class="mini">${(c.firmantes || []).map(f => `${esc(f.nombre)} (CI ${esc(f.ci)})`).join(' · ')}</td>
      <td class="n">${c.hojas}</td>
      <td class="n">${pesos(c.honorario)}</td>
      <td class="no-imprimir"><button class="btn chico s" data-cert="${c.id}">Editar</button></td>
    </tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">Total del año</td><td class="n">${suma(lista, c => c.hojas)}</td>
      <td class="n">${pesos(total)}</td><td></td></tr></tfoot></table>`
    : vacio('Todavía no hay certificaciones este año')}
  </div></div></section>`;

  $$('[data-cert]', cont).forEach(b => b.onclick = () => formCertificacion(b.dataset.cert));
}

function formCertificacion(id) {
  const c = id ? Store.obtener('certificaciones', id) : null;
  const clientes = Store.listar('clientes', x => x.tipo === 'fisica');
  const nombreCl = x => `${x.nombre} · CI ${x.ci}`;
  const campos = [
    { n: 'nro', e: 'N° correlativo', tipo: 'number', valor: c?.nro ?? Reglas.proximaCertificacion(), req: true },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: c?.fecha || iso(HOY()), req: true },
    { n: 'documento', e: 'Documento certificado', req: true, ancho: 'ancho-2', valor: c?.documento || '',
      ph: 'Contrato de arrendamiento, carta poder…' },
    { n: 'firmante1', e: 'Primer firmante', tipo: 'sugerido', ancho: 'ancho-2',
      valor: c?.firmantes?.[0] ? `${c.firmantes[0].nombre} · CI ${c.firmantes[0].ci}` : '', ops: clientes.map(nombreCl) },
    { n: 'firmante2', e: 'Segundo firmante (si hay)', tipo: 'sugerido', ancho: 'ancho-2',
      valor: c?.firmantes?.[1] ? `${c.firmantes[1].nombre} · CI ${c.firmantes[1].ci}` : '', ops: clientes.map(nombreCl) },
    { n: 'hojas', e: 'Cantidad de hojas', tipo: 'number', valor: c?.hojas || 1 },
    { n: 'honorario', e: 'Honorario cobrado ($)', tipo: 'number', valor: c?.honorario || 2800 },
  ];
  modal({
    titulo: id ? `Certificación N° ${c.nro}` : 'Nueva certificación de firmas', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>
      <div class="nota">Al guardar, el honorario entra como ingreso del estudio (con IVA).</div>`,
    acciones: [
      ...(id ? [{ texto: 'Borrar', clase: 'mal', hacer: () => {
        if (!confirm('¿Borrar esta certificación?')) return false;
        Store.borrar('certificaciones', id); repintar();
      } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.documento) { aviso('Falta decir qué documento se certificó', 'mal'); return false; }
        const parse = txt => {
          if (!txt) return null;
          const cl = clientes.find(x => nombreCl(x) === txt) || clientes.find(x => contiene(nombreCl(x), txt));
          if (cl) return { nombre: cl.nombre, ci: cl.ci };
          const p = txt.split(' · CI ');
          return { nombre: p[0], ci: p[1] || '' };
        };
        const firmantes = [parse(v.firmante1), parse(v.firmante2)].filter(Boolean);
        const datos = { nro: v.nro, fecha: v.fecha, documento: v.documento, firmantes,
          hojas: v.hojas || 1, honorario: v.honorario || 0, carpetaId: c?.carpetaId || null };
        if (id) Store.editar('certificaciones', id, datos);
        else {
          Store.crear('certificaciones', datos);
          Store.crear('movimientos', { clase: 'ingreso', fecha: v.fecha, carpetaId: null, clienteId: null,
            tipoAsunto: 'Certificación de firmas',
            concepto: `Certificación de firmas N° ${v.nro} — ${v.documento}`,
            monto: Math.round((v.honorario || 0) * (1 + Store.cfg().iva / 100)), moneda: '$', tc: null,
            iva: Store.cfg().iva, medio: 'Efectivo', estado: 'Cobrado', fEfectiva: v.fecha, fEstimada: null });
        }
        aviso('Certificación guardada'); repintar();
      } },
    ],
  });
}

/* ---------- Papel notarial y timbres ---------- */
function pintarPapel(cont) {
  const cfg = Store.cfg();
  const anio = String(HOY().getFullYear());
  const escrituras = Store.listar('escrituras', e => String(e.anio) === anio);
  const usadas = suma(escrituras, e => (e.folioHasta && e.folioDesde) ? (e.folioHasta - e.folioDesde + 1) : 2);
  const certs = Store.listar('certificaciones', c => String(c.fecha).startsWith(anio));

  cont.innerHTML = `
  <div class="nums">
    ${numero_('Papel notarial en el estudio', cfg.papelNotarial, 'Hojas disponibles', cfg.papelNotarial < 40 ? 'pronto' : 'ok')}
    ${numero_('Timbres disponibles', cfg.timbres, 'Unidades', cfg.timbres < 25 ? 'pronto' : 'ok')}
    ${numero_('Hojas usadas en el año', usadas, `${escrituras.length} escritura(s)`)}
    ${numero_('Hojas certificadas', suma(certs, c => c.hojas), `${certs.length} certificación(es)`)}
  </div>

  <div class="cols c2">
    ${tarjeta({
      titulo: 'Consumo por acto', sinAire: true,
      cuerpo: `<div class="cuerpo">${(() => {
        const porActo = agrupar(escrituras, e => e.acto);
        const filas = ordenar(Object.entries(porActo).map(([acto, l]) => ({
          acto, hojas: suma(l, e => (e.folioHasta && e.folioDesde) ? (e.folioHasta - e.folioDesde + 1) : 2), n: l.length,
        })), x => -x.hojas);
        const max = Math.max(1, ...filas.map(f => f.hojas));
        return filas.length ? filas.map(f => `<div class="barra-h">
          <span class="nm">${esc(f.acto)}</span>
          <span class="bg"><i style="width:${(f.hojas / max) * 100}%"></i></span>
          <span class="vl">${f.hojas} hojas · ${f.n} acto(s)</span></div>`).join('')
          : vacio('Sin datos del año');
      })()}</div>`,
    })}

    ${tarjeta({
      titulo: 'Ajustar el stock',
      cuerpo: `<div class="nota" style="margin-bottom:14px">En la demostración el stock es un contador
        que se ajusta a mano. En la versión contratada se puede descontar solo al registrar cada acto.</div>
        <div class="btn-fila">
          <button class="btn" data-papel>Cambiar el papel notarial</button>
          <button class="btn" data-timbres>Cambiar los timbres</button>
        </div>`,
    })}
  </div>`;

  $('[data-papel]', cont).onclick = async () => {
    const v = await pedirTexto({ titulo: 'Papel notarial', etiqueta: 'Hojas disponibles en el estudio',
      valor: String(cfg.papelNotarial), tipo: 'number' });
    if (v === null) return;
    Store.guardarCfg({ papelNotarial: +v || 0 }); aviso('Stock actualizado'); repintar();
  };
  $('[data-timbres]', cont).onclick = async () => {
    const v = await pedirTexto({ titulo: 'Timbres', etiqueta: 'Timbres disponibles',
      valor: String(cfg.timbres), tipo: 'number' });
    if (v === null) return;
    Store.guardarCfg({ timbres: +v || 0 }); aviso('Stock actualizado'); repintar();
  };
}


/* ===== js/17-tramites.js ===== */
/* ============================================================
   TRÁMITES · todos los de todas las carpetas, en una sola lista
   Agrupados por lo que importa: vencidos, vencen esta semana,
   a solicitar, y después el resto.
   ============================================================ */

let filtrosTram = { estado: '', organismo: '', tipo: '', texto: '', soloActivas: true };

VISTAS.tramites = function (cont) {
  const f = filtrosTram;
  let lista = Reglas.tramitesConPlazo();
  lista = lista.map(t => Object.assign({}, t, { carpeta: Datos.carpeta(t.carpetaId) })).filter(t => t.carpeta);
  if (f.soloActivas) lista = lista.filter(t => !['Cerrada', 'Archivada', 'Cancelada'].includes(t.carpeta.estado));
  if (f.estado) lista = lista.filter(t => t.estadoReal === f.estado);
  if (f.organismo) lista = lista.filter(t => t.organismo === f.organismo);
  if (f.tipo) lista = lista.filter(t => t.tipo === f.tipo);
  if (f.texto) lista = lista.filter(t => contiene(t.tipo, f.texto) || contiene(t.carpeta.caratula, f.texto) ||
    contiene(t.carpeta.nro, f.texto) || contiene(t.organismo, f.texto));

  const vencidos = ordenar(lista.filter(t => t.luz === 'vencido'), t => t.vence);
  const semana = ordenar(lista.filter(t => t.luz === 'pronto'), t => t.vence);
  const aSolicitar = ordenar(lista.filter(t => t.estado === 'A solicitar'), t => t.carpeta.fFirmaEst || '9999');
  const enCurso = ordenar(lista.filter(t => t.estado === 'Solicitado'), t => t.fSolicitud || '9999');
  const resto = lista.filter(t => !vencidos.includes(t) && !semana.includes(t) && !aSolicitar.includes(t) && !enCurso.includes(t));

  const bloque = (titulo, l, clase) => l.length ? tarjeta({
    titulo, extraTitulo: `<span class="pild ${clase}">${l.length}</span>`, sinAire: true,
    cuerpo: tablaTramites(l),
  }) : '';

  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Trámites</h2>
    <p>Certificados, ITP, inscripciones y reservas de prioridad de todas las carpetas.
       El vencimiento lo calcula la página: certificados a los ${Store.cfg().vigenciaCertificado} días de obtenidos,
       ITP a los ${Store.cfg().plazoITP} días de la firma e inscripción a los ${Store.cfg().plazoInscripcion}.</p>
  </div><div class="btn-fila">
    <button class="btn" data-modo-registro>Modo registro</button>
  </div></div>

  <div class="nums">
    ${numero_('Vencidos', vencidos.length, 'Hay que rehacerlos', vencidos.length ? 'vencido' : 'ok')}
    ${numero_('Vencen en 7 días', semana.length, 'Antes de que se pasen', semana.length ? 'pronto' : 'ok')}
    ${numero_('A solicitar', aSolicitar.length, 'Todavía no se pidieron')}
    ${numero_('En curso', enCurso.length, 'Pedidos, esperando respuesta')}
  </div>

  <div class="nota-legal"><div><b>Valores orientativos.</b> Las vigencias y los plazos se editan en
    Configuración. Verificá siempre la normativa vigente antes de confiar en una fecha.</div></div>

  <div class="filtros">
    <input type="search" class="crece" id="ft-texto" placeholder="Trámite, carpeta u organismo…" value="${esc(f.texto)}">
    <select id="ft-estado"><option value="">Todos los estados</option>
      ${ESTADOS_TRAMITE.map(e => `<option ${f.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
    <select id="ft-organismo"><option value="">Todos los organismos</option>
      ${unicos(Store.listar('tramites').map(t => t.organismo)).map(o => `<option ${f.organismo === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
    <select id="ft-tipo"><option value="">Todos los trámites</option>
      ${unicos(Store.listar('tramites').map(t => t.tipo)).map(o => `<option ${f.tipo === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
    <label class="pild" style="cursor:pointer"><input type="checkbox" id="ft-activas" ${f.soloActivas ? 'checked' : ''}
      style="width:15px;height:15px;margin-right:6px"> Solo carpetas abiertas</label>
    <span class="cuenta">${lista.length} trámite(s)</span>
  </div>

  <div class="cols">
    ${bloque('Vencidos', vencidos, 't-vencido')}
    ${bloque('Vencen esta semana', semana, 't-pronto')}
    ${bloque('A solicitar', aSolicitar, '')}
    ${bloque('Pedidos, esperando', enCurso, '')}
    ${resto.length ? tarjeta({ titulo: 'El resto', extraTitulo: `<span class="pild">${resto.length}</span>`,
      sinAire: true, cuerpo: tablaTramites(ordenar(resto, t => t.fObtencion || '0', true).slice(0, 80)) }) : ''}
    ${!lista.length ? vacio('No hay trámites con esos filtros') : ''}
  </div>`;

  const t = $('#ft-texto', cont); let esp;
  t.oninput = () => { clearTimeout(esp); esp = setTimeout(() => { filtrosTram.texto = t.value; repintar(); $('#ft-texto')?.focus(); }, 320); };
  $('#ft-estado', cont).onchange = e => { filtrosTram.estado = e.target.value; repintar(); };
  $('#ft-organismo', cont).onchange = e => { filtrosTram.organismo = e.target.value; repintar(); };
  $('#ft-tipo', cont).onchange = e => { filtrosTram.tipo = e.target.value; repintar(); };
  $('#ft-activas', cont).onchange = e => { filtrosTram.soloActivas = e.target.checked; repintar(); };
  $('[data-modo-registro]', cont).onclick = modoRegistro;
  $$('[data-tram]', cont).forEach(b => b.onclick = () => editarTramite(b.dataset.tram));
};

function tablaTramites(lista) {
  return `<div class="tabla-marco"><table class="t">
    <thead><tr><th>Trámite</th><th>Carpeta</th><th>Organismo</th><th>Solicitado</th>
      <th>Obtenido</th><th>Vence</th><th>Estado</th><th class="n">Costo</th></tr></thead>
    <tbody>${lista.map(t => `<tr class="clic" data-tram="${t.id}">
      <td class="titulo"><b>${esc(t.tipo)}</b></td>
      <td class="mini">${esc(t.carpeta.nro)}<br><small>${esc(t.carpeta.caratula)}</small></td>
      <td class="mini">${esc(t.organismo)}</td>
      <td class="mini">${fecha(t.fSolicitud)}</td>
      <td class="mini">${fecha(t.fObtencion)}</td>
      <td class="mini">${t.vence ? `<b class="t-${t.luz}">${fecha(t.vence)}</b><br><small>${enPalabras(t.vence)}</small>` : '—'}</td>
      <td>${chip(t.estadoReal)}</td>
      <td class="n">${t.costo ? pesos(t.costo) : '—'}<br><small>${t.pagadoPor === 'cliente' ? 'del cliente' : 'del estudio'}</small></td>
    </tr>`).join('')}</tbody></table></div>`;
}


/* ===== js/18-finanzas.js ===== */
/* ============================================================
   FINANZAS · Ingresos | Egresos | Resultados | Flujo de caja
   más el bloque aparte de Fondos de clientes.
   (Resultados y Flujo de caja están en 19-resultados.js)
   ============================================================ */

let finSolapa = 'ingresos';
let finMes = clave(iso(HOY()));
let filtrosFin = { estado: '', medio: '', categoria: '', tipoAsunto: '', texto: '' };

VISTAS.finanzas = function (cont) {
  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Finanzas</h2>
    <p>Lo que entra, lo que sale, el resultado del estudio y la caja de verdad.
       Los fondos de los clientes van aparte: pasan por la caja, pero nunca suman al resultado.</p>
  </div><div class="btn-fila" id="fin-acciones"></div></div>

  <div class="solapas">
    ${[['ingresos', 'Ingresos'], ['egresos', 'Egresos'], ['resultados', 'Resultados'],
       ['flujo', 'Flujo de caja'], ['fondos', 'Fondos de clientes']]
      .map(([id, t]) => `<button class="${finSolapa === id ? 'on' : ''}" data-sol="${id}">${t}</button>`).join('')}
  </div>
  <div id="fin-cuerpo"></div>`;

  $$('[data-sol]', cont).forEach(b => b.onclick = () => { finSolapa = b.dataset.sol; repintar(); });
  const cuerpo = $('#fin-cuerpo', cont);
  const acc = $('#fin-acciones', cont);
  if (finSolapa === 'ingresos') { pintarIngresos(cuerpo); acc.innerHTML = '<button class="btn p" data-nuevo-ingreso>+ Ingreso</button>'; }
  if (finSolapa === 'egresos') { pintarEgresos(cuerpo); acc.innerHTML = '<button class="btn p" data-nuevo-egreso>+ Gasto del estudio</button>'; }
  if (finSolapa === 'resultados') pintarResultados(cuerpo);
  if (finSolapa === 'flujo') pintarFlujo(cuerpo);
  if (finSolapa === 'fondos') pintarFondos(cuerpo);
  $('[data-nuevo-ingreso]', cont)?.addEventListener('click', () => formIngreso());
  $('[data-nuevo-egreso]', cont)?.addEventListener('click', () => formEgreso());
  prepararTablas(cont);
};

/* Selector de mes, igual en ingresos y egresos */
function selectorMes(id) {
  const meses = Fin.meses(25);
  return `<select id="${id}">
    <option value="">Todos los meses</option>
    ${meses.slice().reverse().map(m => `<option value="${m}" ${finMes === m ? 'selected' : ''}>${mesNombre(m)}</option>`).join('')}</select>`;
}

/* ============== INGRESOS ============== */
function pintarIngresos(cont) {
  const f = filtrosFin;
  let lista = Fin.ingresos().map(m => Object.assign({}, m, { estadoReal: Fin.estadoIngreso(m) }));
  if (finMes) lista = lista.filter(m => clave(m.fecha) === finMes);
  if (f.estado) lista = lista.filter(m => m.estadoReal === f.estado);
  if (f.medio) lista = lista.filter(m => m.medio === f.medio);
  if (f.tipoAsunto) lista = lista.filter(m => m.tipoAsunto === f.tipoAsunto);
  if (f.texto) lista = lista.filter(m => contiene(m.concepto, f.texto) ||

  const pendiente = total - cobrado;
  const vencido = suma(lista.filter(m => m.estadoReal === 'Vencido'), m => Fin.monto(m));

      ${unicos(Fin.ingresos().map(m => m.tipoAsunto)).map(t => `<option ${f.tipoAsunto === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <select id="fi-medio"><option value="">Todos los medios de pago</option>
      ${MEDIOS_PAGO.map(e => `<option ${f.medio === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
    <input type="search" class="crece" id="fi-texto" placeholder="Concepto o cliente…" value="${esc(f.texto)}">
    <span class="cuenta">${lista.length} ingreso(s)</span>
  </div>

  <div class="cols p23">
    <section class="tarjeta"><div class="cuerpo sin-aire"><div class="tabla-marco">
    ${lista.length ? `<table class="t">
      <thead><tr><th>Concepto</th><th>Fecha</th><th>Asunto</th><th>Medio</th>
        <th>Estado</th><th>Cobrado el</th><th class="n">Monto</th><th></th></tr></thead>
      <tbody>${lista.slice(0, 220).map(m => `<tr>
        <td class="titulo"><b>${esc(m.concepto)}</b>
          ${m.clienteId ? `<i style="display:block;font-style:normal;font-size:12px;color:var(--tinta3)">${esc(Datos.nombreCliente(m.clienteId))}</i>` : ''}</td>
        <td class="mini">${fecha(m.fecha)}</td>
        <td class="mini">${esc(m.tipoAsunto || '—')}</td>
        <td class="mini">${esc(m.medio || '—')}</td>
        <td>${chip(m.estadoReal)}${m.estadoReal !== 'Cobrado' && m.fEstimada ? `<br><small>estimado ${fecha(m.fEstimada)}</small>` : ''}</td>
        <td class="mini">${fecha(m.fEfectiva)}</td>
        <td class="n"><b>${plata(m.monto, m.moneda, m.tc)}</b>
          <br><small>neto ${pesos(Fin.neto(m))}</small></td>
        <td class="no-imprimir">${m.estado !== 'Cobrado'
          ? `<button class="btn chico d" data-cobrar="${m.id}">Cobrar</button>`

      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="6">Total</td><td class="n">${pesos(total)}</td><td></td></tr></tfoot></table>`
      : vacio('No hay ingresos con esos filtros')}
    </div></div></section>

    ${tarjeta({
      titulo: 'Por tipo de asunto',
      cuerpo: (() => {
        const filas = ordenar(Object.entries(porTipo).map(([t, l]) => ({ t, v: suma(l, m => Fin.neto(m)), n: l.length })), x => -x.v);
        const max = Math.max(1, ...filas.map(x => x.v));
        return filas.length ? filas.map(x => `<div class="barra-h">
          <span class="nm">${esc(x.t)}</span><span class="bg"><i style="width:${(x.v / max) * 100}%"></i></span>
          <span class="vl">${pesos(x.v)}</span></div>`).join('')

  $('#fi-estado', cont).onchange = e => { filtrosFin.estado = e.target.value; repintar(); };
  $('#fi-tipo', cont).onchange = e => { filtrosFin.tipoAsunto = e.target.value; repintar(); };
  $('#fi-medio', cont).onchange = e => { filtrosFin.medio = e.target.value; repintar(); };

function marcarCobrado(id) {
  const m = Store.obtener('movimientos', id);
  const campos = [
    { n: 'fecha', e: 'Fecha del cobro', tipo: 'date', valor: iso(HOY()), req: true,
      ayuda: 'Con esta fecha entra al flujo de caja' },
    { n: 'medio', e: 'Medio de pago', tipo: 'select', ops: MEDIOS_PAGO, valor: m.medio || 'Transferencia' },
  ];
  modal({
    titulo: 'Marcar como cobrado',
    cuerpo: `<div class="nota" style="margin-bottom:14px">${esc(m.concepto)}<br>
      <b>${plata(m.monto, m.moneda, m.tc)}</b></div><div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Confirmar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      Store.editar('movimientos', id, { estado: 'Cobrado', fEfectiva: v.fecha, medio: v.medio });
      if (m.carpetaId) Reglas.anotarHito(m.carpetaId, `Se cobró ${pesos(Fin.monto(m))} (${v.medio})`, 'cobro', v.fecha);
      aviso('Cobrado'); repintar();
    } }],
  });
}

function formIngreso(id) {
  const m = id ? Store.obtener('movimientos', id) : null;
  const clientes = Store.listar('clientes');
  const nombreCl = c => c.tipo === 'juridica' ? `${c.razon} · RUT ${c.rut}` : `${c.nombre} · CI ${c.ci}`;
  const campos = [
    { n: 'concepto', e: 'Concepto', req: true, ancho: 'ancho-2', valor: m?.concepto || '' },
    { n: 'tipoAsunto', e: 'Tipo de trabajo', tipo: 'sugerido', valor: m?.tipoAsunto || '',
      ops: [...Store.tipos().map(t => t.nombre), 'Certificación de firmas', 'Consulta', 'Otros trabajos'] },
    { n: 'cliente', e: 'Cliente', tipo: 'sugerido', ops: clientes.map(nombreCl),
      valor: m?.clienteId ? nombreCl(Datos.cliente(m.clienteId)) : '' },
    { n: 'monto', e: 'Monto con IVA', tipo: 'number', req: true, valor: m?.monto || null },
    { n: 'moneda', e: 'Moneda', tipo: 'select', valor: m?.moneda || '$',
      ops: [{ v: '$', t: 'Pesos' }, { v: 'USD', t: 'Dólares' }] },
    { n: 'iva', e: 'IVA incluido (%)', tipo: 'number', valor: m?.iva ?? Store.cfg().iva },
    { n: 'fecha', e: 'Fecha del trabajo', tipo: 'date', valor: m?.fecha || iso(HOY()), req: true },
    { n: 'estado', e: 'Estado', tipo: 'select', valor: m?.estado || 'Pendiente', ops: ['Pendiente', 'Cobrado'] },
    { n: 'fEstimada', e: 'Cobro estimado', tipo: 'date', valor: m?.fEstimada || '' },
    { n: 'fEfectiva', e: 'Cobrado el', tipo: 'date', valor: m?.fEfectiva || '' },
    { n: 'medio', e: 'Medio de pago', tipo: 'select', valor: m?.medio || '', ops: ['', ...MEDIOS_PAGO] },
  ];
  modal({
    titulo: id ? 'Editar el ingreso' : 'Nuevo ingreso', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>
      <div class="nota">El ingreso impacta en el <b>flujo de caja</b> solo en la fecha en que se cobra,
        y en los <b>resultados</b> en la fecha del trabajo.</div>`,
    acciones: [
      ...(id ? [{ texto: 'Borrar', clase: 'mal', hacer: () => {
        if (!confirm('¿Borrar este ingreso?')) return false;
        Store.borrar('movimientos', id); repintar();
      } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.concepto || !v.monto) { aviso('Falta el concepto o el monto', 'mal'); return false; }
        const cl = v.cliente ? (clientes.find(c => nombreCl(c) === v.cliente) || clientes.find(c => contiene(nombreCl(c), v.cliente))) : null;
        const datos = { clase: 'ingreso', concepto: v.concepto, tipoAsunto: v.tipoAsunto,
          clienteId: cl ? cl.id : null, carpetaId: m?.carpetaId || null, monto: v.monto, moneda: v.moneda,
          tc: v.moneda === 'USD' ? Store.cfg().tipoCambio : null, iva: v.iva, fecha: v.fecha,
          estado: v.estado, medio: v.medio,
          fEstimada: v.fEstimada || null,
          fEfectiva: v.estado === 'Cobrado' ? (v.fEfectiva || v.fecha) : null };
        if (id) Store.editar('movimientos', id, datos); else Store.crear('movimientos', datos);
        aviso('Ingreso guardado'); repintar();
      } },
    ],
  });
}

/* ---------- Gráficos (SVG hecho a mano, sin librerías) ---------- */
function graficoBarras(datos, alto = 170) {
  /* datos: [{k, a, b}] → dos barras por mes */
  const n = datos.length || 1;
  const max = Math.max(1, ...datos.map(d => Math.max(d.a, d.b)));
  const ancho = Math.max(320, n * 46);
  const paso = ancho / n;
  const h = alto - 26;
  return `<svg class="graf" viewBox="0 0 ${ancho} ${alto}" preserveAspectRatio="none" style="height:${alto}px">
    <line class="eje" x1="0" y1="${h}" x2="${ancho}" y2="${h}"/>
    ${datos.map((d, i) => {
      const x = i * paso, w = paso * 0.3;
      const ha = (d.a / max) * (h - 8), hb = (d.b / max) * (h - 8);
      return `<rect class="bi" x="${x + paso * 0.14}" y="${h - ha}" width="${w}" height="${ha}" rx="2"/>
        <rect class="be" x="${x + paso * 0.52}" y="${h - hb}" width="${w}" height="${hb}" rx="2"/>
        <text class="et" x="${x + paso / 2}" y="${alto - 8}" text-anchor="middle">${mesCorto(d.k)}</text>`;
    }).join('')}
  </svg>`;
}

function graficoLinea(datos, alto = 170) {
  /* datos: [{k, v}] */
  const n = datos.length || 1;
  const vs = datos.map(d => d.v);
  const max = Math.max(1, ...vs), min = Math.min(0, ...vs);
  const ancho = Math.max(320, n * 46);
  const h = alto - 26;
  const x = i => (i / Math.max(1, n - 1)) * (ancho - 10) + 5;
  const y = v => h - ((v - min) / (max - min || 1)) * (h - 10);
  const puntos = datos.map((d, i) => `${x(i)},${y(d.v)}`).join(' ');
  return `<svg class="graf" viewBox="0 0 ${ancho} ${alto}" preserveAspectRatio="none" style="height:${alto}px">
    <line class="eje" x1="0" y1="${y(0)}" x2="${ancho}" y2="${y(0)}"/>
    <polygon class="ar" points="${x(0)},${y(0)} ${puntos} ${x(n - 1)},${y(0)}"/>
    <polyline class="ln" points="${puntos}"/>
    ${datos.map((d, i) => `<circle class="pt" cx="${x(i)}" cy="${y(d.v)}" r="2.6"/>
      ${i % Math.ceil(n / 12) === 0 ? `<text class="et" x="${x(i)}" y="${alto - 8}" text-anchor="middle">${mesCorto(d.k)}</text>` : ''}`).join('')}
  </svg>`;
}

/* ============== FLUJO DE CAJA ============== */
function pintarFlujo(cont) {
  const todos = Fin.flujo(24);
  const lista = todos.slice(-resMeses);
  const actual = todos[todos.length - 1];
  const negativos = todos.filter(f => f.final < 0);
  const medios = unicos(lista.flatMap(f => Object.keys(f.porMedio)));
  const porCobrar = Fin.porCobrar();
  const porPagar = Fin.porPagar();

  cont.innerHTML = `
  <div class="nums">
    ${numero_('Saldo de caja hoy', pesos(actual.final), 'Solo lo realmente cobrado y pagado',
      actual.final < 0 ? 'vencido' : 'ok')}
    ${numero_('Cobros de ' + mesCorto(actual.k), pesos(actual.cobros), `${actual.nCobros} cobro(s)`, 'ok')}
    ${numero_('Pagos de ' + mesCorto(actual.k), pesos(actual.pagos), `${actual.nPagos} pago(s)`)}
    ${numero_('Fondos de terceros', pesos(Fin.enCustodia()), 'Plata de clientes en custodia', 'pronto')}
  </div>

  ${negativos.length ? `<div class="nota-legal"><div><b>Atención:</b> en
    ${negativos.map(f => mesNombre(f.k)).join(', ')} la caja cerró en negativo.
    Conviene mirar las fechas de cobro frente a las de pago.</div></div>` : ''}

  <div class="nota">Al flujo de caja entra <b>solo lo real</b>: un ingreso aparece el día que se marca
    como cobrado y un egreso el día que se marca como pagado. Hoy quedan afuera
    <b>${pesos(suma(porCobrar, m => Fin.monto(m)))}</b> por cobrar y
    <b>${pesos(suma(porPagar, m => Fin.monto(m)))}</b> por pagar.

  <div class="filtros" style="margin-top:16px">
    <select id="ff-meses">
      ${[6, 12, 24].map(n => `<option value="${n}" ${resMeses === n ? 'selected' : ''}>Últimos ${n} meses</option>`).join('')}</select>

    <button class="btn chico" data-imp-flujo>Imprimir el informe</button>
  </div>

  ${tarjeta({
    titulo: 'Cómo evolucionó el saldo',
    cuerpo: `<div class="tabla-marco" style="overflow:auto">${graficoLinea(lista.map(f => ({ k: f.k, v: f.final })))}</div>
      <div class="graf-leyenda"><span><i style="background:var(--bordo)"></i>Saldo al cierre de cada mes</span></div>`,
  })}

  <section class="tarjeta" style="margin-top:16px">
    <header><h3>Movimiento de la caja</h3><span class="pild">${resMeses} meses</span></header>
    <div class="cuerpo sin-aire"><div class="tabla-marco">
      <table class="t compacta">
        <thead><tr><th>Mes</th><th class="n">Saldo inicial</th><th class="n">+ Cobros</th>
          <th class="n">− Pagos</th><th class="n">Fondos de terceros</th><th class="n">Saldo final</th></tr></thead>
        <tbody>${lista.slice().reverse().map(f => `<tr>
          <td class="titulo"><b style="text-transform:capitalize">${mesNombre(f.k)}</b></td>
          <td class="n">${pesos(f.inicial)}</td>
          <td class="n t-ok">${pesos(f.cobros)}</td>
          <td class="n">${pesos(f.pagos)}</td>
          <td class="n">${f.fondos ? (f.fondos > 0 ? '+' : '−') + pesos(Math.abs(f.fondos)) : '—'}</td>
          <td class="n"><b class="${f.final < 0 ? 't-vencido' : ''}">${pesos(f.final)}</b></td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total del período</td><td class="n">${pesos(lista[0].inicial)}</td>
          <td class="n">${pesos(suma(lista, f => f.cobros))}</td>
          <td class="n">${pesos(suma(lista, f => f.pagos))}</td>
          <td class="n">${pesos(suma(lista, f => f.fondos))}</td>
          <td class="n">${pesos(lista[lista.length - 1].final)}</td></tr></tfoot>
      </table>
    </div></div>
  </section>

  <div class="cols c2" style="margin-top:16px">
    ${tarjeta({
      titulo: 'Cómo nos pagan', sinAire: true,
      cuerpo: `<div class="tabla-marco"><table class="t compacta">
        <thead><tr><th>Medio de pago</th>${lista.map(f => `<th class="n">${mesCorto(f.k)}</th>`).join('')}<th class="n">Total</th></tr></thead>

      </table></div>`,
    })}

    ${tarjeta({
      titulo: 'Lo que está por entrar y por salir', sinAire: true,
      cuerpo: `<div class="avisos">
        ${porCobrar.slice(0, 7).map(m => `<div class="aviso" ${m.carpetaId ? `data-ir-carpeta="${m.carpetaId}"` : ''}>
          <span class="luz ${m.estadoReal === 'Vencido' ? 'vencido' : 'pronto'}"></span>
          <div class="tx"><b>${esc(m.concepto)}</b><span>Por cobrar · ${m.fEstimada ? enPalabras(m.fEstimada) : 'sin fecha'}</span></div>
          <div class="der"><b class="t-ok">+${pesos(Fin.monto(m))}</b></div></div>`).join('')}
        ${porPagar.slice(0, 7).map(m => `<div class="aviso">

          <div class="tx"><b>${esc(m.concepto)}</b><span>Por pagar · ${m.fVence ? enPalabras(m.fVence) : 'sin fecha'}</span></div>
          <div class="der"><b>−${pesos(Fin.monto(m))}</b></div></div>`).join('')}
      </div>`,
    })}
  </div>`;

  $('#ff-meses', cont).onchange = e => { resMeses = +e.target.value; repintar(); };
  $('[data-exp-flujo]', cont).onclick = () => exportarFlujo(lista);
  $('[data-imp-flujo]', cont).onclick = () => imprimirFlujo(lista);
  $$('[data-ir-carpeta]', cont).forEach(b => b.onclick = () => abrirCarpeta(b.dataset.irCarpeta));
}

/* ---------- Armado de cada reporte ---------- */
function armarReporte(id) {
  const cfg = Store.cfg();
  if (id === 'rendicion') {
    const l = Fin.fondosPorCarpeta().concat(
      Store.listar('carpetas', c => c.honorario && !Fin.fondosPorCarpeta().some(f => f.carpeta.id === c.id))
        .map(c => ({ carpeta: c, recibido: 0, aplicado: 0, devuelto: 0, saldo: 0 })));
    const filas = l.filter(f => f.carpeta.fApertura >= repDesde && f.carpeta.fApertura <= repHasta)
      .map(f => {
        const cu = Reglas.cuenta(f.carpeta);
        return { id: f.carpeta.id, c: [`<b>${esc(f.carpeta.caratula)}</b><br><small>N° ${f.carpeta.nro}</small>`,
          chip(f.carpeta.estado), pesos(cu.totalHonorario), pesos(cu.cobrado), pesos(cu.gTotal),
          pesos(f.recibido), (f.saldo < 0 ? '−' : '') + pesos(Math.abs(f.saldo)),
          `<button class="btn chico">Ver</button>`] };
      });
    return { columnas: ['Carpeta', 'Estado', 'Honorarios', 'Cobrado', 'Gastos', 'Fondos recibidos', 'Saldo de fondos', ''],
      nums: [2, 3, 4, 5, 6], filas,
      nota: 'Elegí una carpeta para abrirla y generar su rendición imprimible (con logo, datos del cliente y firma).' };
  }

  if (id === 'protocolo') {
    const lista = ordenar(Store.listar('escrituras', e => e.fecha >= repDesde && e.fecha <= repHasta), e => e.nro);
    return {
      columnas: ['N°', 'Fecha', 'Acto', 'Otorgantes', 'Folios', 'Inscripción', 'Copias'],
      nums: [6],
      filas: lista.map(e => ({ c: [`<b>${e.nro}/${e.anio}</b>`, fecha(e.fecha), esc(e.acto), esc(e.otorgantes),
        e.folioDesde ? `${e.folioDesde}–${e.folioHasta}` : '—',
        e.inscripcion?.fecha ? `${fecha(e.inscripcion.fecha)} · N° ${esc(e.inscripcion.nro || '')}` : (e.inscripcion?.registro ? 'presentada' : '—'),
        String((e.copias || []).length)] })),
      total: ['Total', `${lista.length} escrituras`, '', '', '', '', String(suma(lista, e => (e.copias || []).length))],
      nota: `Escrituras otorgadas entre el ${fecha(repDesde)} y el ${fecha(repHasta)}.`,
    };
  }

  if (id === 'carpetas') {
    const lista = ordenar(Store.listar('carpetas', c => c.fApertura >= repDesde && c.fApertura <= repHasta), c => c.nro, true);
    return {
      columnas: ['Carpeta', 'Asunto', 'Estado', 'Apertura', 'Firma', 'Avance', 'Por cobrar'],
      nums: [5, 6],
      filas: lista.map(c => {
        const av = Reglas.avance(c), cu = Reglas.cuenta(c);
        return { id: c.id, c: [`<b>${esc(c.caratula)}</b><br><small>N° ${c.nro} · ${esc(Datos.partesTexto(c, true))}</small>`,
          esc(Store.tipo(c.tipoId).nombre), chip(c.estado), fecha(c.fApertura),
          c.fFirmaReal ? fecha(c.fFirmaReal) : (c.fFirmaEst ? fecha(c.fFirmaEst) + ' (prev.)' : '—'),
          `${av.hechos}/${av.total}`, cu.porCobrar > 0 ? pesos(cu.porCobrar) : '—'] };
      }),
      total: ['Total', `${lista.length} carpetas`, '', '', '', '',
        pesos(suma(lista, c => Reglas.cuenta(c).porCobrar))],
      nota: `Carpetas abiertas entre el ${fecha(repDesde)} y el ${fecha(repHasta)}.`,
    };
  }

  if (id === 'tramites') {
    const lista = ordenar(Reglas.tramitesConPlazo(t => (t.fSolicitud || t.fObtencion || '9999') >= repDesde &&
      (t.fSolicitud || t.fObtencion || '0000') <= repHasta), t => t.vence || '9999');
    return {
      columnas: ['Trámite', 'Carpeta', 'Organismo', 'Solicitado', 'Obtenido', 'Vence', 'Estado', 'Costo'],
      nums: [7],
      filas: lista.map(t => {
        const c = Datos.carpeta(t.carpetaId);
        return { id: c?.id, c: [`<b>${esc(t.tipo)}</b>`, c ? esc(c.nro) : '—', esc(t.organismo),
          fecha(t.fSolicitud), fecha(t.fObtencion),
          t.vence ? `<span class="t-${t.luz}">${fecha(t.vence)}</span>` : '—',
          chip(t.estadoReal), t.costo ? pesos(t.costo) : '—'] };
      }),
      total: ['Total', `${lista.length} trámites`, '', '', '', '', '', pesos(suma(lista, t => t.costo))],
      nota: `Trámites con movimiento entre el ${fecha(repDesde)} y el ${fecha(repHasta)}.`,
    };
  }

  if (id === 'resultados') {
    const meses = Fin.meses(24).filter(k => k >= clave(repDesde) && k <= clave(repHasta));
    const todos = Fin.resultados(24).filter(r => meses.includes(r.k));
    return {
      columnas: ['Mes', 'Ingresos (sin IVA)', 'Egresos', 'Resultado', 'Margen', 'Carpetas cerradas'],
      nums: [1, 2, 3, 4, 5],
      filas: todos.slice().reverse().map(r => ({ c: [`<b style="text-transform:capitalize">${mesNombre(r.k)}</b>`,
        pesos(r.ingresos), pesos(r.egresos),
        `<b class="${r.resultado < 0 ? 't-vencido' : ''}">${pesos(r.resultado)}</b>`,
        r.margen + ' %', String(r.carpetasCerradas)] })),
      total: ['Total del período', pesos(suma(todos, r => r.ingresos)), pesos(suma(todos, r => r.egresos)),
        pesos(suma(todos, r => r.resultado)),
        pct(suma(todos, r => r.resultado), suma(todos, r => r.ingresos)) + ' %',
        String(suma(todos, r => r.carpetasCerradas))],
      nota: 'Por fecha del trabajo y sin IVA. El IVA no es ingreso del estudio.',
    };
  }

  if (id === 'flujo') {
    const meses = Fin.meses(24).filter(k => k >= clave(repDesde) && k <= clave(repHasta));
    const todos = Fin.flujo(24).filter(f => meses.includes(f.k));
    return {
      columnas: ['Mes', 'Saldo inicial', 'Cobros', 'Pagos', 'Fondos de terceros', 'Saldo final'],
      nums: [1, 2, 3, 4, 5],
      filas: todos.slice().reverse().map(f => ({ c: [`<b style="text-transform:capitalize">${mesNombre(f.k)}</b>`,
        pesos(f.inicial), pesos(f.cobros), pesos(f.pagos),
        f.fondos ? (f.fondos > 0 ? '+' : '−') + pesos(Math.abs(f.fondos)) : '—',
        `<b class="${f.final < 0 ? 't-vencido' : ''}">${pesos(f.final)}</b>`] })),
      total: todos.length ? ['Total del período', pesos(todos[0].inicial), pesos(suma(todos, f => f.cobros)),
        pesos(suma(todos, f => f.pagos)), pesos(suma(todos, f => f.fondos)),
        pesos(todos[todos.length - 1].final)] : null,
      nota: 'Solo lo realmente cobrado y pagado. Los fondos de terceros van en su propia columna.',
    };
  }

  /* clientes */
  const lista = Store.listar('clientes');
  return {
    columnas: ['Cliente', 'Documento', 'Teléfono', 'Carpetas', 'Facturado', 'Por cobrar'],
    nums: [3, 4, 5],
    filas: ordenar(lista, c => sinTildes(c.nombre || c.razon)).map(c => {
      const carpetas = Store.listar('carpetas', x => (x.partes || []).some(p => p.clienteId === c.id));
      const fact = suma(Store.listar('movimientos', m => m.clase === 'ingreso' && m.clienteId === c.id), m => Fin.monto(m));
      const deuda = suma(carpetas, x => Reglas.cuenta(x).porCobrar);
      return { id: c.id, c: [`<b>${esc(c.nombre || c.razon)}</b>`, esc(Datos.docCliente(c.id)),
        esc(c.tel || '—'), String(carpetas.length), fact ? pesos(fact) : '—', deuda ? pesos(deuda) : '—'] };
    }),
    nota: `${lista.length} clientes cargados.`,
  };
}

/* ---------- Excel ---------- */
function filasPlanas(datos) {
  const limpiar = h => String(h).replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&').replace(/&nbsp;/g, ' ')
    .replace(/\s+/g, ' ').trim();
  const aNumero = v => {
    const t = limpiar(v).replace(/US\$|\$|\s|\./g, '').replace(',', '.');
    return /^-?[\d.]+$/.test(t) && t !== '' ? (limpiar(v).startsWith('−') ? -Math.abs(+t) : +t) : limpiar(v);
  };
  const cab = datos.columnas.map(limpiar).filter(c => c);
  const cuerpo = datos.filas.map(f => f.c.slice(0, cab.length).map((v, i) =>
    datos.nums?.includes(i) ? aNumero(v) : limpiar(v)));
  if (datos.total) cuerpo.push(datos.total.slice(0, cab.length).map((v, i) =>
    datos.nums?.includes(i) ? aNumero(v) : limpiar(v)));
  return [cab, ...cuerpo];
}

function aExcel(datos, nombre) {
  if (typeof XLSX === 'undefined') return aviso('Todavía se está cargando el exportador, probá en un segundo', 'mal');
  const filas = filasPlanas(datos);
  const hoja = XLSX.utils.aoa_to_sheet([
    [Store.cfg().estudio.nombre],
    [nombre + ' · ' + fecha(repDesde) + ' al ' + fecha(repHasta)],
    [],
    ...filas,
  ]);
  hoja['!cols'] = filas[0].map((_, i) => ({ wch: i === 0 ? 46 : 18 }));
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, nombre.slice(0, 28));
  XLSX.writeFile(libro, `${sinTildes(nombre).replace(/\s+/g, '-')}-${iso(HOY())}.xlsx`);
  aviso('Excel descargado');
}

/* ---------- PDF ---------- */
function aPDF(datos, nombre) {
  if (typeof window.jspdf === 'undefined') return aviso('Todavía se está cargando el exportador, probá en un segundo', 'mal');
  const cfg = Store.cfg();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const filas = filasPlanas(datos);

  doc.setFont('times', 'bold'); doc.setFontSize(14); doc.setTextColor(90, 31, 46);
  doc.text(cfg.estudio.nombre, 14, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text(`${cfg.estudio.direccion} · ${cfg.estudio.tel} · ${cfg.estudio.email}`, 14, 23.5);
  doc.setDrawColor(185, 151, 91); doc.setLineWidth(.4); doc.line(14, 26, 196, 26);
  doc.setFont('times', 'bold'); doc.setFontSize(12); doc.setTextColor(43, 43, 43);
  doc.text(nombre, 14, 33);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 110, 110);
  doc.text(`Período: ${fecha(repDesde)} al ${fecha(repHasta)} · emitido el ${fecha(iso(HOY()))}`, 14, 38);

  doc.autoTable({
    head: [filas[0]], body: filas.slice(1), startY: 43,
    styles: { font: 'helvetica', fontSize: 7.4, cellPadding: 1.8, textColor: [43, 43, 43] },
    headStyles: { fillColor: [90, 31, 46], textColor: 255, fontStyle: 'bold', fontSize: 7.2 },
    alternateRowStyles: { fillColor: [250, 247, 241] },
    columnStyles: Object.fromEntries((datos.nums || []).map(i => [i, { halign: 'right' }])),
    margin: { left: 14, right: 14 },
    didDrawPage: () => {
      const p = doc.internal.getNumberOfPages();
      doc.setFontSize(7.5); doc.setTextColor(140, 140, 140);
      doc.text(`${cfg.estudio.nombre} · página ${doc.internal.getCurrentPageInfo().pageNumber} de ${p}`, 14, 290);
      doc.text('Desarrollado por Wydan Solutions', 196, 290, { align: 'right' });
    },
  });
  doc.save(`${sinTildes(nombre).replace(/\s+/g, '-')}-${iso(HOY())}.pdf`);
  aviso('PDF descargado');
}

/* ===== js/98-celular.js ===== */
/* ============================================================
   CELULAR · las tablas se arreglan solas
   Se llama después de pintar cada sección. Mira cuántas columnas
   tiene cada tabla y decide:
   · hasta 7 columnas → se convierte en FICHAS (etiqueta + dato)
   · más de 7        → se desliza de costado con la primera columna fija
   Al agregar una sección nueva no hay que tocar nada de esto.
   ============================================================ */

const COLUMNAS_FICHA = 7;

function prepararTablas(ctx = document) {
  $$('table.t', ctx).forEach(tabla => {
    if (tabla.closest('#impreso')) return;
    const cab = $$('thead th', tabla).map(th => th.textContent.trim());
    if (!cab.length) return;

    const modo = cab.length <= COLUMNAS_FICHA ? 'cel-fichas' : 'cel-ancho';
    tabla.classList.remove('cel-fichas', 'cel-ancho');
    tabla.classList.add(modo);

    /* La etiqueta de cada dato, para cuando la fila se ve como ficha */
    $$('tbody tr', tabla).forEach(tr => {
      $$('td', tr).forEach((td, i) => {
        const et = cab[i] || '';
        if (et) td.setAttribute('data-et', et);
        else if (!td.classList.contains('titulo')) td.classList.add('esconder-cel');
      });
    });

    /* Las tablas largas se desplazan dentro de su tarjeta, con el
       encabezado siempre visible (solo en computadora). */
    const marcoAlto = tabla.closest('.tabla-marco');
    if (marcoAlto) marcoAlto.classList.toggle('alta',
      window.innerWidth > 760 && $$('tbody tr', tabla).length > 22);

    /* Aviso de que se desliza (solo en las anchas y solo una vez) */
    if (modo === 'cel-ancho') {
      const marco = tabla.closest('.tabla-marco');
      if (marco && !marco.previousElementSibling?.classList?.contains('cel-ancho-aviso')) {
        const a = document.createElement('div');
        a.className = 'cel-ancho-aviso';
        a.innerHTML = '↔ Esta tabla se desliza de costado';
        marco.parentNode.insertBefore(a, marco);
      }
    }
  });
}

/* Si cambia el tamaño de la ventana, se vuelven a clasificar las tablas */
let _tamanio;
window.addEventListener('resize', () => {
  clearTimeout(_tamanio);
  _tamanio = setTimeout(() => prepararTablas(document.querySelector('.seccion.on') || document), 200);
});

   Abre los datos y muestra la primera pantalla.
   Con ?web=1 entra directo al bloqueo (para la web de Wydan).
   Con ?v=2 o cualquier otro valor, solo sirve para que el navegador
   no muestre una versión guardada vieja.
   ============================================================ */

(function arrancar() {
  Store.abrir();

  /* Enganches de las dos primeras pantallas */
  $('#bv-entrar').onclick = mostrarBloqueo;
  $('#bq-volver').onclick = mostrarBienvenida;
  $('#bq-form').onsubmit = probarClave;

  const directo = new URLSearchParams(location.search).has('web');
  if (directo) mostrarBloqueo(); else mostrarBienvenida();

  /* Que la fecha no quede vieja si alguien deja la página abierta toda la noche */
  let diaMostrado = iso(HOY());
  setInterval(() => {
    if (iso(HOY()) !== diaMostrado && !$('#app').classList.contains('hidden')) {
      diaMostrado = iso(HOY());
      repintar();
    }
  }, 60000);
})();

</script>
</body>
</html>
