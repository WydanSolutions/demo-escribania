    else if (/poder/.test(tipoId)) r = `${t.nombre} – ${a}${b ? ' a ' + b : ''}`;
    else r = `${t.nombre} – ${a || b}`;
    if (bien) r += bien.clase === 'inmueble' ? ` – Padrón ${bien.padron}` : ` – ${bien.matricula}`;
    return r;
  }
  /* Mini acceso a los tipos mientras se siembra (Store todavía no abrió) */
  function Store0tipo(id) { return D.tiposAsunto.find(t => t.id === id) || D.tiposAsunto[0]; }

  function checklist(tipoId) {
    const t = Store0tipo(tipoId);
    const arm = (g, l) => (l || []).map(texto => ({ id: uid('it'), grupo: g, texto, hecho: false, fecha: null, nota: '' }));
    return [...arm('doc', t.doc), ...arm('cert', t.cert), ...arm('tram', t.tram)];
  }

  /* Crea una carpeta completa y todo lo que cuelga de ella */
  function nuevaCarpeta(opts) {
    const tipoId = opts.tipoId || uno(RULETA);
    const t = Store0tipo(tipoId);
    const roles = ROL_POR_TIPO[tipoId] || ['Consultante'];
    const usaJuridica = ['sas', 'srl', 'mod-contrato'].includes(tipoId) ? false : quizas(0.12);
    const partes = roles.map(rol => ({
      clienteId: uno(usaJuridica && rol !== 'Causante' ? [...juridicas, ...fisicas] : fisicas).id, rol,
    }));
    if (['sas', 'srl', 'mod-contrato'].includes(tipoId) && quizas(0.5))
      partes.push({ clienteId: uno(juridicas).id, rol: 'Socio' });

    const fApertura = opts.fApertura;
    const bien = CON_BIEN.includes(tipoId) ? uno(tipoId === 'cv-vehiculo' ? vehiculos : inmuebles)
      : (tipoId === 'cv-vehiculo' ? uno(vehiculos) : null);
    const bienR = tipoId === 'cv-vehiculo' ? uno(vehiculos) : bien;

    const precio = bienR ? redondo(bienR.valorCatastral * (1.5 + az() * 0.6), 10000) : 0;
    const enUSD = /^cv-inmueble/.test(tipoId) && quizas(0.35);
    const hBase = (t.pctPrecio && precio) ? precio * (t.pctPrecio / 100) : t.honorario;
    const honorario = enUSD ? redondo(hBase / CONFIG_INICIAL.tipoCambio, 50) : redondo(hBase * (0.85 + az() * 0.35), 500);

    const c = {
      id: 'car-' + D.carpetas.length, nro: nuevoNro(fApertura), tipoId,
      partes, bienId: bienR ? bienR.id : null,
      escribana: quizas(0.6) ? ESCRIBANAS[0] : ESCRIBANAS[1],
      fApertura, fFirmaEst: opts.fFirmaEst || null, fFirmaReal: opts.fFirmaReal || null,
      fCierre: opts.fCierre || null, estado: opts.estado,
      honorario: opts.sinHonorario ? 0 : honorario, moneda: enUSD ? 'USD' : '$',
      tc: enUSD ? CONFIG_INICIAL.tipoCambio : null,
      precio, obs: opts.obs || '', checklist: checklist(tipoId), hitos: [],
    };
    c.caratula = caratula(tipoId, partes, bienR);
    c.hitos.push({ fecha: fApertura, texto: 'Se abrió la carpeta', tipo: 'apertura' });
    D.carpetas.push(c);

    /* --- Checklist: cuánto está hecho según el estado --- */
    const avance = opts.avance != null ? opts.avance
      : ({ 'Consulta': 0.1, 'En preparación': 0.5, 'Lista para firmar': 0.95, 'Firmada': 1,
           'En inscripción': 1, 'Cerrada': 1, 'Archivada': 1, 'Cancelada': 0.4 })[c.estado];
    c.checklist.forEach((it, i) => {
      const hechoLimite = Math.round(c.checklist.length * avance);
      if (i < hechoLimite && !(it.grupo === 'tram' && !c.fFirmaReal)) {
        it.hecho = true;
        it.fecha = entre(fApertura, c.fFirmaReal || hoy);
      }
    });

    /* --- Documentos --- */
    const docsDelTipo = (t.doc || []).slice(0, ri(2, 4));
    docsDelTipo.forEach((nombre, i) => {
      const original = /Título|Libreta|Partida|Estatuto/.test(nombre);
      const recibido = avance > 0.3 || quizas(0.5);
      const devuelto = c.estado === 'Cerrada' || c.estado === 'Archivada';
      D.documentos.push({
        id: uid('doc'), carpetaId: c.id, nombre, tipo: original ? 'Título de propiedad' : uno(TIPOS_DOCUMENTO),
        original, recibidoDe: Datos0nombre(partes[i % partes.length].clienteId),
        fRecepcion: recibido ? entre(fApertura, c.fFirmaReal || hoy) : null,
        estado: recibido ? (devuelto ? 'Devuelto' : 'Recibido') : 'Pendiente',
        devuelto, fDevolucion: devuelto ? (c.fCierre || hoy) : null,
        ubicacion: `Caja ${ri(1, 8)} · estante ${uno(['A', 'B', 'C'])}`, nota: '',
      });
    });

    /* --- Trámites --- */
    const viejaYCerrada = ['Cerrada', 'Archivada'].includes(c.estado) && diasHasta(fApertura) < -400;
    if (!viejaYCerrada || quizas(0.35)) {
      const lista = [...(t.cert || []), ...(t.tram || [])];
      lista.forEach(nombre => {
        const def = TIPOS_TRAMITE.find(x => x.nombre === nombre) ||
          { organismo: uno(ORGANISMOS), vigencia: 30, costo: ri(400, 1500) };
        let estado = 'A solicitar', fSol = null, fObt = null;
        if (avance >= 1) {
          estado = /^Inscripción/.test(nombre) ? (c.estado === 'En inscripción' ? uno(['Presentado', 'Presentado', 'Solicitado']) : 'Inscripto') : 'Obtenido';
          fSol = entre(fApertura, c.fFirmaReal || hoy);
          fObt = /^Inscripción/.test(nombre) && estado !== 'Inscripto' ? null : sumarDias(fSol, ri(3, 15));
        } else if (avance > 0.4) {
          estado = quizas(0.6) ? 'Obtenido' : 'Solicitado';
          fSol = entre(fApertura, hoy);
          fObt = estado === 'Obtenido' ? sumarDias(fSol, ri(3, 12)) : null;
        }
        if (/^Pago de ITP/.test(nombre) && avance >= 1) { estado = 'Obtenido'; fObt = c.fFirmaReal ? sumarDias(c.fFirmaReal, ri(2, 12)) : fObt; }
        D.tramites.push({
          id: uid('tra'), carpetaId: c.id, tipo: nombre, organismo: def.organismo,
          fSolicitud: fSol, fObtencion: fObt, vigencia: def.vigencia,
          costo: /^Pago de ITP/.test(nombre) && c.precio ? redondo(c.precio * 0.02, 10) : def.costo,
          pagadoPor: quizas(0.75) ? 'cliente' : 'estudio', estado, obs: '',
        });
      });
    }

    /* --- Honorario: ingreso + IVA --- */
    const yaSeFactura = ['Lista para firmar', 'Firmada', 'En inscripción', 'Cerrada', 'Archivada'].includes(c.estado);
    if (c.honorario && yaSeFactura) {
      const montoConIva = c.honorario * (1 + CONFIG_INICIAL.iva / 100);
      const fFactura = c.fFirmaReal || c.fFirmaEst || sumarDias(fApertura, ri(5, 25));
      let estado = 'Cobrado', fEfectiva = sumarDias(fFactura, ri(0, 20)), fEstimada = null;
      if (opts.cobro === 'pendiente') { estado = 'Pendiente'; fEfectiva = null; fEstimada = adelante(ri(5, 40)); }
      if (opts.cobro === 'vencido') { estado = 'Pendiente'; fEfectiva = null; fEstimada = atras(ri(12, 70)); }
      if (fEfectiva && fEfectiva > hoy) { fEfectiva = null; estado = 'Pendiente'; fEstimada = adelante(ri(3, 20)); }
      D.movimientos.push({
        id: uid('mov'), clase: 'ingreso', fecha: fFactura, carpetaId: c.id,
        clienteId: partes[partes.length - 1].clienteId, tipoAsunto: t.nombre,
        concepto: `Honorarios ${t.nombre.toLowerCase()} — carpeta ${c.nro}`,
        monto: redondo(montoConIva, 10), moneda: c.moneda, tc: c.tc, iva: CONFIG_INICIAL.iva,
        medio: estado === 'Cobrado' ? uno(MEDIOS_PAGO) : '', estado, fEfectiva, fEstimada,
      });
      if (estado === 'Cobrado') c.hitos.push({ fecha: fEfectiva, texto: `Se cobró el honorario (${pesos(aPesos(montoConIva, c.moneda, c.tc))})`, tipo: 'cobro' });
    }

    /* --- Gastos por cuenta del cliente --- */
    const gastosDelTipo = D.tramites.filter(x => x.carpetaId === c.id && x.costo > 0 && x.pagadoPor === 'cliente');
    gastosDelTipo.forEach(tr => {
      const pagado = !!tr.fObtencion || avance >= 1;
      D.gastos.push({
        id: uid('gas'), carpetaId: c.id, concepto: tr.tipo,
        categoria: /ITP/.test(tr.tipo) ? 'ITP' : (/Inscripción|Reserva/.test(tr.tipo) ? 'Tasas registrales' : 'Certificados'),
        monto: tr.costo, fecha: tr.fSolicitud || fApertura,
        estado: pagado ? 'Pagado' : 'Pendiente', fPago: pagado ? (tr.fObtencion || tr.fSolicitud) : null,
        pagadoCon: opts.conFondos ? 'fondos' : (quizas(0.6) ? 'fondos' : 'estudio'),
      });
    });
    if (['cv-inmueble', 'cv-inmueble-hip'].includes(tipoId) && avance >= 1) {
      D.gastos.push({ id: uid('gas'), carpetaId: c.id, concepto: 'Papel notarial y timbres',
        categoria: 'Timbres', monto: redondo(ri(1800, 4200), 10), fecha: c.fFirmaReal || hoy,
        estado: 'Pagado', fPago: c.fFirmaReal || hoy, pagadoCon: opts.conFondos ? 'fondos' : 'estudio' });
    }

    /* --- Línea de tiempo --- */
    if (c.fFirmaReal) c.hitos.push({ fecha: c.fFirmaReal, texto: 'Se firmó la escritura', tipo: 'firma' });
    if (c.fCierre) c.hitos.push({ fecha: c.fCierre, texto: 'Se cerró la carpeta', tipo: 'cierre' });
    if (opts.hitoUltimo) c.hitos.push({ fecha: opts.hitoUltimo, texto: opts.hitoTexto || 'Se pidió documentación al cliente', tipo: 'nota' });
    c.hitos = ordenar(c.hitos, h => h.fecha);
    return c;
  }
  function Datos0nombre(id) { const c = D.clientes.find(x => x.id === id); return c ? (c.tipo === 'juridica' ? c.razon : c.nombre) : ''; }

  /* ---- 3.a) Historia: carpetas cerradas y archivadas (2023 → hace 2 meses) ---- */
  const inicio = '2023-01-09';
  const finHistoria = atras(55);
  const totalHist = 152;
  for (let i = 0; i < totalHist; i++) {
    // Reparto parejo en el tiempo, con más compraventas en primavera y verano
    const fApertura = entre(sumarDias(inicio, Math.floor(diasEntre(inicio, finHistoria) * i / totalHist)),
      sumarDias(inicio, Math.floor(diasEntre(inicio, finHistoria) * (i + 1) / totalHist)));
    const mes = +fApertura.slice(5, 7);
    const verano = [10, 11, 12, 1, 2, 3].includes(mes);
    let tipoId = uno(RULETA);
    if (i % 3 === 0) tipoId = uno(['cv-inmueble', 'cv-inmueble-hip', 'sucesion', 'sas', 'srl', 'particion', 'donacion', 'hipoteca', 'promesa']);
    if (verano && quizas(0.3)) tipoId = uno(['cv-inmueble', 'cv-inmueble-hip', 'cv-vehiculo', 'promesa']);
    if (!verano && quizas(0.2)) tipoId = uno(['sucesion', 'poder-gral', 'poder-esp', 'testamento', 'sas']);
    const t = Store0tipo(tipoId);
    const fFirma = entre(sumarDias(fApertura, Math.round(t.plazoFirma * 0.6)), sumarDias(fApertura, t.plazoFirma + 20));
    const cancelada = quizas(0.045);
    nuevaCarpeta({
      tipoId, fApertura,
      estado: cancelada ? 'Cancelada' : (quizas(0.82) ? 'Cerrada' : 'Archivada'),
      fFirmaEst: fFirma, fFirmaReal: cancelada ? null : fFirma,
      fCierre: cancelada ? null : sumarDias(fFirma, ri(12, 60)),
      cobro: cancelada ? 'pendiente' : 'cobrado',
      sinHonorario: false,
    });
  }

  /* ---- 3.b) Las 4 firmas de esta semana ---- */
  [['cv-inmueble-hip', 0], ['cv-inmueble', 1], ['cv-vehiculo', 3], ['sucesion', 5]].forEach(([tipoId, d]) => {
    let f = adelante(d); while (esFinde(f)) f = sumarDias(f, 1);
    nuevaCarpeta({ tipoId, fApertura: atras(ri(28, 50)), estado: 'Lista para firmar', fFirmaEst: f,
      avance: 0.95, cobro: 'pendiente', obs: 'Firma coordinada. Confirmar que traigan la cédula vigente.' });
  });

  /* ---- 3.c) Seis en inscripción (dos con el plazo por vencer) ---- */
  for (let i = 0; i < 6; i++) {
    const diasDesdeFirma = i < 2 ? ri(24, 27) : ri(4, 16);   // los 2 primeros, al límite
    nuevaCarpeta({ tipoId: uno(['cv-inmueble', 'cv-inmueble-hip', 'donacion', 'particion', 'hipoteca', 'cv-vehiculo']),
      fApertura: atras(diasDesdeFirma + ri(35, 70)), estado: 'En inscripción',
      fFirmaEst: atras(diasDesdeFirma), fFirmaReal: atras(diasDesdeFirma), avance: 1,
      cobro: i < 4 ? 'cobrado' : 'pendiente', conFondos: i < 3,
      obs: i < 2 ? 'Presentar en el Registro cuanto antes: la prioridad se pierde a los 30 días.' : '' });
  }

  /* ---- 3.d) Tres con certificados vencidos ---- */
  for (let i = 0; i < 3; i++) {
    const c = nuevaCarpeta({ tipoId: uno(['cv-inmueble', 'cv-inmueble-hip', 'donacion']),
      fApertura: atras(ri(60, 90)), estado: 'En preparación', fFirmaEst: adelante(ri(6, 20)),
      avance: 0.75, cobro: 'pendiente',
      obs: 'Hay que pedir de nuevo el certificado registral: se pasó la vigencia.' });
    D.tramites.filter(t => t.carpetaId === c.id && /Certificado registral/.test(t.tipo)).forEach(t => {
      t.estado = 'Obtenido'; t.fSolicitud = atras(ri(48, 60)); t.fObtencion = atras(ri(36, 44));
    });
  }

  /* ---- 3.e) Cinco dormidas (más de 30 días sin movimiento) ---- */
  for (let i = 0; i < 5; i++) {
    nuevaCarpeta({ tipoId: uno(['sucesion', 'particion', 'sas', 'cv-inmueble', 'bien-familia']),
      fApertura: atras(ri(95, 170)), estado: uno(['En preparación', 'Consulta']),
      fFirmaEst: null, avance: 0.35, cobro: 'pendiente',
      hitoUltimo: atras(ri(34, 80)), hitoTexto: 'Se le pidió documentación al cliente y no la trajo',
      obs: 'Esperando documentación del cliente desde hace semanas.' });
  }

  /* ---- 3.f) El resto de las activas, en distintos puntos ---- */
  for (let i = 0; i < 14; i++) {
    const tipoId = uno(RULETA);
    const t = Store0tipo(tipoId);
    const fApertura = atras(ri(5, 45));
    nuevaCarpeta({ tipoId, fApertura,
      estado: uno(['En preparación', 'En preparación', 'En preparación', 'Consulta']),
      fFirmaEst: quizas(0.75) ? sumarDias(fApertura, t.plazoFirma + ri(-3, 12)) : null,
      avance: 0.2 + az() * 0.5, cobro: quizas(0.5) ? 'pendiente' : 'cobrado' });
  }

  /* ---- 3.g) Firmadas hace poco, esperando cierre ---- */
  for (let i = 0; i < 8; i++) {
    const f = atras(ri(5, 45));
    nuevaCarpeta({ tipoId: uno(RULETA), fApertura: sumarDias(f, -ri(20, 50)), estado: 'Firmada',
      fFirmaEst: f, fFirmaReal: f, avance: 1, cobro: quizas(0.7) ? 'cobrado' : 'pendiente', conFondos: quizas(0.4) });
  }

  /* ---- 3.h) Tres honorarios vencidos de cobro ---- */
  for (let i = 0; i < 3; i++) {
    const f = atras(ri(80, 160));
    nuevaCarpeta({ tipoId: uno(['cv-inmueble', 'sucesion', 'srl']), fApertura: sumarDias(f, -30),
      estado: 'Cerrada', fFirmaEst: f, fFirmaReal: f, fCierre: sumarDias(f, 20), avance: 1, cobro: 'vencido',
      obs: 'Honorario pendiente de cobro. Reclamado por teléfono.' });
  }

  /* ============== 4. FONDOS DE CLIENTES ============== */
  /* Diez carpetas con plata del cliente en custodia: dos con saldo a devolver
     y una con saldo a reclamar (el estudio puso de más). */
  const conGastosFondos = Store0carpetasConFondos();
  function Store0carpetasConFondos() {
    const ids = unicos(D.gastos.filter(g => g.pagadoCon === 'fondos').map(g => g.carpetaId));
    return ids.slice(0, 40);
  }
  const elegidas = [];
  conGastosFondos.forEach(id => {
    const c = D.carpetas.find(x => x.id === id);
    if (!c || elegidas.length >= 10) return;
    if (!['Firmada', 'En inscripción', 'Lista para firmar', 'En preparación', 'Cerrada'].includes(c.estado)) return;
    elegidas.push(c);
  });
  elegidas.forEach((c, i) => {
    const aplicado = suma(D.gastos.filter(g => g.carpetaId === c.id && g.pagadoCon === 'fondos'), g => g.monto);
    let recibido = redondo(aplicado * 1.05, 500) || 15000;
    if (i === 0) recibido = redondo(aplicado + ri(9000, 24000), 500);     // a devolver
    if (i === 1) recibido = redondo(aplicado + ri(5000, 12000), 500);     // a devolver
    if (i === 2) recibido = redondo(aplicado - ri(4000, 9000), 500);      // a reclamar
    const haciaLaFirma = c.fFirmaReal || c.fFirmaEst || hoy;
    D.fondos.push({ id: uid('fon'), carpetaId: c.id, fecha: entre(c.fApertura, haciaLaFirma > hoy ? hoy : haciaLaFirma),
      monto: Math.max(2000, recibido), medio: uno(['Transferencia', 'Efectivo', 'Transferencia']),
      tipo: 'Recibido', nota: 'Para gastos de la carpeta' });
    if (i >= 3 && quizas(0.4) && c.estado === 'Cerrada') {
      const sobra = Math.max(0, recibido - aplicado);
      if (sobra > 500) D.fondos.push({ id: uid('fon'), carpetaId: c.id, fecha: sumarDias(c.fCierre || hoy, 3),
        monto: sobra, medio: 'Transferencia', tipo: 'Devuelto', nota: 'Devolución del saldo al cliente' });
    }
  });

  /* ============== 5. PROTOCOLO ============== */
  const firmadas = ordenar(D.carpetas.filter(c => c.fFirmaReal && !['cert-firmas', 'consulta'].includes(c.tipoId)), c => c.fFirmaReal);
  const porAnio = {};
  let folio = {};
  firmadas.forEach(c => {
    const anio = +c.fFirmaReal.slice(0, 4);
    porAnio[anio] = (porAnio[anio] || 0) + 1;
    folio[anio] = folio[anio] || 1;
    const hojas = ri(2, 6);
    const t = Store0tipo(c.tipoId);
    const inscribible = (t.tram || []).some(x => /^Inscripción/.test(x));
    const insc = Store0inscripcion(c, inscribible);
    const e = {
      id: uid('esc'), anio, nro: porAnio[anio], fecha: c.fFirmaReal, acto: t.nombre,
      otorgantes: (c.partes || []).map(p => Datos0nombre(p.clienteId)).join(', '),
      carpetaId: c.id, folioDesde: folio[anio], folioHasta: folio[anio] + hojas - 1,
      inscripcion: insc, copias: [],
    };
    folio[anio] += hojas;
    if (inscribible && insc.fecha) {
      e.copias.push({ tipo: 'Primera copia', aQuien: Datos0nombre((c.partes[1] || c.partes[0]).clienteId), fecha: sumarDias(insc.fecha, ri(3, 20)) });
      if (quizas(0.18)) e.copias.push({ tipo: 'Segunda copia', aQuien: 'Banco / organismo', fecha: sumarDias(insc.fecha, ri(25, 90)) });
    }
    D.escrituras.push(e);
    c.escrituraNro = `${e.nro}/${anio}`;
  });
  function Store0inscripcion(c, inscribible) {
    if (!inscribible) return { registro: '', fecha: null, nro: '' };
    if (c.estado === 'En inscripción') return { registro: 'Registro de la Propiedad — Inmobiliaria', fecha: null, nro: '' };
    return { registro: 'Registro de la Propiedad — Inmobiliaria',
      fecha: sumarDias(c.fFirmaReal, ri(8, 28)), nro: `${ri(1000, 9999)}/${c.fFirmaReal.slice(0, 4)}` };
  }

  /* ============== 6. CERTIFICACIONES DE FIRMAS ============== */
  for (let i = 1; i <= 82; i++) {
    const f = entre(`${HOY().getFullYear()}-01-05`, hoy);
    const n = ri(1, 3);
    D.certificaciones.push({
      id: uid('cer'), nro: i, fecha: f,
      firmantes: Array.from({ length: n }, () => { const c = uno(fisicas); return { nombre: c.nombre, ci: c.ci }; }),
      documento: uno(['Contrato de arrendamiento', 'Cesión de derechos', 'Carta poder', 'Declaración jurada',
        'Formulario BPS', 'Contrato de compraventa de vehículo', 'Autorización de viaje de menor',
        'Solicitud bancaria', 'Rescisión de contrato']),
      hojas: ri(1, 6), carpetaId: null, honorario: redondo(1800 + n * 900 + ri(0, 1200), 100),
    });
  }
  D.certificaciones = ordenar(D.certificaciones, c => c.fecha).map((c, i) => Object.assign(c, { nro: i + 1 }));
  /* Las certificaciones también son ingreso del estudio */
  D.certificaciones.forEach(c => {
    const cobrado = diasHasta(c.fecha) < -2 || quizas(0.8);
    D.movimientos.push({ id: uid('mov'), clase: 'ingreso', fecha: c.fecha, carpetaId: null,
      clienteId: null, tipoAsunto: 'Certificación de firmas',
      concepto: `Certificación de firmas N° ${c.nro} — ${c.documento}`,
      monto: redondo(c.honorario * 1.22, 10), moneda: '$', tc: null, iva: CONFIG_INICIAL.iva,
      medio: cobrado ? uno(['Efectivo', 'Efectivo', 'Transferencia', 'Débito']) : '',
      estado: cobrado ? 'Cobrado' : 'Pendiente', fEfectiva: cobrado ? c.fecha : null,
      fEstimada: cobrado ? null : adelante(ri(3, 15)) });
  });

  /* ============== 7. AGENDA ============== */
  const LUGARES = ['Estudio', 'Estudio', 'Estudio', 'Banco República', 'Banco Santander',
    'Domicilio del cliente', 'Registro de la Propiedad', 'Escribanía (sala de firmas)'];
  /* Firmas de las carpetas que tienen fecha cerca de hoy */
  D.carpetas.forEach(c => {
    const f = c.fFirmaReal || c.fFirmaEst;
    if (!f) return;
    const d = diasHasta(f);
    if (d < -35 || d > 30) return;
    D.eventos.push({
      id: uid('eve'), fecha: f, hora: `${String(ri(9, 17)).padStart(2, '0')}:${uno(['00', '30'])}`,
      duracion: ri(30, 90), tipo: 'Firma de escritura', carpetaId: c.id,
      lugar: uno(LUGARES),
      estado: c.fFirmaReal ? 'Realizada' : (d <= 7 ? uno(['Confirmada', 'Confirmada', 'Pendiente']) : 'Pendiente'),
      nota: '',
    });
  });
  /* Reuniones, lecturas y visitas al registro */
  const OTROS = ['Reunión con cliente', 'Lectura de testamento', 'Visita al Registro',
    'Reunión con el banco', 'Entrega de documentación', 'Consulta'];
  for (let i = 0; i < 26; i++) {
    const f = entre(atras(20), adelante(21));
    const activas = D.carpetas.filter(c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado));
    const c = quizas(0.7) ? uno(activas) : null;
    D.eventos.push({
      id: uid('eve'), fecha: f, hora: `${String(ri(9, 18)).padStart(2, '0')}:${uno(['00', '15', '30', '45'])}`,
      duracion: ri(20, 60), tipo: uno(OTROS), carpetaId: c ? c.id : null, lugar: uno(LUGARES),
      estado: diasHasta(f) < 0 ? uno(['Realizada', 'Realizada', 'Realizada', 'Reprogramada', 'Cancelada'])
        : uno(['Pendiente', 'Confirmada', 'Confirmada']),
      nota: quizas(0.3) ? 'Traer la documentación completa.' : '',
    });
  }

  /* ============== 8. EGRESOS DEL ESTUDIO (24 meses) ============== */
  const meses = [];
  const mesesDesde2023 = (HOY().getFullYear() - 2023) * 12 + HOY().getMonth();
  for (let i = mesesDesde2023; i >= 0; i--) { const d = new Date(HOY().getFullYear(), HOY().getMonth() - i, 1); meses.push(iso(d).slice(0, 7)); }
  const egreso = (k, categoria, monto, dia, estado, fVence) => {
    const f = `${k}-${String(dia).padStart(2, '0')}`;
    if (f > hoy && estado !== 'Pendiente') return;
    D.movimientos.push({
      id: uid('mov'), clase: 'egreso', fecha: f, categoria,
      proveedor: PROVEEDORES[categoria] || 'Varios',
      concepto: `${categoria} — ${mesNombre(k)}`,
      monto: redondo(monto, 10), moneda: '$', tc: null, iva: 0,
      medio: estado === 'Pagado' ? uno(['Transferencia', 'Transferencia', 'Débito', 'Efectivo']) : '',
      estado, fEfectiva: estado === 'Pagado' ? f : null, fVence: fVence || `${k}-${String(Math.min(28, dia + 8)).padStart(2, '0')}`,
    });
  };
  meses.forEach((k, idx) => {
    const ultimo = idx === meses.length - 1;
    const inflacion = 1 + idx * 0.006;
    const pagado = () => ultimo && quizas(0.35) ? 'Pendiente' : 'Pagado';
    /* Caja Notarial: % sobre los honorarios facturados del mes */
    const honMes = suma(D.movimientos.filter(m => m.clase === 'ingreso' && clave(m.fecha) === k),
      m => aPesos(m.monto, m.moneda, m.tc) / 1.22);
    egreso(k, 'Caja Notarial', Math.max(9000, honMes * CONFIG_INICIAL.cajaNotarial / 100), 12, pagado());
    egreso(k, 'BPS / DGI del estudio', Math.max(7000, honMes * 0.06) * inflacion, 20, pagado());
    egreso(k, 'Alquiler', 24000 * inflacion, 5, pagado());
    egreso(k, 'Sueldos', 42000 * inflacion, 28, pagado());
    egreso(k, 'Servicios públicos', (6000 + ri(0, 2400)) * inflacion, 15, pagado());
    egreso(k, 'Suscripciones y sistemas', 2400, 8, pagado());
    egreso(k, 'Papel notarial y timbres', ri(3500, 11000), ri(3, 24), pagado());
    egreso(k, 'Limpieza', 5600 * inflacion, 2, pagado());
    if (quizas(0.7)) egreso(k, 'Movilidad', ri(2200, 7800), ri(4, 26), pagado());
    if (quizas(0.45)) egreso(k, 'Marketing', ri(3000, 14000), ri(6, 22), pagado());
    if (quizas(0.5)) egreso(k, 'Certificados pagados por el estudio', ri(1800, 9000), ri(5, 25), pagado());
    if (quizas(0.25)) egreso(k, 'Otros', ri(2500, 18000), ri(8, 26), pagado());
    /* Dos meses ajustados (mucho gasto y poco cobro), para que el flujo lo muestre */
    if (idx === meses.length - 18 || idx === meses.length - 9) {
      egreso(k, 'Otros', ri(55000, 85000), 18, 'Pagado');
      D.movimientos.filter(m => m.clase === 'ingreso' && clave(m.fEfectiva || '') === k).slice(0, 4)
        .forEach(m => { m.estado = 'Cobrado'; m.fEfectiva = sumarDias(m.fEfectiva, 38); });
    }
  });
  /* Un par de egresos pendientes que vencen esta semana */
  ['Caja Notarial', 'BPS / DGI del estudio', 'Alquiler'].forEach((cat, i) => {
    D.movimientos.push({ id: uid('mov'), clase: 'egreso', fecha: hoy, categoria: cat,
      proveedor: PROVEEDORES[cat], concepto: `${cat} — ${mesNombre(clave(hoy))}`,
      monto: redondo([34800, 18600, 33500][i], 10), moneda: '$', tc: null, iva: 0, medio: '',
      estado: 'Pendiente', fEfectiva: null, fVence: adelante(i + 2) });
  });

  /* ============== 9. REGISTRO DE ACTIVIDAD ============== */
  ordenar(D.carpetas.filter(c => (c.hitos || []).length), c => c.fApertura, true).slice(0, 60).forEach(c => {
    const h = c.hitos[c.hitos.length - 1];
    D.actividad.push({ id: uid('act'), fecha: h.fecha, texto: `${c.nro} · ${h.texto}`, carpetaId: c.id });
  });
  D.actividad = ordenar(D.actividad, a => a.fecha, true).slice(0, 80);

  /* Última fecha de certificado de cada bien (para la ficha del bien) */
  D.bienes.forEach(b => {
    const cs = D.carpetas.filter(c => c.bienId === b.id).map(c => c.id);
    const ts = D.tramites.filter(t => cs.includes(t.carpetaId) && t.fObtencion && /Certificado registral/.test(t.tipo));
    b.ultimoCert = ts.length ? ordenar(ts, t => t.fObtencion, true)[0].fObtencion : null;
  });

  return D;
}

let VISTA_EXTRA = null;

/* ---------- Búsqueda general ---------- */
function buscarTodo(txt) {
  txt = (txt || '').trim();
  if (txt.length < 2) return aviso('Escribí al menos dos letras para buscar');

  const carpetas = Store.listar('carpetas', c =>
    contiene(c.nro, txt) || contiene(c.caratula, txt) ||
    contiene(Datos.partesTexto(c), txt) ||
    (c.bienId && contiene(Datos.nombreBien(c.bienId), txt))).slice(0, 12);

  const clientes = Store.listar('clientes', c =>
    contiene(c.nombre || c.razon, txt) || contiene(c.ci || '', txt) || contiene(c.rut || '', txt)).slice(0, 12);

  const bienes = Store.listar('bienes', b =>
    contiene(b.padron || '', txt) || contiene(b.matricula || '', txt) ||
    contiene(b.direccion || '', txt) || contiene(`${b.marca || ''} ${b.modelo || ''}`, txt)).slice(0, 12);

  const escrituras = Store.listar('escrituras', e =>
    contiene(e.otorgantes, txt) || contiene(`${e.nro}/${e.anio}`, txt) || contiene(e.acto, txt)).slice(0, 8);

  const total = carpetas.length + clientes.length + bienes.length + escrituras.length;
  const bloque = (titulo, lista, pintar) => lista.length ? `<h4 class="f-sep">${titulo}</h4>
    <div class="avisos">${lista.map(pintar).join('')}</div>` : '';

  const m = modal({
    titulo: `Resultados de "${txt}"`,
    ancho: 'ancho',
    cuerpo: total ? `
      ${bloque('Carpetas', carpetas, c => `<div class="aviso" data-b="carpeta" data-id="${c.id}">
        <span class="luz ${Reglas.luzCarpeta(c)}"></span><div class="tx"><b>${esc(c.caratula)}</b>
        <span>Carpeta ${c.nro} · ${esc(Store.tipo(c.tipoId).nombre)}</span></div>
        <div class="der">${chip(c.estado)}</div></div>`)}
      ${bloque('Clientes', clientes, c => `<div class="aviso" data-b="cliente" data-id="${c.id}">
        <div class="tx"><b>${esc(c.nombre || c.razon)}</b><span>${esc(Datos.docCliente(c.id))} · ${esc(c.tel || 'sin teléfono')}</span></div></div>`)}
      ${bloque('Bienes', bienes, b => `<div class="aviso" data-b="bien" data-id="${b.id}">
        <div class="tx"><b>${esc(Datos.nombreBien(b.id))}</b><span>${esc(b.direccion || b.marca + ' ' + b.modelo)} · ${esc(b.localidad || b.depto)}</span></div></div>`)}
      ${bloque('Protocolo', escrituras, e => `<div class="aviso" data-b="escritura" data-id="${e.id}">
        <div class="tx"><b>Escritura ${e.nro}/${e.anio} · ${esc(e.acto)}</b><span>${esc(e.otorgantes)}</span></div>
        <div class="der">${fecha(e.fecha)}</div></div>`)}`
      : `<div class="vacio"><b>Sin resultados</b>Probá con el número de carpeta, un apellido, un padrón o una matrícula.</div>`,
  });

  $$('.aviso', m.fondo).forEach(a => a.onclick = () => {
    m.cerrar();
    $('#buscar-todo').value = '';
    const { b, id } = a.dataset;
    if (b === 'carpeta') abrirCarpeta(id);
    if (b === 'cliente') abrirCliente(id);
    if (b === 'bien') abrirBien(id);
    if (b === 'escritura') { irA('protocolo'); setTimeout(() => verEscritura(id), 80); }
  });
}

/* Piezas que usan todas las secciones */
function tarjeta({ titulo, extraTitulo = '', acciones = '', cuerpo, sinAire = false, clase = '' }) {
  return `<section class="tarjeta ${clase}">
    <header><h3>${esc(titulo)}${extraTitulo}</h3><div class="btn-fila no-imprimir">${acciones}</div></header>
    <div class="cuerpo ${sinAire ? 'sin-aire' : ''}">${cuerpo}</div></section>`;
}
function vacio(txt, sub = '') { return `<div class="vacio"><b>${esc(txt)}</b>${esc(sub)}</div>`; }
function numero_(i, b, s, clase = '', ir = '') {
  return `<div class="num ${clase} ${ir ? 'clic' : ''}" ${ir ? `data-panel-ir="${ir}"` : ''}>
    <i>${esc(i)}</i><b>${b}</b>${s ? `<small>${s}</small>` : ''}</div>`;
}

VISTAS.panel = function (cont) {
  const hoy = iso(HOY());
  const cfg = Store.cfg();

  /* ---- Firmas ---- */
  const firmasHoy = Store.listar('eventos', e => e.fecha === hoy && e.tipo === 'Firma de escritura');
  const firmasSemana = ordenar(Store.listar('eventos', e =>
    e.tipo === 'Firma de escritura' && diasHasta(e.fecha) >= 0 && diasHasta(e.fecha) <= 7 &&
    !['Cancelada', 'Realizada'].includes(e.estado)), e => e.fecha + e.hora);

  /* ---- Vencimientos ---- */
  const plazos = [];
  Store.listar('carpetas', c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado))
    .forEach(c => Reglas.plazos(c).forEach(p => plazos.push(Object.assign({ carpeta: c }, p))));
  const vencidos = plazos.filter(p => p.dias < 0);
  const vencenHoy = plazos.filter(p => p.dias === 0);
  const vencen7 = plazos.filter(p => p.dias > 0 && p.dias <= cfg.avisoPrevio);

  /* ---- Plata ---- */
  const porCobrar = Fin.porCobrar();
  const vencidosCobro = porCobrar.filter(m => m.estadoReal === 'Vencido');
  const egresosSemana = Fin.porPagar().filter(m => m.dias !== null && m.dias <= 7);
  const saldo = Fin.saldoCaja();

/* ============================================================
   MODO REGISTRO
   Pensado para el celular, parada en el Registro: letra grande y
   solo lo que hay que presentar o retirar hoy.
   ============================================================ */
function modoRegistro() {
  const pend = Reglas.tramitesConPlazo(t => ['A solicitar', 'Solicitado', 'Obtenido'].includes(t.estado))
    .filter(t => {
      const c = Datos.carpeta(t.carpetaId);
      return c && !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado) &&
        /Registro|Catastro/.test(t.organismo);
    });
  const lista = ordenar(pend, t => (t.vence || '9999') + t.tipo).slice(0, 25);

  modal({
    titulo: 'Modo registro · para llevar en el celular',
    ancho: 'ancho',
    cuerpo: `<div class="nota" style="margin-bottom:14px">Lo que hay que <b>presentar o retirar</b> en los
      registros, con el padrón y la matrícula a la vista. Tocá un trámite para marcarlo.</div>
      <div class="registro-modo">${lista.length ? lista.map(t => {
        const c = Datos.carpeta(t.carpetaId);
        const b = c.bienId ? Datos.bien(c.bienId) : null;
        return `<div class="rm" data-tram="${t.id}">
          <b>${esc(t.tipo)}</b>
          ${b ? `<div class="dato">${b.clase === 'inmueble' ? `Padrón ${b.padron} · Matrícula ${b.matricula}` : `Matrícula ${b.matricula} · Padrón ${b.padron}`}</div>` : ''}
          <div class="sub">${esc(c.caratula)}</div>
          <div class="sub">Carpeta ${c.nro} · ${esc(t.organismo)} · ${chip(t.estadoReal)}
            ${t.vence ? ` · <b class="t-${t.luz}">${t.estado === 'Obtenido' ? 'vence' : 'plazo'} ${enPalabras(t.vence)}</b>` : ''}</div>
        </div>`;
      }).join('') : vacio('No hay trámites pendientes en los registros')}</div>`,
    acciones: [{ texto: 'Cerrar', clase: 's' }],
  });
  $$('[data-tram]').forEach(d => d.onclick = () => editarTramite(d.dataset.tram));
}


/* ===== js/10-agenda.js ===== */
/* ============================================================
   AGENDA Y PLAZOS
   Lo agendado a mano (firmas, reuniones, visitas) y los vencimientos
   que la página calcula sola, todo en el mismo calendario.
   ============================================================ */

let agVista = 'semana';
let agFecha = iso(HOY());

/* Los vencimientos convertidos en "cosas del día" */
function plazosDelPeriodo(desde, hasta) {
  const l = [];
  Store.listar('carpetas', c => !['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado))
    .forEach(c => Reglas.plazos(c).forEach(p => {
      if (p.fecha >= desde && p.fecha <= hasta) l.push({ plazo: true, carpeta: c, fecha: p.fecha, texto: p.texto, luz: p.luz });
    }));
  return l;
}

function eventosDelPeriodo(desde, hasta) {
  const ev = Store.listar('eventos', e => e.fecha >= desde && e.fecha <= hasta)
    .map(e => Object.assign({}, e, { carpeta: e.carpetaId ? Datos.carpeta(e.carpetaId) : null }));
  return ordenar([...ev, ...plazosDelPeriodo(desde, hasta)], x => x.fecha + (x.hora || '23:59'));
}

VISTAS.agenda = function (cont) {
  const hoy = iso(HOY());
  const d = aDate(agFecha);
  let desde, hasta, titulo;

  if (agVista === 'dia') {
    desde = hasta = agFecha;
    titulo = conMayuscula(`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`);
  } else if (agVista === 'semana') {
    const l = new Date(d); l.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    desde = iso(l); hasta = sumarDias(desde, 6);
    titulo = `Semana del ${fecha(desde)} al ${fecha(hasta)}`;
  } else {
    desde = clave(agFecha) + '-01'; hasta = ultimoDia(clave(agFecha));
    titulo = conMayuscula(mesNombre(clave(agFecha)));
  }

  const items = eventosDelPeriodo(desde, hasta);

  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Agenda y plazos</h2>
    <p>Las firmas y reuniones que cargás, más los vencimientos de certificados,
       ITP, inscripciones y reservas de prioridad, que salen solos de cada carpeta.</p>
  </div><div class="btn-fila">
    <button class="btn" data-hoy>Hoy</button>
    <button class="btn p" data-nuevo-evento>+ Agendar</button>
  </div></div>

  <div class="solapas">
    ${['dia', 'semana', 'mes'].map(v => `<button class="${agVista === v ? 'on' : ''}" data-vista="${v}">
      ${v === 'dia' ? 'Día' : v === 'semana' ? 'Semana' : 'Mes'}</button>`).join('')}
  </div>

  <div class="ag-cab">
    <div class="btn-fila">
      <button class="btn icono" data-mover="-1" aria-label="Anterior">‹</button>
      <button class="btn icono" data-mover="1" aria-label="Siguiente">›</button>
      <h3>${esc(titulo)}</h3>
    </div>
    <div class="graf-leyenda">
      <span><i style="background:#EEDDE1"></i>Firma</span>
      <span><i style="background:var(--dorado-suave)"></i>Reunión o visita</span>
      <span><i style="background:var(--terracota-f)"></i>Vencimiento</span>
    </div>
  </div>

  ${agVista === 'mes' ? pintarMes(clave(agFecha), items) : pintarLista(desde, hasta, items)}`;

  $$('[data-vista]', cont).forEach(b => b.onclick = () => { agVista = b.dataset.vista; repintar(); });
  $('[data-hoy]', cont).onclick = () => { agFecha = hoy; repintar(); };
  $$('[data-mover]', cont).forEach(b => b.onclick = () => {
    const n = +b.dataset.mover;
    agFecha = agVista === 'mes' ? sumarMeses(agFecha, n) : sumarDias(agFecha, agVista === 'dia' ? n : n * 7);
    repintar();
  });
  $('[data-nuevo-evento]', cont).onclick = () => formEvento();
  $$('[data-evento]', cont).forEach(b => b.onclick = () => verEvento(b.dataset.evento));
  $$('[data-ir-carpeta]', cont).forEach(b => b.onclick = e => { e.stopPropagation(); abrirCarpeta(b.dataset.irCarpeta); });
  $$('[data-dia]', cont).forEach(b => b.onclick = () => { agFecha = b.dataset.dia; agVista = 'dia'; repintar(); });
};

function pintarMes(k, items) {
  const primero = aDate(primerDia(k));
  const arranque = new Date(primero); arranque.setDate(1 - ((primero.getDay() + 6) % 7));
  const porDia = agrupar(items, x => x.fecha);
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const f = iso(sumarDias(iso(arranque), i));
    const dd = aDate(f);
    const fuera = clave(f) !== k;
    const lista = porDia[f] || [];
    celdas += `<div class="ag-d ${fuera ? 'fuera' : ''} ${f === iso(HOY()) ? 'hoy' : ''}" data-dia="${f}">
      <div class="dn">${dd.getDate()}</div>
      ${lista.slice(0, 3).map(x => `<span class="ag-pt ${x.plazo ? x.luz : (x.tipo === 'Firma de escritura' ? 'firma' : '')}">
        ${x.plazo ? '⚑ ' : (x.hora ? x.hora + ' ' : '')}${esc((x.plazo ? x.texto : (x.carpeta ? Datos.partesTexto(x.carpeta, true) : x.tipo)))}</span>`).join('')}
      ${lista.length > 3 ? `<span class="ag-pt">+${lista.length - 3} más</span>` : ''}</div>`;
  }
  return `<div class="ag-mes">${DIAS_C.slice(1).concat(DIAS_C[0]).map(d => `<div class="ag-dw">${d}</div>`).join('')}${celdas}</div>`;
}

function pintarLista(desde, hasta, items) {
  const dias = [];
  for (let f = desde; f <= hasta; f = sumarDias(f, 1)) dias.push(f);
  const porDia = agrupar(items, x => x.fecha);
  return dias.map(f => {
    const lista = porDia[f] || [];
    const d = aDate(f);
    return `<section class="tarjeta" style="margin-bottom:12px">
      <header><h3>${conMayuscula(DIAS[d.getDay()])} ${d.getDate()} de ${MESES[d.getMonth()]}${f === iso(HOY()) ? ' · hoy' : ''}</h3>
        <span class="pild">${lista.length ? lista.length + ' cosa(s)' : 'libre'}</span></header>
      <div class="cuerpo sin-aire">${lista.length ? lista.map(x => x.plazo ? `
        <div class="ag-dia" data-ir-carpeta="${x.carpeta.id}" style="cursor:pointer">
          <div class="hr t-${x.luz}">⚑</div>
          <div class="cu"><b>${esc(x.texto)}</b>
            <span>${esc(x.carpeta.caratula)} · carpeta ${x.carpeta.nro}</span></div>
          <div class="der">${chip(x.luz === 'vencido' ? 'Vencido' : 'Pendiente')}</div>
        </div>` : `
        <div class="ag-dia" data-evento="${x.id}" style="cursor:pointer">
          <div class="hr">${x.hora}</div>
          <div class="cu"><b>${esc(x.tipo)}${x.carpeta ? ' · ' + esc(x.carpeta.caratula) : ''}</b>
            <span>${esc(x.lugar)} · ${x.duracion} min${x.carpeta ? ' · carpeta ' + x.carpeta.nro : ''}
              ${x.nota ? ' · ' + esc(x.nota) : ''}</span></div>
          <div class="der">${chip(x.estado)}</div>
        </div>`).join('') : vacio('Nada agendado')}</div></section>`;
  }).join('');
}

/* ---------- Ver / editar un evento ---------- */
function verEvento(id) {
  const e = Store.obtener('eventos', id);
  if (!e) return;
  const c = e.carpetaId ? Datos.carpeta(e.carpetaId) : null;
  const esFirma = e.tipo === 'Firma de escritura';
  const falta = c ? Reglas.faltaParaFirmar(c) : [];

  const m = modal({
    titulo: `${e.tipo} · ${fecha(e.fecha)} ${e.hora}`,
    cuerpo: `
      <div class="datos">
        <div class="d"><i>Fecha y hora</i><b>${fecha(e.fecha)} a las ${e.hora} (${e.duracion} min)</b></div>
        <div class="d"><i>Lugar</i><b>${esc(e.lugar)}</b></div>
        <div class="d"><i>Estado</i><b>${chip(e.estado)}</b></div>
        <div class="d"><i>Carpeta</i><b>${c ? esc(c.nro + ' · ' + c.caratula) : '—'}</b></div>
        ${c ? `<div class="d ancho-2"><i>Partes</i><b>${esc(Datos.partesTexto(c))}</b></div>` : ''}
        ${e.nota ? `<div class="d ancho-2"><i>Nota</i><b>${esc(e.nota)}</b></div>` : ''}
      </div>
      ${esFirma && c ? (falta.length ? `<div class="falta"><div class="falta-t">Antes de firmar falta</div>
        <div class="falta-l">${falta.map(f => `<span class="it ${f.tipo}">${esc(f.texto)}</span>`).join('')}</div></div>`
        : `<div class="falta listo"><div class="falta-t">✓ La carpeta está completa para firmar</div></div>`) : ''}`,
    acciones: [
      ...(c ? [{ texto: 'Abrir la carpeta', hacer: () => { abrirCarpeta(c.id); } }] : []),
      ...(esFirma && c ? [{ texto: 'Recordar por WhatsApp', hacer: () => { recordarFirma(e.id); return false; } }] : []),
      ...(esFirma && c && !c.fFirmaReal ? [{ texto: 'Marcar como firmada', clase: 'p', hacer: () => { marcarFirmada(e.id); } }] : []),
      { texto: 'Editar', hacer: () => { formEvento(e.id); } },
    ],
  });
  return m;
}

/* ---------- Agendar o editar ---------- */
function formEvento(id, carpetaId) {
  const e = id ? Store.obtener('eventos', id) : null;
  const activas = Store.listar('carpetas', c => !['Archivada', 'Cancelada'].includes(c.estado));
  const campos = [
    { n: 'tipo', e: 'Qué es', tipo: 'select', valor: e?.tipo || 'Firma de escritura',
      ops: ['Firma de escritura', 'Reunión con cliente', 'Lectura de testamento', 'Visita al Registro',
        'Reunión con el banco', 'Entrega de documentación', 'Consulta', 'Otro'] },
    { n: 'estado', e: 'Estado', tipo: 'select', valor: e?.estado || 'Pendiente', ops: ESTADOS_AGENDA },
    { n: 'fecha', e: 'Fecha', tipo: 'date', valor: e?.fecha || iso(HOY()), req: true },
    { n: 'hora', e: 'Hora', tipo: 'time', valor: e?.hora || '10:00', req: true },
    { n: 'duracion', e: 'Duración (minutos)', tipo: 'number', valor: e?.duracion || 45 },
    { n: 'lugar', e: 'Lugar', tipo: 'sugerido', valor: e?.lugar || 'Estudio',
      ops: ['Estudio', 'Domicilio del cliente', 'Banco República', 'Banco Santander', 'Registro de la Propiedad', 'Intendencia de Rivera'] },
    { n: 'carpeta', e: 'Carpeta vinculada', tipo: 'sugerido', ancho: 'ancho-2',
      valor: (() => { const c = Datos.carpeta(e?.carpetaId || carpetaId); return c ? `${c.nro} · ${c.caratula}` : ''; })(),
      ops: activas.map(c => `${c.nro} · ${c.caratula}`), ph: 'Escribí el número de carpeta o un apellido' },
    { n: 'nota', e: 'Nota', tipo: 'textarea', valor: e?.nota || '', ancho: 'ancho-2' },
  ];
  modal({
    titulo: id ? 'Editar lo agendado' : 'Agendar',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      ...(id ? [{ texto: 'Borrar', clase: 'mal', hacer: () => {
        if (!confirm('¿Borrar esto de la agenda?')) return false;
        Store.borrar('eventos', id); aviso('Borrado de la agenda'); repintar();
      } }] : []),
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Guardar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        const nro = (v.carpeta || '').split(' · ')[0];
        const c = Store.listar('carpetas', x => x.nro === nro)[0];
        const datos = { tipo: v.tipo, estado: v.estado, fecha: v.fecha, hora: v.hora,
          duracion: v.duracion || 45, lugar: v.lugar, carpetaId: c ? c.id : null, nota: v.nota };
        if (id) Store.editar('eventos', id, datos);
        else Store.crear('eventos', datos);
        if (c && v.tipo === 'Firma de escritura' && !c.fFirmaReal) {
          const avisos = Reglas.certificadosQueNoLlegan(c, v.fecha);
          Store.editar('carpetas', c.id, { fFirmaEst: v.fecha });
          Reglas.anotarHito(c.id, `Se agendó la firma para el ${fecha(v.fecha)}`, 'nota');
          if (avisos.length) setTimeout(() => modal({
            titulo: '⚠ Ojo con los certificados',
            cuerpo: `<div class="nota-legal"><div>Para el <b>${fecha(v.fecha)}</b> estos certificados
              ya no van a estar vigentes. Conviene pedirlos de nuevo:<br><br>
              ${avisos.map(a => '· ' + esc(a)).join('<br>')}</div></div>`,
            acciones: [{ texto: 'Entendido', clase: 'p' }],
          }), 200);
        }
        aviso(id ? 'Guardado' : 'Agendado');
        repintar();
      } },
    ],
  });
}

/* ---------- Recordatorio por WhatsApp ---------- */
function recordarFirma(eventoId) {
  const e = Store.obtener('eventos', eventoId);
  const c = e?.carpetaId ? Datos.carpeta(e.carpetaId) : null;
  if (!c) return aviso('Esta firma no tiene carpeta vinculada', 'mal');
  const partes = (c.partes || []).map(p => ({ p, cl: Datos.cliente(p.clienteId) })).filter(x => x.cl);
  modal({
    titulo: 'Recordar la firma por WhatsApp',
    cuerpo: `<div class="nota" style="margin-bottom:12px">Se abre WhatsApp con el mensaje ya escrito.
      <b>Vos apretás enviar.</b> El texto se edita en Configuración.</div>
      <div class="avisos">${partes.map(x => `<div class="aviso" data-wa="${x.cl.id}">
        <div class="tx"><b>${esc(x.cl.nombre || x.cl.razon)}</b>
          <span>${esc(x.p.rol)} · ${esc(x.cl.tel || 'sin teléfono')}</span></div>
        <div class="der">${x.cl.tel ? 'Enviar →' : '—'}</div></div>`).join('')}</div>`,
    acciones: [{ texto: 'Cerrar', clase: 's' }],
  });
  $$('[data-wa]').forEach(b => b.onclick = () => {
    const cl = Datos.cliente(b.dataset.wa);
    whatsapp(cl.tel, plantilla(Store.cfg().waFirma, {
      nombre: (cl.nombre || cl.razon).split(' ')[0],
      asunto: Store.tipo(c.tipoId).nombre.toLowerCase(),
      fecha: fecha(e.fecha), hora: e.hora, lugar: e.lugar,
    }));
  });
}

/* ---------- Marcar una firma como realizada ---------- */
function marcarFirmada(eventoId) {
  const e = Store.obtener('eventos', eventoId);
  const c = Datos.carpeta(e.carpetaId);
  if (!c) return;
  const prox = Reglas.proximaEscritura();
  const t = Store.tipo(c.tipoId);
  const esProtocolo = !['cert-firmas', 'consulta'].includes(c.tipoId);
  const campos = [
    { n: 'fecha', e: 'Fecha de la firma', tipo: 'date', valor: e.fecha, req: true },
    ...(esProtocolo ? [
      { n: 'nro', e: 'N° de escritura', tipo: 'number', valor: prox.nro, req: true },
      { n: 'folioDesde', e: 'Folio desde', tipo: 'number', valor: null },
      { n: 'folioHasta', e: 'Folio hasta', tipo: 'number', valor: null },
    ] : []),
  ];
  modal({
    titulo: 'Marcar como firmada',
    cuerpo: `<div class="nota" style="margin-bottom:14px">La carpeta pasa a <b>Firmada</b>
      ${esProtocolo ? `y la escritura se anota en el protocolo ${prox.anio}.` : '.'}
      Desde ahí empiezan a correr el plazo del ITP (${Store.cfg().plazoITP} días) y el de
      inscripción (${Store.cfg().plazoInscripcion} días).</div>
      <div class="rejilla">${formulario(campos)}</div>`,
    acciones: [
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Confirmar', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        Store.editar('eventos', e.id, { estado: 'Realizada', fecha: v.fecha });
        Store.editar('carpetas', c.id, { estado: 'Firmada', fFirmaReal: v.fecha });
        if (esProtocolo) {
          Store.crear('escrituras', {
            anio: +v.fecha.slice(0, 4), nro: v.nro, fecha: v.fecha, acto: t.nombre,
            otorgantes: (c.partes || []).map(p => Datos.nombreCliente(p.clienteId)).join(', '),
            carpetaId: c.id, folioDesde: v.folioDesde, folioHasta: v.folioHasta,
            inscripcion: { registro: '', fecha: null, nro: '' }, copias: [],
          });
          Store.editar('carpetas', c.id, { escrituraNro: `${v.nro}/${v.fecha.slice(0, 4)}` });
        }
        Reglas.anotarHito(c.id, 'Se firmó la escritura', 'firma', v.fecha);
        aviso('Firmada y anotada en el protocolo');
        irA('carpetas'); abrirCarpeta(c.id);
      } },
    ],
  });
}

/* ============================================================
   CARPETAS · la lista y el alta
   (la ficha de cada carpeta está en 12-carpeta-ficha.js)
   ============================================================ */

let carpetaAbierta = null;
let filtrosCarp = { texto: '', tipo: '', estado: '', escribana: '', mes: '' };

function abrirCarpeta(id) {
  carpetaAbierta = id;
  VISTA_EXTRA = id;
  irA('carpetas', id);
}
function cerrarCarpeta() { carpetaAbierta = null; VISTA_EXTRA = null; irA('carpetas'); }

VISTAS.carpetas = function (cont, extra) {
  if (extra && typeof extra === 'object' && extra.estado) { filtrosCarp.estado = extra.estado; carpetaAbierta = null; }
  if (typeof extra === 'string') carpetaAbierta = extra;
  if (carpetaAbierta && Datos.carpeta(carpetaAbierta)) return pintarFichaCarpeta(cont, carpetaAbierta);
  carpetaAbierta = null;

  const f = filtrosCarp;
  let lista = Store.listar('carpetas');
  if (f.estado) lista = lista.filter(c => c.estado === f.estado);
  if (f.tipo) lista = lista.filter(c => c.tipoId === f.tipo);
  if (f.escribana) lista = lista.filter(c => c.escribana === f.escribana);
  if (f.mes) lista = lista.filter(c => clave(c.fApertura) === f.mes);
  if (f.texto) lista = lista.filter(c => contiene(c.nro, f.texto) || contiene(c.caratula, f.texto) ||
    contiene(Datos.partesTexto(c), f.texto) || (c.bienId && contiene(Datos.nombreBien(c.bienId), f.texto)));

  /* Primero las que piden atención: vencidas, después por fecha de firma */
  const orden = { vencido: 0, pronto: 1, ok: 2 };
  lista = lista.map(c => Object.assign({}, c, { luz: Reglas.luzCarpeta(c), av: Reglas.avance(c) }));
  lista.sort((a, b) => {
    const act = c => ['Cerrada', 'Archivada', 'Cancelada'].includes(c.estado) ? 1 : 0;
    return act(a) - act(b) || orden[a.luz] - orden[b.luz] ||
      String(b.fFirmaEst || b.fApertura).localeCompare(String(a.fFirmaEst || a.fApertura)) * -1 ||
      b.nro.localeCompare(a.nro);
  });

  const meses = unicos(Store.listar('carpetas').map(c => clave(c.fApertura))).reverse();

  cont.innerHTML = `
  <div class="enc"><div class="izq">
    <h2>Carpetas</h2>
    <p>Una carpeta por asunto, con sus partes, su bien, su checklist, sus plazos y su cuenta.
       Las que tienen algo vencido o por vencer aparecen primero.</p>
  </div><div class="btn-fila">
    <button class="btn p" data-nueva>+ Nueva carpeta</button>
  </div></div>

  <div class="filtros">
    <input type="search" class="crece" id="fc-texto" placeholder="N° de carpeta, carátula, parte, padrón o matrícula…" value="${esc(f.texto)}">
    <select id="fc-estado"><option value="">Todos los estados</option>
      ${ESTADOS_CARPETA.map(e => `<option ${f.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select>
    <select id="fc-tipo"><option value="">Todos los asuntos</option>
      ${Store.tipos().map(t => `<option value="${t.id}" ${f.tipo === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('')}</select>
    <select id="fc-escribana"><option value="">Las dos escribanas</option>
      ${unicos(Store.listar('carpetas').map(c => c.escribana)).map(e => `<option ${f.escribana === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
    <select id="fc-mes"><option value="">Cualquier mes de apertura</option>
      ${meses.map(m => `<option value="${m}" ${f.mes === m ? 'selected' : ''}>${mesNombre(m)}</option>`).join('')}</select>
    ${Object.values(f).some(Boolean) ? '<button class="btn chico" data-limpiar>Limpiar</button>' : ''}
    <span class="cuenta">${lista.length} carpeta(s)</span>
  </div>

  <section class="tarjeta"><div class="cuerpo sin-aire"><div class="tabla-marco">
  ${lista.length ? `<table class="t">
    <thead><tr>
      <th>Carpeta</th><th>Asunto</th><th>Estado</th><th>Avance</th>
      <th>Firma</th><th>Plazos</th><th class="n">Por cobrar</th>
    </tr></thead>
    <tbody>${lista.slice(0, 160).map(c => {
      const cu = Reglas.cuenta(c);
      return `<tr class="clic" data-ir="${c.id}">
        <td class="titulo"><b>${esc(c.caratula)}</b>
          <i style="display:block;font-style:normal;font-size:12px;color:var(--tinta3)">
            N° ${c.nro} · ${esc(Datos.partesTexto(c, true))}</i></td>
        <td class="mini">${esc(Store.tipo(c.tipoId).nombre)}</td>
        <td>${chip(c.estado)}</td>
        <td style="min-width:110px"><div class="avance ${c.av.pct === 100 ? 'verde' : ''}"><i style="width:${c.av.pct}%"></i></div>
          <span class="mini">${c.av.hechos}/${c.av.total}</span></td>
        <td class="mini">${c.fFirmaReal ? '✓ ' + fecha(c.fFirmaReal) : (c.fFirmaEst ? fecha(c.fFirmaEst) : '—')}</td>
        <td><span class="luz ${c.luz}"></span> <span class="mini">${c.luz === 'vencido' ? 'vencido' : c.luz === 'pronto' ? 'vence pronto' : 'al día'}</span></td>
        <td class="n">${cu.porCobrar > 0 ? `<b class="t-pronto">${pesos(cu.porCobrar)}</b>` : '<span class="mini">—</span>'}</td>
      </tr>`;
    }).join('')}</tbody></table>` : vacio('No hay carpetas con esos filtros', 'Probá quitando algún filtro.')}
  </div></div></section>`;

  const cambiar = (id, campo) => { const e = $('#' + id, cont); if (e) e.onchange = () => { filtrosCarp[campo] = e.value; repintar(); }; };
  cambiar('fc-estado', 'estado'); cambiar('fc-tipo', 'tipo'); cambiar('fc-escribana', 'escribana'); cambiar('fc-mes', 'mes');
  const t = $('#fc-texto', cont);
  let esperar;
  t.oninput = () => { clearTimeout(esperar); esperar = setTimeout(() => { filtrosCarp.texto = t.value; repintar(); $('#fc-texto')?.focus(); }, 320); };
  $('[data-limpiar]', cont)?.addEventListener('click', () => { filtrosCarp = { texto: '', tipo: '', estado: '', escribana: '', mes: '' }; repintar(); });
  $$('[data-ir]', cont).forEach(tr => tr.onclick = () => abrirCarpeta(tr.dataset.ir));
  $('[data-nueva]', cont).onclick = () => nuevaCarpetaForm();
};

/* ============================================================
   NUEVA CARPETA
   Al elegir el tipo de asunto se carga sola la checklist, el
   honorario sugerido y la fecha estimada de firma.
   ============================================================ */
function nuevaCarpetaForm() {
  const tipos = Store.tipos().filter(t => t.activo);
  const clientes = Store.listar('clientes');
  const bienes = Store.listar('bienes');
  const nombreCl = c => c.tipo === 'juridica' ? `${c.razon} · RUT ${c.rut}` : `${c.nombre} · CI ${c.ci}`;
  const nombreBi = b => b.clase === 'inmueble'
    ? `Padrón ${b.padron} · ${b.localidad} · ${b.direccion}` : `${b.matricula} · ${b.marca} ${b.modelo} ${b.anio}`;

  const campos = [
    { n: 'tipoId', e: 'Tipo de asunto', tipo: 'select', req: true, ancho: 'ancho-2',
      ops: CATEGORIAS_ASUNTO.flatMap(cat => tipos.filter(t => t.cat === cat).map(t => ({ v: t.id, t: `${cat} — ${t.nombre}` }))) },
    { n: 'nro', e: 'N° de carpeta', valor: Reglas.proximaCarpeta(), req: true },
    { n: 'escribana', e: 'Escribana responsable', tipo: 'select', ops: ESCRIBANAS_LISTA() },
    { n: 'parte1', e: 'Primera parte', tipo: 'sugerido', ancho: 'ancho-2', req: true,
      ops: clientes.map(nombreCl), ph: 'Escribí un apellido, CI o RUT' },
    { n: 'rol1', e: 'Rol de la primera parte', tipo: 'select', ops: ROLES_PARTE },
    { n: 'parte2', e: 'Segunda parte (si hay)', tipo: 'sugerido', ops: clientes.map(nombreCl) },
    { n: 'rol2', e: 'Rol de la segunda parte', tipo: 'select', ops: ['', ...ROLES_PARTE] },
    { n: 'bien', e: 'Bien vinculado (si hay)', tipo: 'sugerido', ancho: 'ancho-2',
      ops: bienes.map(nombreBi), ph: 'Padrón, matrícula o dirección' },
    { n: 'precio', e: 'Precio del negocio ($)', tipo: 'number', ayuda: 'Se usa para calcular el ITP y sugerir el honorario' },
    { n: 'fApertura', e: 'Fecha de apertura', tipo: 'date', valor: iso(HOY()), req: true },
    { n: 'fFirmaEst', e: 'Firma estimada', tipo: 'date', ayuda: 'Se propone sola según el tipo de asunto' },
    { n: 'honorario', e: 'Honorario ($, sin IVA)', tipo: 'number', ayuda: 'Se puede dejar vacío y pactarlo después' },
    { n: 'obs', e: 'Observaciones', tipo: 'textarea', ancho: 'ancho-2' },
  ];

  const m = modal({
    titulo: 'Nueva carpeta', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>
      <div id="nc-sug" class="nota hidden"></div>`,
    acciones: [
      { texto: 'Cancelar', clase: 's' },
      { texto: 'Crear la carpeta', clase: 'p', hacer: f => {
        const v = leerFormulario(campos, f);
        if (!v.tipoId || !v.parte1) { aviso('Falta el tipo de asunto o la primera parte', 'mal'); return false; }
        const buscarCl = txt => clientes.find(c => nombreCl(c) === txt) ||
          clientes.find(c => contiene(nombreCl(c), txt));
        const c1 = buscarCl(v.parte1);
        if (!c1) { aviso('No encontré a esa persona. Creala primero en Clientes.', 'mal'); return false; }
        const c2 = v.parte2 ? buscarCl(v.parte2) : null;
        const bien = v.bien ? (bienes.find(b => nombreBi(b) === v.bien) || bienes.find(b => contiene(nombreBi(b), v.bien))) : null;
        const partes = [{ clienteId: c1.id, rol: v.rol1 || 'Consultante' }];
        if (c2) partes.push({ clienteId: c2.id, rol: v.rol2 || 'Consultante' });
        const t = Store.tipo(v.tipoId);

        const nueva = Store.crear('carpetas', {
          nro: v.nro, tipoId: v.tipoId, partes, bienId: bien ? bien.id : null,
          escribana: v.escribana, fApertura: v.fApertura,
          fFirmaEst: v.fFirmaEst || (v.fApertura ? sumarDias(v.fApertura, t.plazoFirma) : null),
          fFirmaReal: null, fCierre: null, estado: 'En preparación',
          honorario: v.honorario || 0, moneda: '$', tc: null, precio: v.precio || 0,
          obs: v.obs, checklist: Reglas.checklistDe(v.tipoId), hitos: [],
          caratula: armarCaratula(v.tipoId, partes, bien),
        });
        Reglas.anotarHito(nueva.id, 'Se abrió la carpeta', 'apertura', v.fApertura);

        /* Los trámites de la checklist nacen como "a solicitar" */
        [...(t.cert || []), ...(t.tram || [])].forEach(nombre => {
          const def = TIPOS_TRAMITE.find(x => x.nombre === nombre) || { organismo: 'Otro', vigencia: 30, costo: 0 };
          Store.crear('tramites', { carpetaId: nueva.id, tipo: nombre, organismo: def.organismo,
            fSolicitud: null, fObtencion: null, vigencia: def.vigencia, costo: def.costo,
            pagadoPor: 'cliente', estado: 'A solicitar', obs: '' });
        });
        /* Y los documentos a pedir, como pendientes */
        (t.doc || []).forEach(nombre => {
          Store.crear('documentos', { carpetaId: nueva.id, nombre, tipo: 'Otro', original: /Título|Libreta|Partida|Estatuto/.test(nombre),
            recibidoDe: Datos.nombreCliente(c1.id), fRecepcion: null, estado: 'Pendiente',
            devuelto: false, fDevolucion: null, ubicacion: '', nota: '' });
        });
        if (v.honorario) crearIngresoHonorario(nueva, v.honorario);
        aviso(`Carpeta ${v.nro} creada`);
        abrirCarpeta(nueva.id);
      } },
    ],
  });

  /* Al elegir el tipo de asunto: sugerencias y fecha de firma */
  const sel = $('#f-tipoId', m.fondo);
  const refrescar = () => {
    const t = Store.tipo(sel.value);
    const precio = +$('#f-precio', m.fondo).value || 0;
    const s = Reglas.honorarioSugerido(sel.value, precio);
    $('#f-honorario', m.fondo).value = s.sugerido || '';
    $('#f-fFirmaEst', m.fondo).value = sumarDias($('#f-fApertura', m.fondo).value || iso(HOY()), t.plazoFirma);
    const caja = $('#nc-sug', m.fondo);
    caja.classList.remove('hidden');
    caja.innerHTML = `<b>${esc(t.nombre)}</b> · la carpeta va a nacer con
      <b>${(t.doc || []).length}</b> documento(s) a pedir, <b>${(t.cert || []).length}</b> certificado(s) previo(s)
      y <b>${(t.tram || []).length}</b> trámite(s) posterior(es).<br>
      Honorario de referencia: <b>${pesos(s.referencia)}</b>${t.pctPrecio ? ` (${t.pctPrecio} % del precio)` : ''}.
      ${s.promedio ? ` En el último año cobraron en promedio <b>${pesos(s.promedio)}</b> en ${s.casos} caso(s);
      por eso la sugerencia es <b>${pesos(s.sugerido)}</b>.` : ''}
      ${t.pctPrecio ? `<br>Plazo estimado hasta la firma: ${t.plazoFirma} días.` : ''}`;
  };
  sel.onchange = refrescar;
  $('#f-precio', m.fondo).onchange = refrescar;
  refrescar();
}

function ESCRIBANAS_LISTA() {
  const e = unicos(Store.listar('carpetas').map(c => c.escribana));
  return e.length ? e : [Store.cfg().estudio.titular, Store.cfg().estudio.socia];
}

/* Arma la carátula, como la escribiría la escribana */
function armarCaratula(tipoId, partes, bien) {
  const t = Store.tipo(tipoId);
  const ape = id => {
    const c = Datos.cliente(id);
    if (!c) return '';
    return c.tipo === 'juridica' ? c.razon : c.nombre.split(' ').slice(1, 3).join(' ');
  };
  const a = partes[0] ? ape(partes[0].clienteId) : '';
  const b = partes[1] ? ape(partes[1].clienteId) : '';
  let r;
  if (/^cv-|donacion|usufructo|promesa/.test(tipoId)) r = `${t.nombre.replace('Compraventa de ', 'Compraventa ')} – ${a} a ${b}`;
  else if (/sucesion|particion/.test(tipoId)) r = `${t.nombre} – ${a}`;
  else if (/poder/.test(tipoId)) r = `${t.nombre} – ${a}${b ? ' a ' + b : ''}`;
  else r = `${t.nombre} – ${a || b}`;
  if (bien) r += bien.clase === 'inmueble' ? ` – Padrón ${bien.padron}` : ` – ${bien.matricula}`;
  return r;
}

/* Crea (o actualiza) el ingreso del honorario de una carpeta */
function crearIngresoHonorario(c, honorario) {
  const cfg = Store.cfg();
  const total = honorario * (1 + cfg.iva / 100);
  const existe = Store.listar('movimientos', m => m.clase === 'ingreso' && m.carpetaId === c.id)[0];
  const datos = {
    clase: 'ingreso', fecha: iso(HOY()), carpetaId: c.id,
    clienteId: (c.partes[c.partes.length - 1] || {}).clienteId,
    tipoAsunto: Store.tipo(c.tipoId).nombre,
    concepto: `Honorarios ${Store.tipo(c.tipoId).nombre.toLowerCase()} — carpeta ${c.nro}`,
    monto: Math.round(total), moneda: c.moneda || '$', tc: c.tc, iva: cfg.iva,
    medio: '', estado: 'Pendiente', fEfectiva: null, fEstimada: c.fFirmaEst || sumarDias(iso(HOY()), 20),
  };
  if (existe && existe.estado !== 'Cobrado') Store.editar('movimientos', existe.id, { monto: Math.round(total) });
  else if (!existe) Store.crear('movimientos', datos);
}

/* ===== js/13-carpeta-acciones.js ===== */
/* ============================================================
   ACCIONES DE LA CARPETA
   Todos los botones de la ficha: checklist, trámites, documentos,
   honorarios, cobros, gastos, fondos, estado y partes.
   ============================================================ */

/* ---------- Checklist ---------- */
function tildarChecklist(carpetaId, itemId, hecho) {
  const c = Datos.carpeta(carpetaId);
  const it = (c.checklist || []).find(i => i.id === itemId);
  if (!it) return;
  it.hecho = hecho;
  it.fecha = hecho ? iso(HOY()) : null;
  Store.guardar();
  Reglas.anotarHito(carpetaId, `${hecho ? '✓' : '✗'} ${it.texto}`, 'nota');
  repintar();
}
async function notaChecklist(carpetaId, itemId) {
  const c = Datos.carpeta(carpetaId);
  const it = (c.checklist || []).find(i => i.id === itemId);
  const v = await pedirTexto({ titulo: 'Nota del punto', etiqueta: it.texto, valor: it.nota || '', largo: true });
  if (v === null) return;
  it.nota = v; Store.guardar(); aviso('Nota guardada'); repintar();
}
function borrarChecklist(carpetaId, itemId) {
  if (!confirm('¿Quitar este punto de la checklist de esta carpeta?')) return;
  const c = Datos.carpeta(carpetaId);
  c.checklist = (c.checklist || []).filter(i => i.id !== itemId);
  Store.guardar(); repintar();
}
function agregarChecklist(carpetaId) {
  const campos = [
    { n: 'grupo', e: 'Dónde va', tipo: 'select', ops: [
      { v: 'doc', t: 'Documentos a reunir' }, { v: 'cert', t: 'Certificados previos' }, { v: 'tram', t: 'Trámites posteriores' }] },
    { n: 'texto', e: 'Qué hay que hacer', req: true, ancho: 'ancho-2' },
  ];
  modal({
    titulo: 'Agregar un punto a la checklist',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Agregar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      if (!v.texto) { aviso('Falta escribir qué hay que hacer', 'mal'); return false; }
      const c = Datos.carpeta(carpetaId);
      c.checklist.push({ id: uid('it'), grupo: v.grupo, texto: v.texto, hecho: false, fecha: null, nota: '' });
      Store.guardar(); aviso('Punto agregado'); repintar();
    } }],
  });
}

/* ---------- Trámites ---------- */
function formTramite(carpetaId, id) {
  const t = id ? Store.obtener('tramites', id) : null;
  const campos = [
    { n: 'tipo', e: 'Qué trámite es', tipo: 'sugerido', req: true, ancho: 'ancho-2',
      valor: t?.tipo || '', ops: TIPOS_TRAMITE.map(x => x.nombre), ph: 'Certificado registral, ITP, inscripción…' },
    { n: 'organismo', e: 'Organismo', tipo: 'sugerido', valor: t?.organismo || '', ops: ORGANISMOS },
    { n: 'estado', e: 'Estado', tipo: 'select', valor: t?.estado || 'A solicitar', ops: ESTADOS_TRAMITE },
    { n: 'fSolicitud', e: 'Fecha de solicitud', tipo: 'date', valor: t?.fSolicitud || '' },
    { n: 'fObtencion', e: 'Fecha de obtención', tipo: 'date', valor: t?.fObtencion || '' },
    { n: 'vigencia', e: 'Vigencia (días)', tipo: 'number', valor: t?.vigencia ?? 30,
      ayuda: 'El vencimiento se calcula solo' },
    { n: 'costo', e: 'Costo ($)', tipo: 'number', valor: t?.costo ?? 0 },
    { n: 'pagadoPor', e: 'Lo paga', tipo: 'select', valor: t?.pagadoPor || 'cliente',
      ops: [{ v: 'cliente', t: 'El cliente (gasto de la carpeta)' }, { v: 'estudio', t: 'El estudio (egreso propio)' }] },
    { n: 'obs', e: 'Observación', tipo: 'textarea', valor: t?.obs || '', ancho: 'ancho-2' },
  ];
  modal({
    titulo: id ? 'Editar el trámite' : 'Registrar un trámite',
    ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>

        if (id) Store.editar('tramites', id, datos); else Store.crear('tramites', datos);
        /* Si es un gasto del cliente y no estaba anotado, se anota en la cuenta */
        if (v.pagadoPor === 'cliente' && v.costo > 0) {
          const ya = Store.listar('gastos', g => g.carpetaId === (t?.carpetaId || carpetaId) && g.concepto === v.tipo)[0];
          if (!ya) Store.crear('gastos', { carpetaId: t?.carpetaId || carpetaId, concepto: v.tipo,

            monto: v.costo, fecha: v.fSolicitud || iso(HOY()),
            estado: v.fObtencion ? 'Pagado' : 'Pendiente', fPago: v.fObtencion || null, pagadoCon: 'fondos' });
        }
        Reglas.anotarHito(t?.carpetaId || carpetaId, `${v.tipo}: ${v.estado.toLowerCase()}`, 'nota');
        /* Al tildar el punto de la checklist que le corresponde */
        const c = Datos.carpeta(t?.carpetaId || carpetaId);
        if (['Obtenido', 'Inscripto', 'Presentado'].includes(v.estado)) {
          const it = (c.checklist || []).find(i => !i.hecho && contiene(v.tipo, i.texto.slice(0, 18)));
          if (it) { it.hecho = true; it.fecha = v.fObtencion || iso(HOY()); Store.guardar(); }
        }
        aviso('Trámite guardado'); repintar();
      } },
    ],
  });
}

function registrarCobro(carpetaId) {
  const c = Datos.carpeta(carpetaId);
  const cu = Reglas.cuenta(c);
  const pend = Store.listar('movimientos', m => m.clase === 'ingreso' && m.carpetaId === carpetaId && m.estado !== 'Cobrado');
  const campos = [
    { n: 'monto', e: 'Monto cobrado ($)', tipo: 'number', valor: Math.round(cu.porCobrar), req: true },
    { n: 'medio', e: 'Medio de pago', tipo: 'select', ops: MEDIOS_PAGO },
    { n: 'fecha', e: 'Fecha del cobro', tipo: 'date', valor: iso(HOY()), req: true,
      ayuda: 'Es la fecha que entra al flujo de caja' },
  ];
  modal({
    titulo: 'Registrar un cobro',
    cuerpo: `<div class="nota" style="margin-bottom:14px">Total a facturar: <b>${pesos(cu.totalHonorario)}</b> ·
      ya cobrado: <b>${pesos(cu.cobrado)}</b> · pendiente: <b>${pesos(cu.porCobrar)}</b></div>
      <div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Registrar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      if (!v.monto) { aviso('Falta el monto', 'mal'); return false; }
      const total = pend[0] ? Fin.monto(pend[0]) : 0;
      if (pend[0] && Math.abs(v.monto - total) < 1) {
        /* Cobró todo: se marca ese ingreso como cobrado */
        Store.editar('movimientos', pend[0].id, { estado: 'Cobrado', fEfectiva: v.fecha, medio: v.medio });
      } else {
        /* Cobro parcial: queda un ingreso cobrado y el resto pendiente */
        if (pend[0]) Store.editar('movimientos', pend[0].id, { monto: Math.max(0, total - v.monto) });
        Store.crear('movimientos', { clase: 'ingreso', fecha: v.fecha, carpetaId,
          clienteId: (c.partes[c.partes.length - 1] || {}).clienteId, tipoAsunto: Store.tipo(c.tipoId).nombre,
          concepto: `Cobro a cuenta — carpeta ${c.nro}`, monto: v.monto, moneda: '$', tc: null,
          iva: Store.cfg().iva, medio: v.medio, estado: 'Cobrado', fEfectiva: v.fecha, fEstimada: null });
      }
      Reglas.anotarHito(carpetaId, `Se cobró ${pesos(v.monto)} (${v.medio})`, 'cobro', v.fecha);
      aviso('Cobro registrado'); repintar();
    } }],
  });
}

function editarCarpeta(carpetaId) {
  const c = Datos.carpeta(carpetaId);
  const bienes = Store.listar('bienes');
  const nombreBi = b => b.clase === 'inmueble'
    ? `Padrón ${b.padron} · ${b.localidad} · ${b.direccion}` : `${b.matricula} · ${b.marca} ${b.modelo} ${b.anio}`;
  const campos = [
    { n: 'caratula', e: 'Carátula', req: true, ancho: 'ancho-2', valor: c.caratula },
    { n: 'nro', e: 'N° de carpeta', valor: c.nro },
    { n: 'escribana', e: 'Escribana', tipo: 'select', valor: c.escribana, ops: ESCRIBANAS_LISTA() },
    { n: 'fApertura', e: 'Apertura', tipo: 'date', valor: c.fApertura },
    { n: 'fFirmaEst', e: 'Firma estimada', tipo: 'date', valor: c.fFirmaEst || '' },
    { n: 'fFirmaReal', e: 'Firma real', tipo: 'date', valor: c.fFirmaReal || '' },
    { n: 'precio', e: 'Precio del negocio ($)', tipo: 'number', valor: c.precio || 0 },
    { n: 'bien', e: 'Bien vinculado', tipo: 'sugerido', ancho: 'ancho-2',
      valor: c.bienId ? nombreBi(Datos.bien(c.bienId)) : '', ops: bienes.map(nombreBi) },
  ];
  modal({
    titulo: 'Editar los datos de la carpeta', ancho: 'ancho',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Guardar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      const bien = v.bien ? (bienes.find(b => nombreBi(b) === v.bien) || bienes.find(b => contiene(nombreBi(b), v.bien))) : null;
      /* Si se corre la firma, se avisa qué certificados no llegan */
      if (v.fFirmaEst && v.fFirmaEst !== c.fFirmaEst) {
        const no = Reglas.certificadosQueNoLlegan(c, v.fFirmaEst);
        if (no.length) setTimeout(() => modal({ titulo: '⚠ Certificados a renovar',
          cuerpo: `<div class="nota-legal"><div>Para el <b>${fecha(v.fFirmaEst)}</b> estos certificados

async function editarObservaciones(carpetaId) {
  const c = Datos.carpeta(carpetaId);
  const v = await pedirTexto({ titulo: 'Observaciones de la carpeta', valor: c.obs || '', largo: true });
  if (v === null) return;
  Store.editar('carpetas', carpetaId, { obs: v });
  aviso('Guardado'); repintar();
}

function agregarParte(carpetaId) {
  const clientes = Store.listar('clientes');
  const nombreCl = c => c.tipo === 'juridica' ? `${c.razon} · RUT ${c.rut}` : `${c.nombre} · CI ${c.ci}`;
  const campos = [
    { n: 'cliente', e: 'Persona o empresa', tipo: 'sugerido', req: true, ancho: 'ancho-2',
      ops: clientes.map(nombreCl), ph: 'Apellido, CI o RUT' },
    { n: 'rol', e: 'Rol en el asunto', tipo: 'select', ops: ROLES_PARTE, ancho: 'ancho-2' },
  ];
  modal({
    titulo: 'Agregar una parte',
    cuerpo: `<div class="rejilla">${formulario(campos)}</div>
      <div class="nota">Si la persona no está cargada, creala primero en <b>Clientes</b>.</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Agregar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      const cl = clientes.find(c => nombreCl(c) === v.cliente) || clientes.find(c => contiene(nombreCl(c), v.cliente));
      if (!cl) { aviso('No encontré a esa persona', 'mal'); return false; }
      const c = Datos.carpeta(carpetaId);
      c.partes.push({ clienteId: cl.id, rol: v.rol });
      Store.guardar();
      Reglas.anotarHito(carpetaId, `Se agregó como ${v.rol.toLowerCase()}: ${Datos.nombreCliente(cl.id)}`, 'nota');
      aviso('Parte agregada'); repintar();
    } }],
  });
}

function formCliente(id) {

    { tipo: 'titulo', texto: 'Datos de la empresa' },

    { n: 'inscripcion', e: 'N° de inscripción registral', valor: c?.inscripcion || '' },
    { n: 'constitucion', e: 'Fecha de constitución', tipo: 'date', valor: c?.constitucion || '' },
    { n: 'benefFinal', e: 'Beneficiario final', tipo: 'select', valor: c?.benefFinal || 'Pendiente', ops: ['Declarado', 'Pendiente'] },

    { tipo: 'titulo', texto: 'Contacto' },
    { n: 'domicilio', e: 'Domicilio', ancho: 'ancho-2', valor: c?.domicilio || '' },
    { n: 'tel', e: 'Teléfono', tipo: 'tel', valor: c?.tel || '', ph: '+598 9…' },
    { n: 'email', e: 'Correo', tipo: 'email', valor: c?.email || '' },
    { n: 'origen', e: 'Cómo nos conoció', tipo: 'sugerido', valor: c?.origen || '', ops: ORIGEN_LISTA() },
    { n: 'nota', e: 'Nota', tipo: 'textarea', ancho: 'ancho-2', valor: c?.nota || '' },
  ] : [
    { tipo: 'titulo', texto: 'Datos de la persona' },
    { n: 'nombre', e: 'Nombre completo', req: true, ancho: 'ancho-2', valor: c?.nombre || '' },
    { n: 'ci', e: 'Cédula de identidad', req: true, valor: c?.ci || '', ph: '4.123.456-7' },

      ayuda: 'La página avisa si vence antes de una firma' },
    { n: 'nacimiento', e: 'Fecha de nacimiento', tipo: 'date', valor: c?.nacimiento || '' },
    { n: 'nacionalidad', e: 'Nacionalidad', tipo: 'sugerido', valor: c?.nacionalidad || 'Uruguaya',
      ops: ['Uruguaya', 'Brasileña', 'Argentina', 'Española', 'Otra'] },
    { n: 'estadoCivil', e: 'Estado civil', tipo: 'select', valor: c?.estadoCivil || 'Soltero/a',
      ops: ['Soltero/a', 'Casado/a', 'Divorciado/a', 'Viudo/a', 'Concubinato'] },
    { n: 'conyuge', e: 'Nombre del cónyuge', valor: c?.conyuge || '' },
    { n: 'regimen', e: 'Régimen de bienes', tipo: 'select', valor: c?.regimen || '',
      ops: ['', 'Sociedad conyugal', 'Separación de bienes'] },
    { n: 'profesion', e: 'Profesión', tipo: 'sugerido', valor: c?.profesion || '', ops: PROFES_LISTA() },
    { tipo: 'titulo', texto: 'Contacto' },
    { n: 'domicilio', e: 'Domicilio', ancho: 'ancho-2', valor: c?.domicilio || '' },
    { n: 'tel', e: 'Teléfono', tipo: 'tel', valor: c?.tel || '', ph: '+598 9…' },
    { n: 'email', e: 'Correo', tipo: 'email', valor: c?.email || '' },
    { n: 'origen', e: 'Cómo nos conoció', tipo: 'sugerido', valor: c?.origen || '', ops: ORIGEN_LISTA() },
    { n: 'nota', e: 'Nota', tipo: 'textarea', ancho: 'ancho-2', valor: c?.nota || '' },
  ];

  let campos = armar(juridica);
  const m = modal({
    titulo: id ? 'Editar el cliente' : 'Nuevo cliente', ancho: 'ancho',

        <button class="on" data-t="fisica">Persona física</button>
        <button data-t="juridica">Empresa</button></div>`}
      <div class="rejilla" id="cl-campos">${formulario(campos)}</div>`,
    acciones: [{ texto: 'Cancelar', clase: 's' }, { texto: 'Guardar', clase: 'p', hacer: f => {
      const v = leerFormulario(campos, f);
      const esJ = campos.some(x => x.n === 'razon');
      if (esJ ? !v.razon : !v.nombre) { aviso('Falta el nombre', 'mal'); return false; }
      const datos = esJ
        ? { tipo: 'juridica', razon: v.razon, tipoSoc: v.tipoSoc, rut: v.rut, inscripcion: v.inscripcion,

      repintar();
    } }],
  });

  /* Cambiar entre persona y empresa al crear */
  $$('#cl-tipo button', m.fondo).forEach(b => b.onclick = () => {
    $$('#cl-tipo button', m.fondo).forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    campos = armar(b.dataset.t === 'juridica');
    $('#cl-campos', m.fondo).innerHTML = formulario(campos);
  });
}
const ORIGEN_LISTA = () => unicos(Store.listar('clientes').map(c => c.origen));
